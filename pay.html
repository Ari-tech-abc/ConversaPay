<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConversaPay - תשלום מאובטח</title>
    <link rel="stylesheet" href="frontend/css/main.css">
    <style>
        .payment-container {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }
        
        .payment-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .payment-header h1 {
            color: var(--dark);
            font-size: 1.6rem;
            margin: 0 0 10px 0;
        }
        
        .payment-header p {
            color: var(--gray-500);
            margin: 0;
            font-size: 0.95rem;
        }
        
        .order-summary {
            background: var(--gray-100);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 1rem;
        }
        
        .summary-row:last-child {
            margin-bottom: 0;
            padding-top: 10px;
            border-top: 2px solid var(--gray-300);
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--dark);
        }
        
        .payment-form {
            display: none;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--gray-900);
            font-size: 0.9rem;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--gray-300);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            font-family: var(--font-family);
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }
        
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }
        
        .card-row {
            display: flex;
            gap: 15px;
        }
        
        .card-row .form-group {
            flex: 1;
        }
        
        .pay-button {
            background: var(--success);
            color: white;
            border: none;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background var(--transition-fast);
        }
        
        .pay-button:hover:not(:disabled) {
            background: var(--success-dark);
        }
        
        .pay-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .secure-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--gray-500);
        }
        
        .success-screen {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }
        
        .success-icon {
            color: var(--success);
            font-size: 4rem;
            margin-bottom: 20px;
        }
        
        .success-screen h2 {
            color: var(--dark);
            margin-bottom: 15px;
        }
        
        .success-screen p {
            color: var(--gray-700);
            margin-bottom: 10px;
        }
        
        .loading-spinner {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--gray-300);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="payment-container" id="paymentBox">
            <div class="payment-header">
                <h1 id="bizName">טוען פרטי עסק...</h1>
                <p>קופת תשלום מאובטחת</p>
            </div>

            <div class="order-summary">
                <div class="summary-row">
                    <span>פריט:</span>
                    <span id="itemName">טוען...</span>
                </div>
                <div class="summary-row">
                    <span>סך הכל לתשלום:</span>
                    <span id="itemAmount">₪0.00</span>
                </div>
            </div>

            <div class="loading-spinner" id="loadingSpinner">
                <div class="spinner"></div>
                <p>מנתב לתשלום מאובטח...</p>
            </div>

            <form id="paymentForm" class="payment-form" style="display:block;">
                <div id="paymentError" class="alert alert-error d-none" style="margin-bottom: 20px; padding: 12px; background: #fee; border: 1px solid #fcc; border-radius: 8px; color: #c33;"></div>
                <div class="form-group">
                    <label for="fullName">שם מלא על הכרטיס</label>
                    <input type="text" id="fullName" required placeholder="ישראל ישראלי">
                </div>

                <div class="form-group">
                    <label for="email">אימייל לקבלת קבלה</label>
                    <input type="email" id="email" required placeholder="your@email.com">
                </div>

                <div class="form-group">
                    <label for="cardNumber">מספר כרטיס אשראי</label>
                    <input type="text" id="cardNumber" required maxlength="16" placeholder="4242424242424242">
                </div>

                <div class="card-row">
                    <div class="form-group">
                        <label for="expiry">תוקף (MM/YY)</label>
                        <input type="text" id="expiry" required maxlength="5" placeholder="12/29">
                    </div>
                    <div class="form-group">
                        <label for="cvv">CVV (3 ספרות)</label>
                        <input type="text" id="cvv" required maxlength="3" placeholder="123">
                    </div>
                </div>

                <button type="submit" class="pay-button" id="submitBtn">בצע תשלום מאובטח</button>
            </form>

            <div class="secure-footer">
                🔒 תשלום מאובטח באמצעות Stripe<br>
                <small>פרטי הכרטיס מוצפנים ומאובטחים בתקן PCI-DSS</small>
            </div>
        </div>

        <div class="payment-container success-screen" id="successBox">
            <div class="success-icon">✓</div>
            <h2>התשלום בוצע בהצלחה!</h2>
            <p>אישור עסקה וחשבונית נשלחו לכתובת המייל שלך.</p>
            <p style="font-size: 0.9rem; color: var(--gray-500); margin-top: 20px;">
                מנתב לדשבורד...
            </p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order');
        const sessionId = urlParams.get('session_id');
        
        const BACKEND_URL = window.location.origin;
        const DASHBOARD_URL = `${BACKEND_URL}/dashboard.html`;

        window.onload = async function() {
            // If session_id is present, show success and redirect to dashboard
            if (sessionId) {
                document.getElementById('paymentBox').style.display = 'none';
                document.getElementById('successBox').style.display = 'block';
                
                // Redirect to dashboard after 2 seconds
                setTimeout(() => {
                    window.location.href = DASHBOARD_URL;
                }, 2000);
                return;
            }
            
            // Order-based payment flow
            if (!orderId) {
                document.getElementById('bizName').textContent = "שגיאה בנתוני ההזמנה";
                document.getElementById('paymentForm').style.display = 'none';
                return;
            }

            // Fetch order summary
            try {
                const response = await fetch(`${BACKEND_URL}/api/v1/orders/${orderId}/summary`);
                if (!response.ok) {
                    throw new Error('Failed to fetch order details');
                }
                
                const orderData = await response.json();
                
                // Update UI with order details
                document.getElementById('bizName').textContent = orderData.business_name || 'תשלום מאובטח';
                
                // Build product summary
                let productSummary = '';
                if (orderData.items && orderData.items.length > 0) {
                    const item = orderData.items[0];
                    productSummary = `${item.name} x${item.quantity}`;
                }
                document.getElementById('itemName').textContent = productSummary || 'מוצרים';
                
                const currencySymbol = orderData.currency === 'ILS' ? '₪' : '$';
                document.getElementById('itemAmount').textContent = `${currencySymbol}${orderData.total.toFixed(2)}`;
                
                // Store order data for payment processing
                window.orderData = orderData;
                
            } catch (error) {
                console.error('Error fetching order:', error);
                document.getElementById('bizName').textContent = "שגיאה בחיבור לשרת";
                document.getElementById('paymentForm').style.display = 'none';
            }
        };

        document.getElementById('paymentForm')?.addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const errorDiv = document.getElementById('paymentError');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'מנתב לתשלום מאובטח...';
            errorDiv.classList.add('d-none');
            
            // Show loading
            document.getElementById('paymentForm').style.display = 'none';
            document.getElementById('loadingSpinner').style.display = 'block';
            
            try {
                // Create Stripe checkout session
                const checkoutResponse = await fetch(`${BACKEND_URL}/api/v1/payments/checkout-session`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        business_id: window.orderData.business_id,
                        order_id: orderId,
                        customer_email: email,
                        customer_name: fullName
                    })
                });
                
                if (!checkoutResponse.ok) {
                    const errorData = await checkoutResponse.json().catch(() => ({}));
                    throw new Error(errorData.detail || 'Failed to create checkout session');
                }
                
                const checkoutData = await checkoutResponse.json();
                
                // Redirect to Stripe Checkout
                if (checkoutData.url) {
                    window.location.href = checkoutData.url;
                } else {
                    throw new Error('No checkout URL returned');
                }
                
            } catch (error) {
                console.error('Payment error:', error);
                
                // Show error message
                errorDiv.textContent = `שגיאה: ${error.message}`;
                errorDiv.classList.remove('d-none');
                
                // Show form again
                document.getElementById('loadingSpinner').style.display = 'none';
                document.getElementById('paymentForm').style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'המשך לתשלום מאובטח';
            }
        });
    </script>

</body>
</html>

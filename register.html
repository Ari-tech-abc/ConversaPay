<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConversaPay - הרשמה</title>
    <link rel="stylesheet" href="frontend/css/main.css">
    <style>
        .auth-container {
            max-width: 420px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .auth-header h1 {
            color: var(--dark);
            font-size: 1.8rem;
            margin: 0 0 10px 0;
        }
        
        .auth-header p {
            color: var(--gray-500);
            margin: 0;
            font-size: 0.95rem;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--gray-900);
            font-size: 0.9rem;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--gray-300);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            font-family: var(--font-family);
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }
        
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }
        
        .password-hint {
            font-size: 0.85rem;
            color: var(--gray-500);
            margin-top: 5px;
        }
        
        .auth-button {
            background: var(--success);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background var(--transition-fast);
        }
        
        .auth-button:hover:not(:disabled) {
            background: var(--success-dark);
        }
        
        .auth-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--gray-100);
        }
        
        .auth-footer p {
            color: var(--gray-500);
            margin: 0;
            font-size: 0.95rem;
        }
        
        .auth-footer a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }
        
        .auth-footer a:hover {
            text-decoration: underline;
        }
        
        .error-message {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .success-message {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .success-message.show {
            display: block;
        }
        
        .business-info {
            background: var(--gray-100);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: var(--gray-700);
        }
        
        .business-info strong {
            color: var(--gray-900);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-container">
            <div class="auth-header">
                <h1>הרשמה למערכת</h1>
                <p>צור חשבון חדש והתחל למכור</p>
            </div>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <div class="business-info">
                <strong>💡 מה תקבל:</strong><br>
                • עזר AI חכם לקניות<br>
                • ניהול מוצרים קל<br>
                • תשלומים מאובטחים<br>
                • דשבורד מפורט
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="fullName">שם מלא</label>
                    <input type="text" id="fullName" required placeholder="ישראל ישראלי" autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">אימייל</label>
                    <input type="email" id="email" required placeholder="your@email.com" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">סיסמה</label>
                    <input type="password" id="password" required placeholder="********" minlength="8" autocomplete="new-password">
                    <p class="password-hint">לפחות 8 תווים</p>
                </div>

                <div class="form-group">
                    <label for="businessName">שם העסק</label>
                    <input type="text" id="businessName" required placeholder="העסק שלי">
                </div>

                <button type="submit" class="auth-button" id="registerBtn">צור חשבון</button>
            </form>

            <div class="auth-footer">
                <p>כבר יש לך חשבון? <a href="login.html">התחבר כאן</a></p>
            </div>
        </div>
    </div>

    <script src="frontend/js/auth.js"></script>
</body>
</html>

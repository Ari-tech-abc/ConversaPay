<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ConversaPay | התשלום בוטל</title>
  <link rel="stylesheet" href="/frontend/html/conversapay-ui.css">
  <style>
    .result-shell{min-height:calc(100vh - 92px);display:grid;place-items:center;padding-top:20px}.result-card{width:min(620px,100%);text-align:center;display:grid;gap:22px;justify-items:center}.result-icon{width:86px;height:86px;border-radius:28px;display:grid;place-items:center;background:rgba(247,185,85,.14);border:1px solid rgba(247,185,85,.3);color:#ffd793;font-size:2.4rem;box-shadow:0 18px 48px rgba(247,185,85,.12)}.result-copy{max-width:46ch}.result-copy h1{font-size:clamp(2rem,5vw,3.1rem);margin-bottom:10px}.result-actions{width:min(440px,100%)}.sandbox-note{padding:11px 14px;border-radius:999px;color:#ffd793;background:rgba(247,185,85,.12);border:1px solid rgba(247,185,85,.25);font-size:.84rem;font-weight:700}.next-step{width:100%;padding:16px;border-radius:20px;text-align:right;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}.next-step strong{display:block;margin-bottom:4px}
  </style>
</head>
<body class="cp-page">
  <header class="cp-topbar"><a class="cp-brand" href="/"><span class="cp-brand-mark">CP</span><span>ConversaPay</span></a><span class="cp-badge">Stripe</span></header>
  <main class="cp-shell result-shell">
    <section class="cp-card result-card" aria-live="polite">
      <div class="result-icon" aria-hidden="true">!</div>
      <div class="result-copy"><span class="cp-kicker" style="justify-content:center">לא בוצע חיוב</span><h1>התשלום בוטל</h1><p class="cp-muted">לא בוצע חיוב ולא נוצר שדרוג. אפשר לחזור לדאשבורד ולנסות שוב בכל רגע.</p></div>
      <span class="sandbox-note">מצב בדיקות / Sandbox</span>
      <div class="next-step"><strong>מה עכשיו?</strong><span class="cp-muted">בדוק את פרטי התשלום, את הגדרות Stripe Sandbox, ואם צריך נסה שוב ממסך השדרוג.</span></div>
      <div class="cp-actions result-actions"><a class="cp-button" href="/dashboard.html">חזרה לדאשבורד</a><a class="cp-button-secondary" href="/upgrade.html">חזרה לבחירת מסלול</a></div>
    </section>
  </main>
</body>
</html>

<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>ConversaPay | התשלום בוטל</title>
  <link rel="stylesheet" href="/frontend/html/conversapay-ui.css">
</head>
<body class="cp-page">
  <header class="cp-topbar">
    <a class="cp-brand" href="/"><span class="cp-brand-mark">CP</span><span>ConversaPay</span></a>
    <span class="cp-badge">Stripe</span>
  </header>
  <main class="cp-shell cp-center-shell">
    <section class="cp-card cp-text-center">
      <span class="cp-kicker cp-text-center">לא בוצע חיוב</span>
      <h1>התשלום בוטל</h1>
      <p class="cp-muted">לא בוצע חיוב ולא נוצר שדרוג. אפשר לחזור לדאשבורד ולנסות שוב בכל רגע.</p>
      <span class="cp-badge warn">מצב בדיקות / Sandbox</span>
      <div class="cp-panel cp-mt-md">
        <strong>מה עכשיו?</strong>
        <p class="cp-muted">בדוק את פרטי התשלום, את הגדרות Stripe Sandbox, ואם צריך נסה שוב ממסך השדרוג.</p>
      </div>
      <div class="cp-actions">
        <a class="cp-button" href="/dashboard">חזרה לדאשבורד</a>
        <a class="cp-button-secondary" href="/upgrade">חזרה לבחירת מסלול</a>
      </div>
    </section>
  </main>
</body>
</html>

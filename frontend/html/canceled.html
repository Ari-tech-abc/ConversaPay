<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>ConversaPay | התשלום בוטל</title>
  <link rel="stylesheet" href="/frontend/html/conversapay-ui.css">

<link rel="stylesheet" href="/frontend/css/talk2pay-theme.css"><script src="/frontend/js/workspace-ui.js" defer></script></head>
<body data-t2p-page="canceled" class="cp-page">
  <header class="cp-topbar">
    <a class="cp-brand" href="/"><span class="cp-brand-mark">CP</span><span>ConversaPay</span></a>
    <span class="cp-badge">Stripe</span>
  </header>
  <main class="cp-shell cp-center-shell">
    <section class="cp-card cp-text-center">
      <span class="cp-kicker cp-text-center">התשלום לא הושלם</span>
      <h1>התשלום בוטל</h1>
      <p class="cp-muted">תהליך התשלום בוטל והמסלול לא שודרג. אפשר לחזור לבחירת מסלול ולנסות שוב.</p>

      <div class="cp-panel cp-mt-md">
        <strong>מה עכשיו?</strong>
        <p class="cp-muted">לניסיון נוסף, חוזרים לבחירת מסלול ובודקים את פרטי התשלום.</p>
      </div>
      <div class="cp-actions">
        <a class="cp-button" href="/dashboard">חזרה ללוח הבקרה</a>
        <a class="cp-button-secondary" href="/upgrade">חזרה לבחירת מסלול</a>
      </div>
    </section>
  </main>
  <script src="/frontend/js/language-switcher.js"></script>

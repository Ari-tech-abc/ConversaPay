<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>ConversaPay | התשלום בוטל</title>
  <link rel="stylesheet" href="/frontend/html/conversapay-ui.css">
  <style>
    .result-shell{min-height:calc(100dvh - 92px);display:grid;place-items:center;padding:24px 0 40px}.result-card{width:min(620px,100%);text-align:center;display:grid;gap:20px;justify-items:center;min-width:0}.result-icon{width:82px;height:82px;border-radius:24px;display:grid;place-items:center;background:rgba(247,185,85,.14);border:1px solid rgba(247,185,85,.3);color:#ffd793;font-size:2.4rem;box-shadow:0 18px 48px rgba(247,185,85,.12)}.result-copy{max-width:46ch;width:100%;min-width:0}.result-copy h1{font-size:clamp(1.9rem,5vw,3.1rem);margin:10px 0;line-height:1.1}.result-copy p{overflow-wrap:anywhere}.result-actions{width:min(440px,100%);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.result-actions>*{min-width:0}.sandbox-note,.next-step{width:100%;max-width:100%;padding:12px 14px;border-radius:18px;color:#ffd793;background:rgba(247,185,85,.12);border:1px solid rgba(247,185,85,.25);font-size:.88rem;font-weight:700;overflow-wrap:anywhere}.next-step{text-align:right;color:var(--cp-text);background:rgba(255,255,255,.035);border-color:rgba(255,255,255,.07);font-weight:400}.next-step strong{display:block;margin-bottom:4px}@media(max-width:560px){.result-shell{min-height:auto;padding:18px 0 28px}.result-card{gap:16px}.result-icon{width:68px;height:68px;border-radius:20px;font-size:2rem}.result-actions{grid-template-columns:1fr}.result-actions>*{width:100%}.next-step{padding:14px}}
  </style>
</head>
<body class="cp-page">
  <header class="cp-topbar"><a class="cp-brand" href="/"><span class="cp-brand-mark">CP</span><span>ConversaPay</span></a><span class="cp-badge">Stripe</span></header>
  <main class="cp-shell result-shell"><section class="cp-card result-card"><div class="result-icon" aria-hidden="true">!</div><div class="result-copy"><span class="cp-kicker" style="justify-content:center">לא בוצע חיוב</span><h1>התשלום בוטל</h1><p class="cp-muted">לא בוצע חיוב ולא נוצר שדרוג. אפשר לחזור לדאשבורד ולנסות שוב בכל רגע.</p></div><span class="sandbox-note">מצב בדיקות / Sandbox</span><div class="next-step"><strong>מה עכשיו?</strong><span class="cp-muted">בדוק את פרטי התשלום, את הגדרות Stripe Sandbox, ואם צריך נסה שוב ממסך השדרוג.</span></div><div class="cp-actions result-actions"><a class="cp-button" href="/dashboard.html">חזרה לדאשבורד</a><a class="cp-button-secondary" href="/upgrade.html">חזרה לבחירת מסלול</a></div></section></main>
</body>
</html>

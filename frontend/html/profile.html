<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Talk2Pay | פרופיל</title>
<link rel="stylesheet" href="/frontend/html/conversapay-ui.css">
<style>
.profile-shell{width:min(760px,calc(100% - 28px));margin:24px auto 64px}.profile-hero{display:flex;align-items:center;gap:16px;margin-bottom:18px}.profile-avatar{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,#735ff0,#5845d7 58%,#3e9fd9);color:#fff;font-size:1.35rem;font-weight:800;box-shadow:0 14px 32px rgba(91,79,232,.2)}.profile-card{padding:26px!important}.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.profile-grid .full{grid-column:1/-1}.profile-note{padding:12px 14px;border-radius:13px;background:#f7f6ff;border:1px solid #e4e0ff;color:#615a86;font-size:.88rem}.profile-actions{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}@media(max-width:620px){.profile-shell{width:calc(100% - 20px);margin-top:12px}.profile-card{padding:18px!important}.profile-grid{grid-template-columns:1fr}.profile-grid .full{grid-column:auto}.profile-avatar{width:54px;height:54px;border-radius:17px}}
</style>
</head>
<body class="cp-page">
<div class="cp-toast-wrap" id="toastWrap"></div>
<header class="cp-topbar"><a class="cp-brand" href="/dashboard"><span class="cp-brand-mark">T2P</span><span>Talk2Pay</span></a><a class="cp-backlink" href="/dashboard">חזרה לדאשבורד</a></header>
<main class="profile-shell"><section class="cp-card profile-card"><div class="profile-hero"><div class="profile-avatar" id="avatar">א</div><div><h1>פרופיל</h1><p class="cp-muted">פרטי בעל העסק והעסק בלבד.</p></div></div><div class="profile-note">אבטחה, התראות, חיוב, API ואינטגרציות מנוהלים מעכשיו דרך <a class="cp-link" href="/settings">הגדרות</a>.</div><form id="profileForm" class="profile-grid" style="margin-top:18px"><div class="cp-field"><label class="cp-label" for="fullName">שם מלא</label><input class="cp-input" id="fullName" maxlength="255" required></div><div class="cp-field"><label class="cp-label" for="email">אימייל</label><input class="cp-input" id="email" type="email" disabled></div><div class="cp-field"><label class="cp-label" for="phone">טלפון</label><input class="cp-input" id="phone" maxlength="40" inputmode="tel"></div><div class="cp-field"><label class="cp-label" for="businessName">שם העסק</label><input class="cp-input" id="businessName" maxlength="255" required></div><div class="profile-actions full"><button class="cp-button" id="save" type="submit">שמירת פרטים</button><a class="cp-button-secondary" href="/settings">הגדרות מתקדמות</a></div></form></section></main>
<script>
(()=>{'use strict';const API='/api/v1',$=id=>document.getElementById(id),token=localStorage.getItem('access_token')||localStorage.getItem('conversapay_auth_token')||sessionStorage.getItem('access_token')||sessionStorage.getItem('conversapay_auth_token');if(!token){location.replace('/login');return}const auth={Authorization:'Bearer '+token};let business=null;function initials(name){return String(name||'א').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()||'א'}function toast(text,type='error'){const wrap=$('toastWrap'),t=document.createElement('div');t.className='cp-toast '+type;t.innerHTML='<span class="cp-toast-icon">'+(type==='error'?'✕':'✓')+'</span><span></span><button class="cp-toast-close">×</button>';t.children[1].textContent=text;t.children[2].onclick=()=>t.remove();wrap.appendChild(t)}async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{...auth,...(opt.headers||{})}}),d=await r.json().catch(()=>({}));if(r.status===401){location.replace('/login');throw Error('נדרשת התחברות')}if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:(d.detail?.message||'הפעולה נכשלה'));return d}async function load(){try{const [profileData,businesses]=await Promise.all([api('/profile'),api('/businesses')]);const p=profileData.profile||{};business=Array.isArray(businesses)?businesses[0]:null;$('fullName').value=p.full_name||'';$('email').value=profileData.email||'';$('phone').value=p.phone||'';$('businessName').value=business?.business_name||'';$('avatar').textContent=initials(p.full_name||profileData.email)}catch(e){toast(e.message||'לא ניתן לטעון את הפרופיל')}}$('profileForm').onsubmit=async e=>{e.preventDefault();const b=$('save');b.disabled=true;try{await api('/profile',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:$('fullName').value.trim(),phone:$('phone').value.trim()})});if(business){business=await api('/businesses/'+encodeURIComponent(business.id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({business_name:$('businessName').value.trim()})})}$('avatar').textContent=initials($('fullName').value);toast('הפרטים נשמרו בהצלחה','success')}catch(e){toast(e.message||'שמירת הפרטים נכשלה')}finally{b.disabled=false}};load()})();
</script>
</body></html>

<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ConversaPay - פרופיל</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1419;--card:rgba(26,31,46,.78);--text:#f5f7fa;--muted:#a0aec0;--a:#6366f1;--b:#8b5cf6;--line:rgba(255,255,255,.1)}*{box-sizing:border-box;font-family:Rubik,sans-serif}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,#24204d 0,transparent 35%),linear-gradient(135deg,var(--bg),#1a1f2e);color:var(--text)}main{max-width:720px;margin:auto;padding:32px 18px}.back{color:var(--muted);text-decoration:none}.card{margin-top:24px;padding:28px;background:var(--card);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(18px);box-shadow:0 20px 48px #0006}.head{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:24px}.avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));font-size:1.8rem;font-weight:800}.muted{color:var(--muted)}label{display:block;margin:16px 0 7px;font-weight:600}input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--line);background:#ffffff0d;color:var(--text);font-size:1rem}input:focus{outline:2px solid var(--a);outline-offset:2px}button{border:0;border-radius:11px;padding:13px 20px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-weight:700;cursor:pointer}.actions{display:flex;justify-content:flex-start;gap:10px;margin-top:24px}.notice{margin-bottom:16px;padding:12px 14px;border-radius:10px;background:#10b98122;color:#86efac}.error{background:#ef444422;color:#fca5a5}
</style></head><body><main><a class="back" href="dashboard.html">← חזרה לדאשבורד</a><section class="card"><div class="head"><div class="avatar" id="avatar">א</div><div><h1 id="nameDisplay">פרופיל</h1><p class="muted" id="emailDisplay">טוען...</p></div></div><div id="notice" role="status" hidden></div><form id="profileForm"><label for="fullName">שם מלא</label><input id="fullName" autocomplete="name" required maxlength="255"><label for="email">אימייל</label><input id="email" type="email" disabled><div class="actions"><a class="back" href="dashboard.html">ביטול</a><button type="submit" id="save">שמור שינויים</button></div></form></section></main>
<script>
const API='/api/v1', token=localStorage.getItem('access_token'); if(!token) location.href='login.html';
const $=id=>document.getElementById(id), notice=(text,error=false)=>{const n=$('notice');n.textContent=text;n.className=error?'notice error':'notice';n.hidden=false;setTimeout(()=>n.hidden=true,4000)};
async function load(){const r=await fetch(`${API}/auth/me`,{headers:{Authorization:`Bearer ${token}`}});if(!r.ok){localStorage.removeItem('access_token');location.href='login.html';return}const d=await r.json(),p=d.profile||{};const name=p.full_name||'';$('fullName').value=name;$('email').value=d.email||p.email||'';$('emailDisplay').textContent=d.email||p.email||'';$('nameDisplay').textContent=name||'פרופיל';$('avatar').textContent=(name||d.email||'א').trim().charAt(0).toUpperCase()}
$('profileForm').addEventListener('submit',async e=>{e.preventDefault();const name=$('fullName').value.trim();if(!name)return notice('נא להזין שם מלא',true);$('save').disabled=true;try{const qs=new URLSearchParams({full_name:name});const r=await fetch(`${API}/auth/me?${qs}`,{method:'PUT',headers:{Authorization:`Bearer ${token}`}});if(!r.ok)throw new Error();await load();notice('הפרופיל עודכן בהצלחה')}catch(_){notice('שגיאה בעדכון הפרופיל',true)}finally{$('save').disabled=false}});load();
</script></body></html>

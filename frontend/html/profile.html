<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ConversaPay - פרופיל</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F1419;--card:rgba(26,31,46,.72);--text:#F5F7FA;--muted:#A0AEC0;--a:#6366F1;--b:#8B5CF6;--border:rgba(255,255,255,.1)}*{box-sizing:border-box;font-family:Rubik,system-ui,sans-serif}body{margin:0;background:linear-gradient(135deg,var(--bg),#1a1f2e,var(--bg));color:var(--text);min-height:100vh}.container{width:min(800px,calc(100% - 32px));margin:auto;padding:32px 0}.back-link{display:inline-flex;gap:8px;align-items:center;color:var(--muted);text-decoration:none;margin-bottom:24px}.back-link:hover{color:var(--text)}header{text-align:center;margin-bottom:28px}h1{margin:0 0 8px;background:linear-gradient(135deg,var(--a),var(--b));-webkit-background-clip:text;color:transparent}.muted{color:var(--muted)}.card{background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:20px;padding:28px;box-shadow:0 20px 48px rgba(0,0,0,.35)}.card-header{display:flex;align-items:center;gap:18px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border)}.avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));font-size:1.8rem;font-weight:700}.form-group{margin-bottom:18px}.form-group label{display:block;margin-bottom:8px;color:var(--muted);font-weight:600}.form-group input{width:100%;padding:13px 15px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:1rem;min-height:46px}.form-group input:focus{outline:2px solid var(--a);outline-offset:2px}.form-group input:disabled{opacity:.55}.card-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:20px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;border:0;border-radius:10px;font-weight:700;cursor:pointer;text-decoration:none;min-height:44px}.btn-primary{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}.btn-secondary{background:transparent;color:var(--muted);border:1px solid var(--border)}.alert{padding:12px 14px;border-radius:10px;margin-bottom:16px}.success{background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);color:#6EE7B7}.error{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#FCA5A5}.loading{text-align:center;padding:32px;color:var(--muted)}
</style>
</head>
<body><main class="container"><a href="dashboard.html" class="back-link">← חזרה לדאשבורד</a><header><h1>פרופיל</h1><p class="muted">נהל את הפרטים האישיים שלך</p></header><div id="loading" class="loading">טוען נתונים...</div><section id="profileContent" class="card" hidden><div class="card-header"><div class="avatar" id="avatarDisplay">א</div><div><h2 id="nameDisplay">-</h2><p id="emailDisplay" class="muted">-</p></div></div><div id="message" role="status" aria-live="polite"></div><form id="profileForm"><div class="form-group"><label for="fullName">שם מלא</label><input type="text" id="fullName" autocomplete="name" required maxlength="255"></div><div class="form-group"><label for="email">אימייל</label><input type="email" id="email" disabled></div><div class="card-actions"><a class="btn btn-secondary" href="dashboard.html">ביטול</a><button type="submit" class="btn btn-primary">שמור שינויים</button></div></form></section></main>
<script>
const API_BASE_URL='/api/v1';
const token=()=>localStorage.getItem('access_token')||sessionStorage.getItem('access_token');
function authHeaders(){return {Authorization:`Bearer ${token()}`,'Content-Type':'application/json'};}
function redirect(){localStorage.removeItem('access_token');sessionStorage.removeItem('access_token');window.location.href='login.html';}
function showMessage(text,type){const el=document.getElementById('message');el.className=`alert ${type}`;el.textContent=text;}
async function loadProfile(){const response=await fetch(`${API_BASE_URL}/auth/me`,{headers:authHeaders()});if(response.status===401){redirect();return;}if(!response.ok)throw new Error('profile');const data=await response.json();const profile=data.profile||{};const name=profile.full_name||data.email||'א';document.getElementById('avatarDisplay').textContent=name.charAt(0).toUpperCase();document.getElementById('nameDisplay').textContent=profile.full_name||'לא צוין';document.getElementById('emailDisplay').textContent=data.email||'-';document.getElementById('fullName').value=profile.full_name||'';document.getElementById('email').value=data.email||'';document.getElementById('loading').hidden=true;document.getElementById('profileContent').hidden=false;}
document.getElementById('profileForm').addEventListener('submit',async e=>{e.preventDefault();const full_name=document.getElementById('fullName').value.trim();if(!full_name){showMessage('נא להזין שם מלא','error');return;}const res=await fetch(`${API_BASE_URL}/auth/me`,{method:'PUT',headers:authHeaders(),body:new URLSearchParams({full_name})});if(res.status===401){redirect();return;}if(!res.ok){showMessage('שגיאה בעדכון הפרופיל','error');return;}showMessage('הפרופיל עודכן בהצלחה','success');await loadProfile();});
if(!token())redirect();else loadProfile().catch(()=>{document.getElementById('loading').textContent='שגיאה בטעינת הפרופיל';});
</script></body></html>

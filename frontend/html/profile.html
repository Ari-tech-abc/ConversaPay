<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConversaPay - פרופיל</title>
    <meta name="description" content="ניהול פרופיל משתמש">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0F1419;
            --bg-secondary: #1A1F2E;
            --bg-card: rgba(26, 31, 46, 0.6);
            --text-primary: #F5F7FA;
            --text-secondary: #A0AEC0;
            --accent-primary: #6366F1;
            --accent-secondary: #8B5CF6;
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        * {
            font-family: 'Rubik', sans-serif;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, var(--bg-primary) 0%, #1a1f2e 50%, #0f1419 100%);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-md);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            color: white;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .form-group input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .card-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 20px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent-primary);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.active {
            display: block;
        }

        .error {
            background: rgba(239, 68, 68, 0.15);
            color: #EF4444;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .success {
            background: rgba(16, 185, 129, 0.15);
            color: #10B981;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="dashboard.html" class="back-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            חזרה לדאשבורד
        </a>

        <header>
            <h1>פרופיל</h1>
            <p style="color: var(--text-secondary);">נהל את הפרטים האישיים שלך</p>
        </header>

        <div class="loading" id="loading">
            <p>טוען נתונים...</p>
        </div>

        <div id="profileContent">
            <div class="card">
                <div class="card-header">
                    <div class="avatar" id="avatarDisplay">א</div>
                    <div>
                        <h2 id="nameDisplay">-</h2>
                        <p id="emailDisplay" style="color: var(--text-secondary);">-</p>
                    </div>
                </div>

                <form id="profileForm">
                    <div class="form-group">
                        <label for="fullName">שם מלא</label>
                        <input type="text" id="fullName" name="fullName" required>
                    </div>

                    <div class="form-group">
                        <label for="email">אימייל</label>
                        <input type="email" id="email" name="email" disabled>
                    </div>

                    <div class="form-group">
                        <label for="phone">טלפון</label>
                        <input type="tel" id="phone" name="phone">
                    </div>

                    <div class="card-actions">
                        <button type="button" class="btn btn-secondary" onclick="window.location.href='dashboard.html'">ביטול</button>
                        <button type="submit" class="btn btn-primary">שמור שינויים</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = '/api/v1';

        function checkAuth() {
            const token = localStorage.getItem('access_token');
            if (!token) {
                window.location.href = 'login.html';
                return false;
            }
            return true;
        }

        async function loadProfile() {
            try {
                const token = localStorage.getItem('access_token');
                const response = await fetch(`${API_BASE_URL}/auth/me`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        localStorage.removeItem('access_token');
                        window.location.href = 'login.html';
                        return;
                    }
                    throw new Error('Failed to fetch profile');
                }

                const data = await response.json();
                const user = data.user || data;

                document.getElementById('avatarDisplay').textContent = (user.full_name || user.email || 'א').charAt(0).toUpperCase();
                document.getElementById('nameDisplay').textContent = user.full_name || 'לא צוין';
                document.getElementById('emailDisplay').textContent = user.email || '-';
                document.getElementById('fullName').value = user.full_name || '';
                document.getElementById('email').value = user.email || '';
                document.getElementById('phone').value = user.phone || '';

                document.getElementById('loading').classList.remove('active');
                document.getElementById('profileContent').style.display = 'block';
            } catch (error) {
                console.error('Error loading profile:', error);
                document.getElementById('loading').innerHTML = '<p style="color: #EF4444;">שגיאה בטעינת הפרופיל</p>';
            }
        }

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            try {
                const token = localStorage.getItem('access_token');
                const formData = {
                    full_name: document.getElementById('fullName').value,
                    phone: document.getElementById('phone').value
                };

                const response = await fetch(`${API_BASE_URL}/auth/profile`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (!response.ok) {
                    throw new Error('Failed to update profile');
                }

                const successDiv = document.createElement('div');
                successDiv.className = 'success';
                successDiv.textContent = 'הפרופיל עודכן בהצלחה';
                document.getElementById('profileForm').prepend(successDiv);

                setTimeout(() => successDiv.remove(), 3000);
                loadProfile();
            } catch (error) {
                console.error('Error updating profile:', error);
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error';
                errorDiv.textContent = 'שגיאה בעדכון הפרופיל';
                document.getElementById('profileForm').prepend(errorDiv);

                setTimeout(() => errorDiv.remove(), 3000);
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            if (checkAuth()) {
                document.getElementById('loading').classList.add('active');
                document.getElementById('profileContent').style.display = 'none';
                loadProfile();
            }
        });
    </script>
</body>
</html>

<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ConversaPay - איפוס סיסמה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="conversapay-ui.css">
</head>
<body class="cp-page">
  <header class="cp-topbar">
    <a class="cp-brand" href="home.html"><span class="cp-brand-mark">CP</span><span>ConversaPay</span></a>
    <a class="cp-backlink" href="login.html">חזרה לכניסה</a>
  </header>

  <main class="cp-shell cp-auth-shell">
    <section class="cp-auth-intro">
      <div class="cp-stack">
        <span class="cp-kicker">איפוס גישה</span>
        <h1 class="cp-title">נחזיר אותך לחשבון במהירות.</h1>
        <p class="cp-subtitle">מבקשים קישור מאובטח, בוחרים סיסמה חדשה, וחוזרים לעבוד.</p>
      </div>
      <div class="cp-list">
        <div class="cp-list-item"><div class="cp-list-meta"><strong>קישור חד פעמי</strong><small>הקישור נשלח לתיבת האימייל</small></div><span class="cp-badge">Secure</span></div>
      </div>
    </section>

    <main class="cp-card">
      <section id="request" class="cp-stack">
        <h2>שכחת סיסמה?</h2>
        <p class="cp-muted">נשלח קישור מאובטח לאיפוס הסיסמה שלך.</p>
        <form id="requestForm" class="cp-stack">
          <div class="cp-field">
            <label class="cp-label" for="email">כתובת דוא״ל</label>
            <input class="cp-input" id="email" type="email" autocomplete="email" required>
          </div>
          <button class="cp-button" type="submit">שלח קישור</button>
        </form>
      </section>

      <section id="reset" class="cp-stack" hidden>
        <h2>בחר סיסמה חדשה</h2>
        <form id="resetForm" class="cp-stack">
          <div class="cp-field">
            <label class="cp-label" for="password">סיסמה חדשה</label>
            <input class="cp-input" id="password" type="password" minlength="8" autocomplete="new-password" required>
          </div>
          <div class="cp-field">
            <label class="cp-label" for="confirm">אימות סיסמה</label>
            <input class="cp-input" id="confirm" type="password" minlength="8" autocomplete="new-password" required>
          </div>
          <button class="cp-button" type="submit">עדכן סיסמה</button>
        </form>
      </section>

      <div id="notice" class="cp-notice" hidden></div>
      <div class="cp-links" style="margin-top:18px;"><a class="cp-link" href="login.html">חזרה לכניסה</a></div>
    </main>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const API = '/api/v1';
    const query = new URLSearchParams(location.search);
    const hash = new URLSearchParams(location.hash.slice(1));
    let token = query.get('token') || hash.get('access_token');
    const $ = (id) => document.getElementById(id);

    function note(message, isError = false) {
      $('notice').textContent = message;
      $('notice').className = isError ? 'cp-notice error' : 'cp-notice';
      $('notice').hidden = false;
    }

    (async () => {
      if (token || hash.get('type') === 'recovery') {
        $('request').hidden = true;
        $('reset').hidden = false;
        history.replaceState({}, document.title, 'forgot-password.html');
        try {
          const config = await (await fetch(`${API}/config/public`)).json();
          window.sb = window.supabase.createClient(config.supabase_url, config.supabase_anon_key);
        } catch (_) {
          note('לא ניתן לטעון את שירות האימות', true);
        }
      }
    })();

    $('requestForm').onsubmit = async (event) => {
      event.preventDefault();
      const button = event.target.querySelector('button[type="submit"]');
      const originalText = button.textContent;
      const email = $('email').value.trim();
      if (!email) return;

      button.disabled = true;
      button.textContent = 'שולח...';

      try {
        const response = await fetch(`${API}/auth/password-reset/request`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        if (!response.ok) throw new Error();
        note('אם קיים חשבון, נשלח אליו קישור איפוס. בדוק את תיבת הדואר.');
      } catch (_) {
        note('לא ניתן לשלוח את הקישור כרגע', true);
      } finally {
        button.disabled = false;
        button.textContent = originalText;
      }
    };

    $('resetForm').onsubmit = async (event) => {
      event.preventDefault();
      const button = event.target.querySelector('button[type="submit"]');
      const originalText = button.textContent;
      const password = $('password').value;

      if (password.length < 8 || password !== $('confirm').value) {
        return note('הסיסמה חייבת להכיל 8 תווים ולהיות זהה באימות', true);
      }

      button.disabled = true;
      button.textContent = 'מעדכן...';

      try {
        if (window.sb) {
          const { error } = await window.sb.auth.updateUser({ password });
          if (error) throw error;
        } else {
          const response = await fetch(`${API}/auth/password-reset/confirm`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, new_password: password })
          });
          if (!response.ok) throw new Error();
        }

        note('הסיסמה עודכנה. מעביר לכניסה...');
        setTimeout(() => { location.href = 'login.html'; }, 1800);
      } catch (_) {
        note('קישור האיפוס פג או אינו תקין. בקש קישור חדש.', true);
        button.disabled = false;
        button.textContent = originalText;
      }
    };
  </script>
</body>
</html>

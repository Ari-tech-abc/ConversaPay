<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ConversaPay - איפוס סיסמה</title>
  <link rel="stylesheet" href="/frontend/html/conversapay-ui.css">
  <link rel="stylesheet" href="/frontend/css/language-switcher.css">
</head>
<body class="cp-page">
  <header class="cp-topbar">
    <a class="cp-brand" href="/">
      <span class="cp-brand-mark">CP</span>
      <span>ConversaPay</span>
    </a>
    <a class="cp-backlink" href="/login">חזרה לכניסה</a>
  </header>
  <main class="cp-shell cp-auth-shell">
    <section class="cp-card">
      <div id="request" class="cp-stack">
        <span class="cp-kicker">איפוס גישה</span>
        <h1>שכחתם סיסמה?</h1>
        <p class="cp-muted">נשלח קישור מאובטח לאיפוס הסיסמה.</p>
        <form id="requestForm" class="cp-stack">
          <div class="cp-field">
            <label class="cp-label" for="email">כתובת דוא״ל</label>
            <input class="cp-input" id="email" type="email" autocomplete="email" required>
          </div>
          <button class="cp-button" type="submit">שלח קישור</button>
        </form>
      </div>
      <div id="reset" class="cp-stack" hidden>
        <span class="cp-kicker">אבטחת החשבון</span>
        <h1>בחרו סיסמה חדשה</h1>
        <form id="resetForm" class="cp-stack">
          <div class="cp-field">
            <label class="cp-label" for="password">סיסמה חדשה</label>
            <input class="cp-input" id="password" type="password" minlength="8" autocomplete="new-password" required>
          </div>
          <div class="cp-field">
            <label class="cp-label" for="confirm">אימות סיסמה</label>
            <input class="cp-input" id="confirm" type="password" minlength="8" autocomplete="new-password" required>
          </div>
          <button class="cp-button" type="submit">עדכן סיסמה</button>
        </form>
      </div>
      <div id="notice" class="cp-notice" hidden></div>
      <div class="cp-links cp-mt-md">
        <a class="cp-link" href="/login">חזרה לכניסה</a>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/frontend/js/password-reset.js" defer></script>  <script src="/frontend/js/language-switcher.js"></script>
</body></html>

<!doctype html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ConversaPay - איפוס סיסמה</title><link rel="stylesheet" href="/frontend/html/conversapay-ui.css"></head><body class="cp-page"><header class="cp-topbar"><a class="cp-brand" href="/"><span class="cp-brand-mark">CP</span><span>ConversaPay</span></a><a class="cp-backlink" href="/login">חזרה לכניסה</a></header><main class="cp-shell cp-auth-shell"><section class="cp-auth-intro" aria-hidden="true"></section><section class="cp-card"><div id="request" class="cp-stack"><span class="cp-kicker">איפוס גישה</span><h1>שכחתם סיסמה?</h1><p class="cp-muted">נשלח קישור מאובטח לאיפוס הסיסמה.</p><form id="requestForm" class="cp-stack"><div class="cp-field"><label class="cp-label" for="email">כתובת דוא״ל</label><input class="cp-input" id="email" type="email" autocomplete="email" required></div><button class="cp-button" type="submit">שלח קישור</button></form></div><div id="reset" class="cp-stack" hidden><span class="cp-kicker">אבטחת החשבון</span><h1>בחרו סיסמה חדשה</h1><form id="resetForm" class="cp-stack"><div class="cp-field"><label class="cp-label" for="password">סיסמה חדשה</label><input class="cp-input" id="password" type="password" minlength="8" autocomplete="new-password" required></div><div class="cp-field"><label class="cp-label" for="confirm">אימות סיסמה</label><input class="cp-input" id="confirm" type="password" minlength="8" autocomplete="new-password" required></div><button class="cp-button" type="submit">עדכן סיסמה</button></form></div><div id="notice" class="cp-notice" hidden></div><div class="cp-links" style="margin-top:18px;"><a class="cp-link" href="/login">חזרה לכניסה</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>const API='/api/v1',LOGIN_ROUTE='/login',q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.slice(1));let token=q.get('token')||h.get('access_token'),$=id=>document.getElementById(id),note=(m,e=false)=>{$('notice').textContent=m;$('notice').className=e?'cp-notice error':'cp-notice';$('notice').hidden=false};(async()=>{if(token||h.get('type')==='recovery'){$('request').hidden=true;$('reset').hidden=false;history.replaceState({},document.title,LOGIN_ROUTE.replace('/login','/forgot-password'));try{const c=await(await fetch(`${API}/config/public`)).json();window.sb=window.supabase.createClient(c.supabase_url,c.supabase_anon_key)}catch(_){note('לא ניתן לטעון את שירות האימות',true)}}})();$('requestForm').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button'),t=b.textContent;b.disabled=true;b.textContent='שולח...';try{const r=await fetch(`${API}/auth/password-reset/request`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim()})});if(!r.ok)throw Error();note('אם קיים חשבון, נשלח אליו קישור איפוס. בדוק את תיבת הדואר.')}catch(_){note('לא ניתן לשלוח את הקישור כרגע',true)}finally{b.disabled=false;b.textContent=t}};$('resetForm').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button'),p=$('password').value;if(p.length<8||p!==$('confirm').value)return note('הסיסמה חייבת להכיל 8 תווים ולהיות זהה באימות',true);b.disabled=true;try{if(window.sb){const{error}=await window.sb.auth.updateUser({password:p});if(error)throw error}else{const r=await fetch(`${API}/auth/password-reset/confirm`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,new_password:p})});if(!r.ok)throw Error()}note('הסיסמה עודכנה. מעביר לכניסה...');setTimeout(()=>location.href=LOGIN_ROUTE,1800)}catch(_){note('קישור האיפוס פג או אינו תקין. בקש קישור חדש.',true);b.disabled=false}};</script></body></html>

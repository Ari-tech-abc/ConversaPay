<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ConversaPay - איפוס סיסמה</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0f1419, #1a1f2e);
      color: #f5f7fa;
    }
    .card {
      width: min(420px, calc(100% - 32px));
      padding: 30px;
      background: #1a1f2ecc;
      border: 1px solid #ffffff18;
      border-radius: 20px;
      box-shadow: 0 20px 48px #0007;
    }
    h1 { margin-top: 0; color: #a5b4fc; }
    p { color: #a0aec0; line-height: 1.6; }
    label { display: block; margin: 16px 0 7px; font-weight: 600; }
    input {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #ffffff1a;
      background: #ffffff0d;
      color: #fff;
      font-size: 1rem;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .notice { margin-top: 16px; padding: 12px; border-radius: 10px; background: #10b98122; color: #86efac; }
    .error { background: #ef444422; color: #fca5a5; }
    .back { display: block; margin-top: 18px; color: #a0aec0; text-align: center; }
  </style>
</head>
<body>
  <main class="card">
    <section id="request">
      <h1>שכחת סיסמה?</h1>
      <p>נשלח קישור מאובטח לאיפוס הסיסמה שלך.</p>
      <form id="requestForm">
        <label for="email">כתובת דוא״ל</label>
        <input id="email" type="email" autocomplete="email" required>
        <button type="submit">שלח קישור</button>
      </form>
    </section>

    <section id="reset" hidden>
      <h1>בחר סיסמה חדשה</h1>
      <form id="resetForm">
        <label for="password">סיסמה חדשה</label>
        <input id="password" type="password" minlength="8" autocomplete="new-password" required>

        <label for="confirm">אימות סיסמה</label>
        <input id="confirm" type="password" minlength="8" autocomplete="new-password" required>

        <button type="submit">עדכן סיסמה</button>
      </form>
    </section>

    <div id="notice" class="notice" hidden></div>
    <a class="back" href="login.html">חזרה לכניסה</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const API = '/api/v1';
    const query = new URLSearchParams(location.search);
    const hash = new URLSearchParams(location.hash.slice(1));
    let token = query.get('token') || hash.get('access_token');
    const $ = (id) => document.getElementById(id);

    function note(message, isError = false) {
      $('notice').textContent = message;
      $('notice').className = isError ? 'notice error' : 'notice';
      $('notice').hidden = false;
    }

    (async () => {
      if (token || hash.get('type') === 'recovery') {
        $('request').hidden = true;
        $('reset').hidden = false;
        history.replaceState({}, document.title, 'forgot-password.html');
        try {
          const config = await (await fetch(`${API}/config/public`)).json();
          window.sb = window.supabase.createClient(config.supabase_url, config.supabase_anon_key);
        } catch (_) {
          note('לא ניתן לטעון את שירות האימות', true);
        }
      }
    })();

    $('requestForm').onsubmit = async (event) => {
      event.preventDefault();
      const button = event.target.querySelector('button[type="submit"]');
      const originalText = button.textContent;
      const email = $('email').value.trim();
      if (!email) return;

      button.disabled = true;
      button.textContent = 'שולח...';

      try {
        const response = await fetch(`${API}/auth/password-reset/request`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        if (!response.ok) throw new Error();
        note('אם קיים חשבון, נשלח אליו קישור איפוס. בדוק את תיבת הדואר.');
      } catch (_) {
        note('לא ניתן לשלוח את הקישור כרגע', true);
      } finally {
        button.disabled = false;
        button.textContent = originalText;
      }
    };

    $('resetForm').onsubmit = async (event) => {
      event.preventDefault();
      const button = event.target.querySelector('button[type="submit"]');
      const originalText = button.textContent;
      const password = $('password').value;

      if (password.length < 8 || password !== $('confirm').value) {
        return note('הסיסמה חייבת להכיל 8 תווים ולהיות זהה באימות', true);
      }

      button.disabled = true;
      button.textContent = 'מעדכן...';

      try {
        if (window.sb) {
          const { error } = await window.sb.auth.updateUser({ password });
          if (error) throw error;
        } else {
          const response = await fetch(`${API}/auth/password-reset/confirm`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, new_password: password })
          });
          if (!response.ok) throw new Error();
        }

        note('הסיסמה עודכנה. מעביר לכניסה...');
        setTimeout(() => { location.href = 'login.html'; }, 1800);
      } catch (_) {
        note('קישור האיפוס פג או אינו תקין. בקש קישור חדש.', true);
        button.disabled = false;
        button.textContent = originalText;
      }
    };
  </script>
</body>
</html>

<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>פתיחת חשבון | Talk2Pay</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f7f5fb"><link rel="icon" type="image/png" href="/images/favicon-32x32.png"><link rel="stylesheet" href="/frontend/html/conversapay-ui.css"></head>
<body class="cp-page"><div class="cp-toast-wrap" id="toastWrap"></div><header class="cp-topbar"><a class="cp-brand" href="/" aria-label="Talk2Pay, דף הבית"><span class="cp-brand-mark" aria-hidden="true">T2P</span><span>Talk2Pay</span></a><a class="cp-backlink" href="/login">כבר יש חשבון?</a></header><main class="cp-shell cp-auth-shell"><section class="cp-card" aria-labelledby="title"><div class="cp-stack cp-mb-lg"><span class="cp-kicker">פתיחת חשבון</span><h1 id="title">מתחילים בחינם</h1><p class="cp-muted">בלי כרטיס אשראי. לוקח פחות משתי דקות.</p></div><form id="register-form" class="cp-stack"><div class="cp-field"><label class="cp-label" for="name">שם מלא</label><input class="cp-input" id="name" name="name" required maxlength="255" autocomplete="name"></div><div class="cp-field"><label class="cp-label" for="business">שם העסק</label><input class="cp-input" id="business" name="business" required maxlength="255" autocomplete="organization"></div><div class="cp-field"><label class="cp-label" for="email">אימייל</label><input class="cp-input" id="email" name="email" type="email" required autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false"></div><div class="cp-field"><label class="cp-label" for="password">סיסמה, לפחות 8 תווים</label><input class="cp-input" id="password" name="password" type="password" minlength="8" maxlength="128" required autocomplete="new-password" aria-describedby="password-help"><small id="password-help" class="cp-muted">מומלץ להשתמש במשפט ארוך וייחודי.</small></div><div class="cp-field"><label class="cp-label" for="confirm">אימות סיסמה</label><input class="cp-input" id="confirm" name="confirm" type="password" minlength="8" maxlength="128" required autocomplete="new-password"></div><label style="display:flex;gap:10px;align-items:flex-start;color:var(--cp-muted);font-weight:500"><input id="terms" type="checkbox" required style="width:auto;margin-top:5px"><span>קראתי ואני מסכים <a class="cp-link" href="/terms" target="_blank" rel="noopener">לתנאי השימוש</a> ול<a class="cp-link" href="/privacy" target="_blank" rel="noopener">מדיניות הפרטיות</a></span></label><button class="cp-button" id="submit" type="submit">פתיחת חשבון</button></form><div class="cp-links cp-mt-md"><a class="cp-link" href="/login">כבר יש חשבון? כניסה</a></div></section></main>
<script>
(()=>{'use strict';const API='/api/v1',form=document.getElementById('register-form'),submit=document.getElementById('submit');let controller;
function showToast(text,type='success',duration=6000){const wrap=document.getElementById('toastWrap');const t=document.createElement('div');t.className=`cp-toast ${type}`;t.setAttribute('role',type==='error'?'alert':'status');t.setAttribute('aria-live','polite');const icon=document.createElement('span');icon.className='cp-toast-icon';icon.textContent=type==='error'?'✕':'✓';const msg=document.createElement('span');msg.textContent=text;const close=document.createElement('button');close.className='cp-toast-close';close.setAttribute('aria-label','סגור');close.textContent='×';close.onclick=()=>dismiss(t);t.append(icon,msg,close);wrap.appendChild(t);const timer=setTimeout(()=>dismiss(t),duration);t._timer=timer;return t}function dismiss(t){if(!t.parentNode)return;t.classList.add('hide');setTimeout(()=>t.remove(),280)}
form.addEventListener('submit',async event=>{event.preventDefault();if(form.password.value!==form.confirm.value)return showToast('הסיסמאות אינן זהות.','error');if(!form.checkValidity()){form.reportValidity();return}controller?.abort();controller=new AbortController();submit.disabled=true;submit.textContent='פותח חשבון...';try{const response=await fetch(`${API}/auth/signup`,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},credentials:'same-origin',signal:controller.signal,body:JSON.stringify({full_name:form.name.value.trim(),business_name:form.business.value.trim(),email:form.email.value.trim(),password:form.password.value})}),data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.detail==='email_exists'||data.detail==='User already registered'?'כבר קיים חשבון עם האימייל הזה.':data.detail==='rate_limit'?'נשלחו יותר מדי בקשות. נסו שוב מאוחר יותר.':data.detail||'פתיחת החשבון נכשלה.');showToast('החשבון נוצר! שלחנו אליך קישור אימות באימייל — כדאי לבדוק גם בספאם.','success',10000);form.reset()}catch(error){if(error.name!=='AbortError')showToast(error.message||'לא הצלחנו לפתוח את החשבון. נסו שוב.','error')}finally{submit.disabled=false;submit.textContent='פתיחת חשבון'}})})();
</script></body></html>

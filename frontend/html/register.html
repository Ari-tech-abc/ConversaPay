<!doctype html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8fafc"><title>ConversaPay - הרשמה</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/frontend/html/conversapay-ui.css"><style>.terms-row{display:flex;gap:10px;align-items:flex-start;color:var(--cp-muted);font-weight:500}.terms-row input{width:auto;margin-top:4px;accent-color:var(--cp-accent)}</style></head><body class="cp-page"><header class="cp-topbar"><a class="cp-brand" href="/"><span class="cp-brand-mark">CP</span><span>ConversaPay</span></a><a class="cp-backlink" href="/login">כבר יש חשבון?</a></header><main class="cp-shell cp-auth-shell"><section class="cp-card"><div class="cp-stack cp-mb-lg"><span class="cp-kicker">פתיחת חשבון</span><h1>צור חשבון ב‑ConversaPay</h1><p class="cp-muted">מתחילים בחינם, בלי כרטיס אשראי.</p></div><form id="form" class="cp-stack"><div class="cp-field"><label class="cp-label" for="name">שם מלא</label><input class="cp-input" id="name" required maxlength="255" autocomplete="name"></div><div class="cp-field"><label class="cp-label" for="business">שם העסק</label><input class="cp-input" id="business" required maxlength="255" autocomplete="organization"></div><div class="cp-field"><label class="cp-label" for="email">אימייל</label><input class="cp-input" id="email" type="email" required autocomplete="email"></div><div class="cp-field"><label class="cp-label" for="password">סיסמה, לפחות 8 תווים</label><input class="cp-input" id="password" type="password" minlength="8" required autocomplete="new-password"></div><div class="cp-field"><label class="cp-label" for="confirm">אימות סיסמה</label><input class="cp-input" id="confirm" type="password" minlength="8" required autocomplete="new-password"></div><label class="terms-row"><input id="terms" type="checkbox" required><span>אני מסכים <a class="cp-link" href="/terms">לתנאי השימוש</a> ול<a class="cp-link" href="/privacy">מדיניות הפרטיות</a></span></label><button class="cp-button" id="submit" type="submit">הרשמה</button></form><div id="notice" class="cp-notice" hidden></div><div class="cp-links cp-mt-lg"><a class="cp-link" href="/login">כבר יש לך חשבון? כניסה</a><a class="cp-link" href="/verify-email">לא קיבלת אימייל אימות?</a></div></section></main><script>const API='/api/v1',$=id=>document.getElementById(id),note=(t,e=false)=>{$('notice').textContent=t;$('notice').className=e?'cp-notice error':'cp-notice';$('notice').hidden=false};$('form').onsubmit=async e=>{e.preventDefault();const p=$('password').value;if(p.length<8||p!==$('confirm').value)return note('הסיסמה חייבת להכיל לפחות 8 תווים ולהיות זהה באימות',true);if(!$('terms').checked)return note('יש לאשר את תנאי השימוש ומדיניות הפרטיות',true);$('submit').disabled=true;try{const r=await fetch(`${API}/auth/signup`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:$('name').value.trim(),business_name:$('business').value.trim(),email:$('email').value.trim(),password:p})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'הרשמה נכשלה');note('נשלח אליך אימייל אימות. בדוק גם את תיקיית הספאם.');$('form').reset()}catch(err){note(err.message||'שגיאה בהרשמה',true)}finally{$('submit').disabled=false}}</script></body></html>

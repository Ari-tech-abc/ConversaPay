<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>פתיחת חשבון | Talk2Pay</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f8faf6"><link rel="stylesheet" href="/frontend/html/conversapay-ui.css"><link rel="stylesheet" href="/frontend/css/language-switcher.css">
<style>
.verify-layer{position:fixed;inset:0;z-index:9997;display:none;place-items:center;padding:24px;background:rgba(20,18,38,.5);backdrop-filter:blur(12px)}.verify-layer.show{display:grid}.verify-card{width:min(560px,100%);background:linear-gradient(145deg,#fff,#faf9ff);border:1px solid #ded9fb;border-radius:26px;box-shadow:0 30px 90px rgba(31,24,67,.28);padding:30px;position:relative}.verify-close{position:absolute;top:16px;left:16px;width:38px;height:38px;border:0;border-radius:12px;background:#f1f1f7;font-size:24px;cursor:pointer}.verify-code{direction:ltr;text-align:center;letter-spacing:10px;font-size:28px;font-weight:800}.verify-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.verify-actions>*{flex:1}.verify-meta{margin-top:10px;font-size:.82rem;color:#7c8096}.auth-check{position:fixed;inset:0;z-index:12000;background:#f7f7fb;display:grid;place-items:center;color:#777}
</style>
<link rel="stylesheet" href="/frontend/css/talk2pay-theme.css"><script src="/frontend/js/motion.js" defer></script><script src="/frontend/js/workspace-ui.js" defer></script><style>@view-transition{navigation:auto}</style></head>
<body data-t2p-page="register" class="cp-page"><div id="authCheck" class="auth-check">בודק התחברות...</div><div class="cp-toast-wrap" id="toastWrap"></div><header class="cp-topbar"><a class="cp-brand" href="/" aria-label="Talk2Pay, דף הבית"><span class="cp-brand-mark" aria-hidden="true">T2P</span><span>Talk2Pay</span></a><a class="cp-backlink" href="/login">כבר יש חשבון?</a></header><main class="cp-shell cp-auth-shell"><section class="cp-card" aria-labelledby="title"><div class="cp-stack cp-mb-lg"><span class="cp-kicker">פתיחת חשבון</span><h1 id="title">פותחים חשבון בחינם</h1><p class="cp-muted">ממלאים את הפרטים, מאמתים את האימייל וממשיכים להגדרת העסק.</p></div><form id="register-form" class="cp-stack" novalidate><div class="cp-field"><label class="cp-label" for="name">שם מלא</label><input class="cp-input" id="name" name="name" required maxlength="255" autocomplete="name"></div><div class="cp-field"><label class="cp-label" for="business">שם העסק</label><input class="cp-input" id="business" name="business" required maxlength="255" autocomplete="organization"></div><div class="cp-field"><label class="cp-label" for="email">אימייל</label><input class="cp-input" id="email" name="email" type="email" required autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false"></div><div class="cp-field"><label class="cp-label" for="password">סיסמה, לפחות 8 תווים</label><input class="cp-input" id="password" name="password" type="password" minlength="8" maxlength="128" required autocomplete="new-password"></div><div class="cp-field"><label class="cp-label" for="confirm">הקלדת הסיסמה שוב</label><input class="cp-input" id="confirm" name="confirm" type="password" minlength="8" maxlength="128" required autocomplete="new-password"></div><label style="display:flex;gap:10px;align-items:flex-start;color:var(--cp-muted);font-weight:500"><input id="terms" type="checkbox" required style="width:auto;margin-top:5px"><span>קראתי ואני מסכים <a class="cp-link" href="/terms" target="_blank" rel="noopener">לתנאי השימוש</a> ול<a class="cp-link" href="/privacy" target="_blank" rel="noopener">מדיניות הפרטיות</a></span></label><button class="cp-button" id="submit" type="submit">פתיחת חשבון</button></form><div class="cp-links cp-mt-md"><a class="cp-link" href="/login">כבר יש חשבון? כניסה</a></div></section></main>
<div class="verify-layer" id="verifyLayer"><section class="verify-card" role="dialog" aria-modal="true" aria-labelledby="verifyTitle"><button class="verify-close" id="verifyClose" aria-label="סגור">×</button><span class="cp-kicker">אימות אימייל</span><h2 id="verifyTitle" style="margin-top:8px">נשאר לאמת את האימייל</h2><p class="cp-muted" style="margin:10px 0 18px">יש להזין את הקוד ששלחנו ל־<strong id="verifyEmail"></strong>. הקוד תקף ל־15 דקות.</p><input class="cp-input verify-code" id="verifyCode" aria-label="קוד אימות בן 6 ספרות" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000"><div class="verify-actions"><button class="cp-button" id="verifyButton" type="button">אימות והמשך להגדרת העסק</button><button class="cp-button-secondary" id="resendButton" type="button">שליחת קוד חדש</button></div><div class="verify-meta" id="verifyMeta"></div></section></div>
<script>
(()=>{'use strict';const API='/api/v1',$=id=>document.getElementById(id),form=$('register-form'),submit=$('submit');let pending=null;
function token(){return localStorage.getItem('access_token')||sessionStorage.getItem('access_token')||localStorage.getItem('conversapay_auth_token')||sessionStorage.getItem('conversapay_auth_token')}
async function redirectIfAuthenticated(){const t=token();if(!t){$('authCheck').remove();return}try{const r=await fetch(API+'/auth/me',{headers:{Authorization:'Bearer '+t}});if(!r.ok)throw 0;const d=await r.json();location.replace(d.requires_business_onboarding?'/onboarding':'/dashboard')}catch(_){$('authCheck').remove()}}
function showToast(text,type='error',duration=6500){const wrap=$('toastWrap'),t=document.createElement('div');t.className='cp-toast '+type;t.setAttribute('role',type==='error'?'alert':'status');t.innerHTML='<span class="cp-toast-icon">'+(type==='error'?'✕':'✓')+'</span><span></span><button class="cp-toast-close" aria-label="סגור">×</button>';t.children[1].textContent=text;t.children[2].onclick=()=>dismiss(t);wrap.appendChild(t);t._timer=setTimeout(()=>dismiss(t),duration)}function dismiss(t){if(!t?.parentNode)return;clearTimeout(t._timer);t.classList.add('hide');setTimeout(()=>t.remove(),220)}
function errorText(detail,status){if(detail==='email_exists'||detail==='User already registered')return'כבר קיים חשבון עם האימייל הזה.';if(detail==='verification_email_failed')return'החשבון נוצר, אבל לא הצלחנו לשלוח את קוד האימות. אפשר לבקש קוד חדש.';if(detail==='rate_limit'||status===429)return'נשלחו יותר מדי בקשות. נסה שוב בעוד כמה דקות.';if(detail==='registration_failed')return'לא ניתן לפתוח את החשבון עם הפרטים האלה.';if(detail==='server_error')return'אירעה שגיאת מערכת במהלך פתיחת החשבון. נסה שוב.';return typeof detail==='string'?detail:'פתיחת החשבון נכשלה.'}
function validEmail(value){return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value)}
function validateRegistration(){const name=form.name.value.trim(),business=form.business.value.trim(),email=form.email.value.trim().toLowerCase(),password=form.password.value,confirm=form.confirm.value;if(!name)return'יש להזין שם מלא.';if(!business)return'יש להזין את שם העסק.';if(!validEmail(email))return'יש להזין כתובת אימייל תקינה.';if(password.length<8)return'הסיסמה חייבת להכיל לפחות 8 תווים.';if(password!==confirm)return'הסיסמאות לא תואמות. יש להקליד את אותה סיסמה בשני השדות.';if(!$('terms').checked)return'כדי להמשיך יש לאשר את תנאי השימוש ומדיניות הפרטיות.';return''}
function openVerify(){if(!pending)return;$('verifyEmail').textContent=pending.email;$('verifyCode').value='';$('verifyMeta').textContent='';$('verifyLayer').classList.add('show');setTimeout(()=>$('verifyCode').focus(),50)}
$('verifyClose').onclick=()=>$('verifyLayer').classList.remove('show');
form.addEventListener('submit',async e=>{e.preventDefault();const validationError=validateRegistration();if(validationError)return showToast(validationError);pending={full_name:form.name.value.trim(),business_name:form.business.value.trim(),email:form.email.value.trim().toLowerCase(),password:form.password.value};submit.disabled=true;submit.textContent='פותח חשבון...';try{const r=await fetch(API+'/auth/signup-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pending)}),d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(Error(),{detail:d.detail,status:r.status});openVerify()}catch(err){if(err.detail==='verification_email_failed'){openVerify();$('verifyMeta').textContent='החשבון נוצר, אבל לא הצלחנו לשלוח את הקוד. אפשר ללחוץ על שליחת קוד חדש.'}showToast(err.status>=500&&err.detail!=='verification_email_failed'?window.Talk2PayUX.error(err.status):errorText(err.detail,err.status))}finally{submit.disabled=false;submit.textContent='פתיחת חשבון'}});
$('resendButton').onclick=async()=>{if(!pending)return;const b=$('resendButton');b.disabled=true;$('verifyMeta').textContent='שולח קוד חדש...';try{const r=await fetch(API+'/auth/resend-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:pending.email})}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'לא ניתן לשלוח קוד');$('verifyMeta').textContent='שלחנו קוד חדש. כדאי לבדוק גם בתיקיית הספאם.'}catch(e){showToast(e.message||'שליחת הקוד נכשלה')}finally{b.disabled=false}};
$('verifyButton').onclick=async()=>{if(!pending)return;const code=$('verifyCode').value.trim();if(!/^\d{6}$/.test(code))return showToast('יש להזין קוד בן 6 ספרות.');const b=$('verifyButton');b.disabled=true;b.textContent='מאמת...';try{let r=await fetch(API+'/auth/verify-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:pending.email,code})}),d=await r.json().catch(()=>({}));if(!r.ok){const map={verification_code_invalid:'הקוד לא תואם. כדאי לבדוק אותו ולנסות שוב.',verification_code_expired:'תוקף הקוד פג. אפשר לבקש קוד חדש.',verification_not_found:'לא נמצאה בקשת אימות עבור האימייל הזה.',verification_failed:'לא הצלחנו לאמת את האימייל. אפשר לנסות שוב.'};throw Error(map[d.detail]||d.detail||'האימות נכשל')}r=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:pending.email,password:pending.password})});d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'האימות הצליח אך הכניסה נכשלה');localStorage.setItem('access_token',d.access_token);localStorage.setItem('user_id',d.user_id||'');location.replace('/onboarding')}catch(e){showToast(e.message||'האימות נכשל.')}finally{b.disabled=false;b.textContent='אימות והמשך להגדרת העסק'}};
redirectIfAuthenticated()})();
</script><script src="/frontend/js/language-switcher.js"></script>
</body></html>

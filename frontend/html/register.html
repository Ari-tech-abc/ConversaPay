<!doctype html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ConversaPay - הרשמה</title><style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0f1419,#1a1f2e);color:#f5f7fa}.card{width:min(480px,calc(100% - 32px));padding:30px;background:#1a1f2ecc;border:1px solid #ffffff18;border-radius:20px;box-shadow:0 20px 48px #0007}h1{margin-top:0;color:#a5b4fc}label{display:block;margin:14px 0 6px;font-weight:600}input{width:100%;padding:13px;border-radius:10px;border:1px solid #ffffff1a;background:#ffffff0d;color:#fff;font-size:1rem}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-weight:700;cursor:pointer}.notice{margin-top:16px;padding:12px;border-radius:10px;background:#10b98122;color:#86efac}.error{background:#ef444422;color:#fca5a5}.muted{color:#a0aec0}.back{display:block;text-align:center;margin-top:18px;color:#a0aec0}</style></head><body><main class="card"><h1>צור חשבון ב-ConversaPay</h1><p class="muted">התחלה חינם, בלי כרטיס אשראי.</p><form id="form"><label for="name">שם מלא</label><input id="name" required maxlength="255" autocomplete="name"><label for="business">שם העסק</label><input id="business" required maxlength="255" autocomplete="organization"><label for="email">אימייל</label><input id="email" type="email" required autocomplete="email"><label for="password">סיסמה, לפחות 8 תווים</label><input id="password" type="password" minlength="8" required autocomplete="new-password"><label for="confirm">אימות סיסמה</label><input id="confirm" type="password" minlength="8" required autocomplete="new-password"><label><input id="terms" type="checkbox" required style="width:auto;margin-left:8px"> אני מסכים לתנאים ולמדיניות הפרטיות</label><button id="submit">הרשם</button></form><div id="notice" class="notice" hidden></div><a class="back" href="login.html">כבר יש לך חשבון? כניסה</a></main><script>
const API='/api/v1',$=id=>document.getElementById(id),note=(t,e=false)=>{$('notice').textContent=t;$('notice').className=e?'notice error':'notice';$('notice').hidden=false};$('form').onsubmit=async e=>{e.preventDefault();const p=$('password').value;if(p.length<8||p!==$('confirm').value)return note('הסיסמה חייבת להכיל לפחות 8 תווים ולהיות זהה באימות',true);if(!$('terms').checked)return note('יש לאשר את התנאים',true);$('submit').disabled=true;try{const r=await fetch(`${API}/auth/signup`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:$('name').value.trim(),business_name:$('business').value.trim(),email:$('email').value.trim(),password:p})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'הרשמה נכשלה');note('נשלח אליך אימייל אימות. בדוק גם את תיקיית הספאם.');$('form').reset()}catch(err){note(err.message||'שגיאה בהרשמה',true)}finally{$('submit').disabled=false}};
</script></body></html>

<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>פתיחת חשבון | Talk2Pay</title><meta name="description" content="פתיחת חשבון Talk2Pay בחינם, בלי כרטיס אשראי."><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="theme-color" content="#f7f5fb"><link rel="canonical" href="https://conversapay.org/register"><link rel="stylesheet" href="/frontend/html/conversapay-ui.css"></head>
<body class="cp-page"><a class="skip-link" href="#main">דלגו לטופס ההרשמה</a><header class="cp-topbar"><a class="cp-brand" href="/" aria-label="Talk2Pay, דף הבית"><span class="cp-brand-mark" aria-hidden="true">T2P</span><span>Talk2Pay</span></a><a class="cp-backlink" href="/login">כבר יש חשבון?</a></header><main class="cp-shell cp-auth-shell" id="main"><section class="cp-card" aria-labelledby="page-title"><div class="cp-stack cp-mb-md"><span class="cp-kicker">פתיחת חשבון</span><h1 id="page-title">מתחילים עם Talk2Pay</h1><p class="cp-muted">בחינם, בלי כרטיס אשראי.</p></div><form id="register-form" class="cp-stack" novalidate><div class="cp-field"><label class="cp-label" for="name">שם מלא</label><input class="cp-input" id="name" name="name" required maxlength="255" autocomplete="name"></div><div class="cp-field"><label class="cp-label" for="business">שם העסק</label><input class="cp-input" id="business" name="business" required maxlength="255" autocomplete="organization"></div><div class="cp-field"><label class="cp-label" for="email">אימייל</label><input class="cp-input" id="email" name="email" type="email" inputmode="email" required autocomplete="email" autocapitalize="none" spellcheck="false"></div><div class="cp-field"><label class="cp-label" for="password">סיסמה</label><input class="cp-input" id="password" name="password" type="password" minlength="8" maxlength="128" required autocomplete="new-password" aria-describedby="password-help"><small class="cp-muted" id="password-help">לפחות 8 תווים.</small></div><div class="cp-field"><label class="cp-label" for="confirm">אימות סיסמה</label><input class="cp-input" id="confirm" name="confirm" type="password" minlength="8" maxlength="128" required autocomplete="new-password"></div><label class="cp-checkbox"><input id="terms" name="terms" type="checkbox" required><span>אני מסכים/ה <a class="cp-link" href="/terms" target="_blank" rel="noopener">לתנאי השימוש</a> ול<a class="cp-link" href="/privacy" target="_blank" rel="noopener">מדיניות הפרטיות</a></span></label><button class="cp-button" id="submit" type="submit">פתיחת חשבון</button></form><p id="notice" class="cp-notice" role="status" aria-live="polite" hidden></p><div class="cp-links cp-mt-md"><a class="cp-link" href="/login">כבר יש לך חשבון? כניסה</a></div></section></main>
<script>
(()=>{'use strict';const API='/api/v1',$=id=>document.getElementById(id),form=$('register-form'),submit=$('submit'),notice=$('notice');let controller;const show=(message,error=false)=>{notice.textContent=message;notice.className=error?'cp-notice error':'cp-notice';notice.setAttribute('role',error?'alert':'status');notice.hidden=false};form.addEventListener('submit',async event=>{event.preventDefault();notice.hidden=true;if(!form.reportValidity())return;const password=$('password').value;if(password!==$('confirm').value){$('confirm').setCustomValidity('הסיסמאות אינן זהות');$('confirm').reportValidity();$('confirm').focus();return}$('confirm').setCustomValidity('');controller?.abort();controller=new AbortController();submit.disabled=true;submit.textContent='יוצר חשבון...';try{const response=await fetch(`${API}/auth/signup`,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({full_name:$('name').value.trim(),business_name:$('business').value.trim(),email:$('email').value.trim(),password}),signal:controller.signal}),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(response.status===429?'בוצעו יותר מדי ניסיונות. נסו שוב בעוד כמה דקות.':data.detail==='email_exists'||data.detail==='User already registered'?'כבר קיים חשבון עם האימייל הזה.':data.detail||'לא ניתן להשלים את ההרשמה');form.reset();show('שלחנו אליך אימייל אימות. בדקו גם את תיקיית הספאם.')}catch(error){if(error.name!=='AbortError')show(error.message||'לא ניתן להירשם כרגע. נסו שוב.',true)}finally{submit.disabled=false;submit.textContent='פתיחת חשבון'}});$('confirm').addEventListener('input',()=>$('confirm').setCustomValidity(''))})();
</script></body></html>

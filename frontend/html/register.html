<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>פתיחת חשבון | Talk2Pay</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f7f5fb"><link rel="icon" type="image/png" href="/images/favicon-32x32.png"><link rel="stylesheet" href="/frontend/html/conversapay-ui.css"></head>
<body class="cp-page"><header class="cp-topbar"><a class="cp-brand" href="/" aria-label="Talk2Pay, דף הבית"><span class="cp-brand-mark" aria-hidden="true">T2P</span><span>Talk2Pay</span></a><a class="cp-backlink" href="/login">כבר יש חשבון?</a></header><main class="cp-shell cp-auth-shell"><section class="cp-card" aria-labelledby="title"><div class="cp-stack cp-mb-lg"><span class="cp-kicker">פתיחת חשבון</span><h1 id="title">מתחילים בחינם</h1><p class="cp-muted">בלי כרטיס אשראי. לוקח פחות משתי דקות.</p></div><div id="notice" class="cp-notice" role="status" aria-live="polite" hidden></div><form id="register-form" class="cp-stack"><div class="cp-field"><label class="cp-label" for="name">שם מלא</label><input class="cp-input" id="name" name="name" required maxlength="255" autocomplete="name"></div><div class="cp-field"><label class="cp-label" for="business">שם העסק</label><input class="cp-input" id="business" name="business" required maxlength="255" autocomplete="organization"></div><div class="cp-field"><label class="cp-label" for="email">אימייל</label><input class="cp-input" id="email" name="email" type="email" required autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false"></div><div class="cp-field"><label class="cp-label" for="password">סיסמה, לפחות 8 תווים</label><input class="cp-input" id="password" name="password" type="password" minlength="8" maxlength="128" required autocomplete="new-password" aria-describedby="password-help"><small id="password-help" class="cp-muted">מומלץ להשתמש במשפט ארוך וייחודי.</small></div><div class="cp-field"><label class="cp-label" for="confirm">אימות סיסמה</label><input class="cp-input" id="confirm" name="confirm" type="password" minlength="8" maxlength="128" required autocomplete="new-password"></div><label style="display:flex;gap:10px;align-items:flex-start;color:var(--cp-muted);font-weight:500"><input id="terms" type="checkbox" required style="width:auto;margin-top:5px"><span>קראתי ואני מסכים <a class="cp-link" href="/terms" target="_blank" rel="noopener">לתנאי השימוש</a> ול<a class="cp-link" href="/privacy" target="_blank" rel="noopener">מדיניות הפרטיות</a></span></label><button class="cp-button" id="submit" type="submit">פתיחת חשבון</button></form><div class="cp-links cp-mt-md"><a class="cp-link" href="/login">כבר יש חשבון? כניסה</a></div></section></main>
<script>
(()=>{'use strict';const API='/api/v1',form=document.getElementById('register-form'),submit=document.getElementById('submit'),notice=document.getElementById('notice');let controller;const show=(text,error=false)=>{notice.textContent=text;notice.className=`cp-notice${error?' error':''}`;notice.setAttribute('role',error?'alert':'status');notice.hidden=false};form.addEventListener('submit',async event=>{event.preventDefault();notice.hidden=true;if(form.password.value!==form.confirm.value)return show('הסיסמאות אינן זהות.',true);if(!form.checkValidity()){form.reportValidity();return}controller?.abort();controller=new AbortController();submit.disabled=true;submit.textContent='פותח חשבון...';try{const response=await fetch(`${API}/auth/signup`,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},credentials:'same-origin',signal:controller.signal,body:JSON.stringify({full_name:form.name.value.trim(),business_name:form.business.value.trim(),email:form.email.value.trim(),password:form.password.value})}),data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.detail==='email_exists'||data.detail==='User already registered'?'כבר קיים חשבון עם האימייל הזה.':data.detail==='rate_limit'?'נשלחו יותר מדי בקשות. נסו שוב מאוחר יותר.':data.detail||'פתיחת החשבון נכשלה.');show('החשבון נוצר. שלחנו אליך קישור אימות באימייל, כדאי לבדוק גם בספאם.');form.reset()}catch(error){if(error.name!=='AbortError')show(error.message||'לא הצלחנו לפתוח את החשבון. נסו שוב.',true)}finally{submit.disabled=false;submit.textContent='פתיחת חשבון'}})})();
</script></body></html>

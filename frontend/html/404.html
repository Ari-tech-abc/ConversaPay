<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8fafc">
  <meta name="robots" content="noindex,nofollow">
  <title>ConversaPay | הדף לא נמצא</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/html/conversapay-ui.css">
  <style>
    .error-code {
      font: 800 clamp(4rem, 16vw, 8rem)/1 'Space Grotesk', sans-serif;
      letter-spacing: -.06em;
      color: var(--cp-accent);
      margin: 0;
    }
    .error-card {
      display: grid;
      gap: 1rem;
      justify-items: center;
    }
  </style>
</head>
<body class="cp-page">
  <header class="cp-topbar">
    <a class="cp-brand" href="/"><span class="cp-brand-mark">CP</span><span>ConversaPay</span></a>
    <a class="cp-backlink" href="/">חזרה לדף הבית</a>
  </header>

  <main class="cp-shell cp-center-shell">
    <section class="cp-card cp-card-md cp-text-center error-card">
      <span class="cp-kicker cp-kicker-center">שגיאה 404</span>
      <p class="error-code">404</p>
      <h1 class="cp-m0">הדף שחיפשתם לא נמצא</h1>
      <p class="cp-muted">ייתכן שהכתובת השתנתה, שהקישור ישן, או שאין לכם הרשאה לצפות בעמוד הזה.</p>
      <div class="cp-actions cp-full cp-actions-center">
        <a class="cp-button" href="/">חזרה לדף הבית</a>
        <a class="cp-button-secondary" href="/dashboard">לדאשבורד</a>
      </div>
      <div class="cp-links">
        <a class="cp-link" href="/login">כניסה</a>
        <a class="cp-link" href="/register">הרשמה</a>
        <a class="cp-link" href="/setup-guide">מדריך הטמעה</a>
      </div>
    </section>
  </main>

  <footer class="cp-footer">
    <p>&copy; 2026 ConversaPay</p>
  </footer>
</body>
</html>

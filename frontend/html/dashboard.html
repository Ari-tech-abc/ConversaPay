<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConversaPay - דאשבורד</title>
    <meta name="description" content="ConversaPay Dashboard">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #0F1419;
            --bg-secondary: #1A1F2E;
            --bg-card: rgba(26, 31, 46, 0.6);
            --text-primary: #F5F7FA;
            --text-secondary: #A0AEC0;
            --accent-primary: #6366F1;
            --accent-secondary: #8B5CF6;
            --accent-success: #10B981;
            --accent-warning: #F59E0B;
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
            --sidebar-width: 260px;
            --header-height: 64px;
        }

        :focus-visible {
            outline: 2px solid var(--accent-primary);
            outline-offset: 2px;
            border-radius: 4px;
        }

        * {
            font-family: 'Rubik', sans-serif;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: linear-gradient(135deg, var(--bg-primary) 0%, #1a1f2e 50%, #0f1419 100%);
            color: var(--text-primary);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Header */
        .site-header {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            height: var(--header-height);
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            box-shadow: var(--shadow-md);
            contain: layout style;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
            min-width: 0;
        }

        .menu-toggle {
            display: none;
            background: transparent;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .menu-toggle:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .brand {
            font-size: 1.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            white-space: nowrap;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            margin: 0 16px;
            display: none;
        }

        .search-wrapper input {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 40px 10px 14px;
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: border-color 0.2s, background 0.2s;
        }

        .search-wrapper input::placeholder {
            color: var(--text-secondary);
        }

        .search-wrapper input:focus {
            border-color: var(--accent-primary);
            background: rgba(255, 255, 255, 0.09);
            outline: none;
        }

        .search-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .icon-btn {
            position: relative;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .icon-btn:focus-visible {
            outline: 2px solid var(--accent-primary);
            outline-offset: 2px;
        }

        .badge {
            position: absolute;
            top: 4px;
            left: 4px;
            background: #EF4444;
            color: white;
            font-size: 0.65rem;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            border: 2px solid var(--bg-secondary);
        }

        .user-dropdown {
            position: relative;
        }

        .user-trigger {
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 10px;
            font-family: inherit;
        }

        .user-trigger:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            color: white;
            flex-shrink: 0;
        }

        .user-menu {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            min-width: 200px;
            box-shadow: var(--shadow-md);
            padding: 8px;
            z-index: 1100;
            opacity: 0;
            visibility: hidden;
            transform: translateY(8px);
            transition: opacity 0.2s, transform 0.2s, visibility 0.2s;
        }

        .user-menu.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .user-menu a,
        .user-menu button {
            display: block;
            width: 100%;
            text-align: right;
            padding: 10px 12px;
            color: var(--text-primary);
            text-decoration: none;
            background: transparent;
            border: none;
            font-family: inherit;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .user-menu a:hover,
        .user-menu button:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .user-menu hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 6px 0;
        }

        /* Layout */
        .layout {
            display: flex;
            min-height: calc(100vh - var(--header-height));
            position: relative;
            z-index: 1;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-card);
            border-left: 1px solid var(--border-color);
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: sticky;
            top: var(--header-height);
            height: calc(100vh - var(--header-height));
            overflow-y: auto;
            contain: layout style;
        }

        .sidebar-section-title {
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 8px 12px 4px;
        }

        .sidebar-nav {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            transition: background 0.2s, color 0.2s;
            border: 1px solid transparent;
        }

        .sidebar-link svg {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
        }

        .sidebar-link:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .sidebar-link[aria-current="page"] {
            background: rgba(99, 102, 241, 0.12);
            color: var(--accent-primary);
            border-color: rgba(99, 102, 241, 0.25);
            font-weight: 600;
        }

        .sidebar-collapsible {
            border: none;
            background: transparent;
            width: 100%;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .sidebar-collapsible:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .sidebar-collapsible .chevron {
            transition: transform 0.2s;
        }

        .sidebar-collapsible[aria-expanded="true"] .chevron {
            transform: rotate(180deg);
        }

        .sidebar-submenu {
            list-style: none;
            padding-right: 14px;
            display: none;
            flex-direction: column;
            gap: 2px;
        }

        .sidebar-submenu.open {
            display: flex;
        }

        .sidebar-submenu a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: background 0.2s, color 0.2s;
        }

        .sidebar-submenu a:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
        }

        /* Main */
        .main-content {
            flex: 1;
            padding: 24px 28px 40px;
            min-width: 0;
            contain: layout style;
        }

        .page-header {
            margin-bottom: 28px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .page-header h1 {
            font-size: 1.75rem;
            font-weight: 800;
            line-height: 1.2;
        }

        .page-header p {
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .header-actions-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
            contain: layout style;
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            transition: border-color 0.3s, box-shadow 0.3s;
            contain: layout style paint;
        }

        .stat-card:hover {
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: 0 12px 32px rgba(99, 102, 241, 0.15);
        }

        .stat-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .stat-value {
            font-size: 1.9rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 6px;
            line-height: 1.1;
        }

        .stat-change {
            font-size: 0.85rem;
            color: var(--accent-success);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .sparkline {
            margin-top: 10px;
            height: 40px;
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            transition: all 0.3s;
            margin-bottom: 24px;
            contain: layout style paint;
        }

        .card-header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .card-header h2 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .card-body {
            padding: 18px 22px;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .input-control {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: border-color 0.2s, background 0.2s;
            font-family: inherit;
        }

        .input-control::placeholder {
            color: var(--text-secondary);
        }

        .input-control:focus {
            border-color: var(--accent-primary);
            background: rgba(255, 255, 255, 0.09);
            outline: none;
        }

        .chip-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .chip {
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chip:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .chip[aria-pressed="true"] {
            background: rgba(99, 102, 241, 0.18);
            color: var(--accent-primary);
            border-color: rgba(99, 102, 241, 0.45);
            font-weight: 600;
        }

        .date-range {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            direction: ltr;
        }

        /* Transactions */
        .transaction-list {
            list-style: none;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-color);
            gap: 16px;
        }

        .transaction-item:last-child {
            border-bottom: none;
        }

        .transaction-info {
            flex: 1;
            min-width: 0;
        }

        .transaction-name {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .transaction-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .transaction-date {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .transaction-status {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 999px;
            text-transform: uppercase;
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.12);
            color: var(--accent-warning);
        }

        .status-completed {
            background: rgba(16, 185, 129, 0.12);
            color: var(--accent-success);
        }

        .transaction-amount {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--accent-success);
            flex-shrink: 0;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        /* Skeletons */
        .skeleton {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.04) 25%, rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0.04) 75%);
            background-size: 200% 100%;
            animation: skeletonPulse 1.8s infinite;
            border-radius: 10px;
        }

        @keyframes skeletonPulse {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-card {
            height: 130px;
        }

        .skeleton-line {
            height: 12px;
            margin-bottom: 10px;
            width: 60%;
        }

        .skeleton-line.short {
            width: 40%;
        }

        .skeleton-row {
            height: 56px;
            margin-bottom: 12px;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-state svg {
            margin-bottom: 16px;
            color: var(--text-secondary);
        }

        .empty-state p {
            font-size: 1rem;
            margin-bottom: 12px;
        }

        /* Overlay for mobile sidebar */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 900;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .sidebar-overlay.open {
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .search-wrapper {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: flex;
            }

            .sidebar {
                position: fixed;
                top: var(--header-height);
                right: 0;
                z-index: 950;
                transform: translateX(100%);
                transition: transform 0.25s ease;
                width: min(280px, 85vw);
                border-left: 1px solid var(--border-color);
                box-shadow: var(--shadow-md);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar-overlay {
                display: block;
            }

            .main-content {
                padding: 20px 16px 40px;
            }

            .page-header h1 {
                font-size: 1.5rem;
            }

            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
                gap: 12px;
            }

            .stat-value {
                font-size: 1.5rem;
            }

            .toolbar {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .site-header {
                padding: 0 14px;
            }

            .brand {
                font-size: 1.1rem;
            }

            .header-actions .icon-btn {
                width: 34px;
                height: 34px;
            }
        }

        /* Utilities */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Tier Lock Overlay */
        .tier-lock-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 20, 25, 0.92);
            backdrop-filter: blur(8px);
            border-radius: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            text-align: center;
            z-index: 10;
            border: 1px solid var(--border-color);
        }

        .tier-lock-overlay svg {
            width: 56px;
            height: 56px;
            color: var(--accent-warning);
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .tier-lock-overlay h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .tier-lock-overlay p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
            max-width: 280px;
            line-height: 1.5;
        }

        .tier-lock-overlay .btn {
            min-width: 180px;
        }

        .tier-lock-overlay .tier-benefits {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            width: 100%;
            max-width: 280px;
            text-align: right;
            direction: rtl;
        }

        .tier-lock-overlay .tier-benefits span {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .tier-lock-overlay .tier-benefits span::before {
            content: '✓';
            color: var(--accent-success);
            margin-left: 6px;
            font-weight: 700;
        }

        .card.locked {
            position: relative;
        }

        .card.locked .card-body {
            pointer-events: none;
            opacity: 0.5;
        }

        .stat-card.locked {
            position: relative;
        }

        .stat-card.locked::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(15, 20, 25, 0.6);
            border-radius: inherit;
            z-index: 5;
        }

        .stat-card.locked .stat-value,
        .stat-card.locked .stat-label,
        .stat-card.locked .stat-change,
        .stat-card.locked .stat-icon {
            position: relative;
            z-index: 1;
            opacity: 0.4;
        }

        .plan-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;

        const API_BASE_URL = '/api/v1';

        function addTierIndicator(plan_type) {
            const indicator = document.getElementById('tierIndicator');
            if (!indicator) return;
            const labels = { free: 'חינמי', pro: 'PRO', premium: 'PREMIUM' };
            const classes = { free: 'plan-free', pro: 'plan-pro', premium: 'plan-premium' };
            const upgradeUrls = { 
                free: '/pay?plan=pro', 
                pro: 'upgrade.html', 
                premium: 'upgrade.html' 
            };
            
            indicator.className = 'plan-badge ' + (classes[plan_type] || 'plan-free');
            indicator.textContent = labels[plan_type] || 'FREE';
            indicator.href = upgradeUrls[plan_type] || '/pay?plan=pro';
        }

        function applyTierLocks(plan_type) {
            const lockedCards = document.querySelectorAll('.card.locked, .stat-card.locked');
            lockedCards.forEach(card => {
                card.classList.remove('locked');
                const overlay = card.querySelector('.tier-lock-overlay');
                if (overlay) overlay.remove();
            });

            if (plan_type === 'free') {
                document.querySelectorAll('[data-tier-lock]').forEach(el => {
                    const parent = el.closest('.card, .stat-card');
                    if (parent && !parent.classList.contains('locked')) {
                        parent.classList.add('locked');
                        const overlay = document.createElement('div');
                        overlay.className = 'tier-lock-overlay';
                        overlay.innerHTML = `
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0110 0v4"></path>
                            </svg>
                            <h3>ננעל风中e תכנית חינמית</h3>
                            <p>שדרג ל-PRO או PREMIUM כדי לפתוח תכונות אלו</p>
                            <a href="/pay?plan=pro" class="btn btn-primary">שדרג עכשיו</a>
                        `;
                        parent.appendChild(overlay);
                    }
                });
            }
        }

        function showOrderLockOverlay(message, upgradeUrl) {
            const ordersCard = document.getElementById('ordersCard');
            if (!ordersCard) return;
            const existingOverlay = ordersCard.querySelector('.tier-lock-overlay');
            if (existingOverlay) existingOverlay.remove();

            const overlay = document.createElement('div');
            overlay.className = 'tier-lock-overlay';
            overlay.innerHTML = `
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0110 0v4"></path>
                </svg>
                <h3>ניהול הזמנות נעול</h3>
                <p>${message || 'שדרג כדי לפתוח ניהול הזמנות מלא'}</p>
                <a href="${upgradeUrl || '/pay?plan=pro'}" class="btn btn-primary">שדרג עכשיו</a>
            `;
            ordersCard.appendChild(overlay);
        }

            if (!sidebar) return;
            const sidebarLinks = sidebar.querySelectorAll('.sidebar-link, .sidebar-collapsible');
            
            sidebarLinks.forEach(link => {
                const text = link.textContent || '';
                if ((text.includes('הזמנות') || text.includes('orders')) && !features.order_management) {
                    link.style.opacity = '0.4';
                    link.style.pointerEvents = 'none';
                    link.title = 'זמין בתכניות PRO ו-PREMIUM';

                    link.style.opacity = '0.4';
                    link.style.pointerEvents = 'none';
                    link.title = 'זמין בתכניות PRO ו-PREMIUM';
                }
            });
        }

        function exportOrdersCSV() {
            const orders = document.querySelectorAll('#ordersBody .transaction-item');
            if (!orders.length) return;
            let csvContent = '\uFEFF';
            csvContent += 'מספר הזמנה;סטטוס;סכום;תאריך\n';
            orders.forEach(order => {
                const cols = order.querySelectorAll('td');
                if (cols.length >= 4) {
                    csvContent += `"${cols[0]?.textContent?.trim() || ''}";"${cols[1]?.textContent?.trim() || ''}";"${cols[2]?.textContent?.trim() || ''}";"${cols[3]?.textContent?.trim() || ''}"\n`;
                }
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'orders.csv';
            link.click();
        }

        function exportOrdersJSON() {
            const orders = [];
            document.querySelectorAll('#ordersBody .transaction-item').forEach(order => {
                const cols = order.querySelectorAll('td');
                if (cols.length >= 4) {
                    orders.push({
                        order_number: cols[0]?.textContent?.trim(),
                        status: cols[1]?.textContent?.trim(),
                        total: cols[2]?.textContent?.trim(),
                        date: cols[3]?.textContent?.trim()
                    });
                }
            });
            const blob = new Blob([JSON.stringify(orders, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'orders.json';
            link.click();
        }

        function renderOrders(orders) {
            const ordersBody = document.getElementById('ordersBody');
            if (!ordersBody) return;

            if (!orders || orders.length === 0) {
                ordersBody.innerHTML = `
                    <div class="empty-state">
                        <p>אין הזמנות להצגה</p>
                    </div>
                `;
                return;
            }

            const statusLabels = {
                pending: 'ממתינה',
                processing: 'בטיפול',
                paid: 'שולם',
                shipped: 'נשלחה',
                delivered: 'נמסרה',
                canceled: 'בוטלה',
                refunded: 'החזר'
            };

            ordersBody.innerHTML = orders.map(order => `
                <div class="transaction-item">
                    <div class="transaction-info">
                        <div class="transaction-name">הזמנה #${order.order_number || order.id?.slice(0, 8)}</div>
                        <div class="transaction-meta">
                            <span class="transaction-date">${order.created_at ? new Date(order.created_at).toLocaleDateString('he-IL') : ''}</span>
                            <span class="transaction-status status-${order.status}">${statusLabels[order.status] || order.status}</span>
                        </div>
                    </div>
                    <div class="transaction-amount">₪${(order.total || 0).toLocaleString('he-IL', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
                </div>
            `).join('');
        }

        function renderProducts(products) {
            const productsBody = document.getElementById('productsBody');
            if (!productsBody) return;

            if (!products || products.length === 0) {
                productsBody.innerHTML = `
                    <div class="empty-state">
                        <p>אין מוצרים להצגה</p>
                    </div>
                `;
                return;
            }

            productsBody.innerHTML = products.map(product => `
                <div class="transaction-item">
                    <div class="transaction-info">
                        <div class="transaction-name">${product.name || 'מוצר ללא שם'}</div>
                        <div class="transaction-meta">
                            <span class="transaction-date">מלאי: ${product.stock ?? 0}</span>
                            ${product.category ? `<span class="transaction-status status-processing">${product.category}</span>` : ''}
                        </div>
                    </div>
                    <div class="transaction-amount">₪${(product.price || 0).toLocaleString('he-IL', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>

        function checkAuth() {
            const token = localStorage.getItem('access_token');
            if (!token) {
                window.location.href = 'login.html';
                return false;
            }
            return true;
        }

        function logout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('user_id');
            localStorage.removeItem('email');
            window.location.href = 'login.html';
        }

        // Initialize tier indicator
        const tierIndicator = document.getElementById('tierIndicator');
        if (tierIndicator) {
            const tierLabels = { free: 'חינמי', pro: 'PRO', premium: 'PREMIUM' };
            tierIndicator.textContent = tierLabels['free'] || 'FREE';
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (checkAuth()) {
                loadDashboardData();
            }
        });

        async function loadDashboardData() {
            try {
                const token = localStorage.getItem('access_token');
                if (!token) {
                    window.location.href = 'login.html';
                    return;
                }

                const userResponse = await fetch(`${API_BASE_URL}/auth/me`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!userResponse.ok) {
                    if (userResponse.status === 401) {
                        localStorage.removeItem('access_token');
                        window.location.href = 'login.html';
                        return;
                    }
                    if (userResponse.status === 403) {
                        const data = await userResponse.json();
                        alert(data.detail || 'אנא אמת את כתובת הדוא"ל שלך לפני גישה לדאשבורד');
                        window.location.href = 'verify-email.html';
                        return;
                    }
                    throw new Error('Failed to fetch user info');
                }

                const userData = await userResponse.json();
                const plan_type = userData.profile?.plan_type || 'free';

                addTierIndicator(plan_type);
                applyTierLocks(plan_type);

                // Fetch features
                const featuresResponse = await fetch(`${API_BASE_URL}/dashboard/features`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!featuresResponse.ok) {
                    if (featuresResponse.status === 401) {
                        localStorage.removeItem('access_token');
                        window.location.href = 'login.html';
                        return;
                    }
                    throw new Error('Failed to fetch features');
                }

                const features = await featuresResponse.json();
                applyFeatureVisibility(features);

                const analyticsResponse = await fetch(`${API_BASE_URL}/analytics/overview`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!analyticsResponse.ok) {
                    if (analyticsResponse.status === 401) {
                        localStorage.removeItem('access_token');
                        window.location.href = 'login.html';
                        return;
                    }
                    throw new Error('Failed to fetch analytics');
                }

                const analytics = await analyticsResponse.json();
                renderStats(analytics);

                let orders = [];
                let products = [];
                try {
                    const businessesResponse = await fetch(`${API_BASE_URL}/businesses`, {
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        }
                    });

                    if (!businessesResponse.ok) {
                        if (businessesResponse.status === 401) {
                            localStorage.removeItem('access_token');
                            window.location.href = 'login.html';
                            return;
                        }
                    } else {
                        const businesses = await businessesResponse.json();
                        const firstBusinessId = businesses && businesses.length > 0 ? businesses[0].business_id || businesses[0].id : null;
                        if (firstBusinessId) {
                            const ordersResponse = await fetch(`${API_BASE_URL}/dashboard/orders`, {
                                headers: {
                                    'Authorization': `Bearer ${token}`,
                                    'Content-Type': 'application/json'
                                }
                            });

                            if (ordersResponse.ok) {
                                const ordersData = await ordersResponse.json();
                                orders = Array.isArray(ordersData.orders) ? ordersData.orders : [];
                                if (ordersData.locked) {
                                    showOrderLockOverlay(ordersData.lock_message, ordersData.upgrade_url);
                                }
                            } else if (ordersResponse.status === 401) {
                                localStorage.removeItem('access_token');
                                window.location.href = 'login.html';
                                return;
                            }

                            const productsResponse = await fetch(`${API_BASE_URL}/dashboard/products`, {
                                headers: {
                                    'Authorization': `Bearer ${token}`,
                                    'Content-Type': 'application/json'
                                }
                            });

                            if (productsResponse.ok) {
                                const productsData = await productsResponse.json();
                                products = Array.isArray(productsData.products) ? productsData.products : [];
                            } else if (productsResponse.status === 401) {
                                localStorage.removeItem('access_token');
                                window.location.href = 'login.html';
                                return;
                            }
                        }
                    }
                } catch (e) {
                    console.warn('Error fetching dashboard data:', e);
                }

                renderOrders(orders);
                renderProducts(products);
            } catch (error) {
                console.error('Error loading dashboard:', error);
                document.getElementById('statsGrid').innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:64px;height:64px;margin:0 auto 16px;display:block;">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <p>שגיאה בטעינת הנתונים. אנא רענן את הדף.</p>
                        <button class="btn btn-ghost" onclick="loadDashboardData()" style="margin-top:10px;">נסה שוב</button>
                    </div>
                `;
                document.getElementById('ordersBody').innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:64px;height:64px;margin:0 auto 16px;display:block;">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <p>שגיאה בטעינת הנתונים. אנא רענן את הדף.</p>
                        <button class="btn btn-ghost" onclick="loadDashboardData()" style="margin-top:10px;">נסה שוב</button>
                    </div>
                `;
            }
        }

        function svgSparkline(data, color) {
            const width = 120;
            const height = 40;
            const padding = 4;
            const max = Math.max(...data);
            const min = Math.min(...data);
            const range = max - min || 1;
            const points = data.map((v, i) => {
                const x = padding + (i / (data.length - 1)) * (width - padding * 2);
                const y = height - padding - ((v - min) / range) * (height - padding * 2);
                return `${x},${y}`;
            }).join(' ');

            const polyline = `<polyline points="${points}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
            const areaPoints = `${padding},${height - padding} ${points} ${width - padding},${height - padding}`;
            const area = `<polygon points="${areaPoints}" fill="${color}" opacity="0.15"/>`;

            return `<svg class="sparkline" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-hidden="true">${area}${polyline}</svg>`;
        }

        const STATUS_LABELS = {
            pending: 'ממתינה',
            processing: 'בטיפול',
            paid: 'שולם',
            shipped: 'נשלחה',
            delivered: 'נמסרה',
            canceled: 'בוטלה',
            refunded: 'החזר'
        };

        const STATUS_COLORS = {
            pending: '#F59E0B',
            processing: '#6366F1',
            paid: '#3B82F6',
            shipped: '#8B5CF6',
            delivered: '#10B981',
            canceled: '#EF4444',
            refunded: '#A0AEC0'
        };

        function formatCurrency(amount) {
            const normalized = Number(amount || 0);
            return `+₪${normalized.toLocaleString('he-IL', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        function formatDate(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            if (isNaN(d.getTime())) return String(iso);
            const now = new Date();
            const diffMs = now - d;
            const diffDays = Math.floor(diffMs / 86400000);
            const hours = d.getHours().toString().padStart(2, '0');
            const minutes = d.getMinutes().toString().padStart(2, '0');
            const timeLabel = `בשעה ${hours}:${minutes}`;
            if (diffDays === 0) return `היום ${timeLabel}`;
            if (diffDays === 1) return `אתמול ${timeLabel}`;
            const dateLabel = d.toLocaleDateString('he-IL', { day: 'numeric', month: 'long' });
            return `${dateLabel} ${timeLabel}`;
        }

        function renderOrders(orders) {
            const wrapper = document.getElementById('ordersBody');
            wrapper.setAttribute('aria-busy', 'false');

            if (!Array.isArray(orders) || orders.length === 0) {
                wrapper.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:64px;height:64px;margin:0 auto 16px;display:block;">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="8" x2="16" y2="16"></line>
                            <line x1="8" y1="8" x2="8" y2="16"></line>
                            <line x1="12" y1="8" x2="12" y2="16"></line>
                            <line x1="16" y1="12" x2="20" y2="12"></line>
                        </svg>
                        <p>אין הזמנות להצגה</p>
                    </div>
                `;
                return;
            }

            const itemsHtml = orders.map(order => {
                const status = (order.status || 'pending').toString().toLowerCase();
                const label = STATUS_LABELS[status] || status;
                const color = STATUS_COLORS[status] || '#A0AEC0';
                const amount = formatCurrency(order.total);
                const dateLabel = formatDate(order.created_at);
                const name = order.order_number ? `הזמנה #${order.order_number}` : 'הזמנה';
                return `
                    <li class="transaction-item">
                        <div class="transaction-info">
                            <div class="transaction-name">${name}</div>
                            <div class="transaction-meta">
                                <time class="transaction-date" datetime="${order.created_at || ''}">${dateLabel}</time>
                                <span class="transaction-status" style="background:${color}22;color:${color};">${label}</span>
                            </div>
                        </div>
                        <div class="transaction-amount">${amount}</div>
                    </li>
                `;
            }).join('');

            wrapper.innerHTML = `
                <ul class="transaction-list" aria-label="רשימת הזמנות">
                    ${itemsHtml}
                </ul>
            `;
        }

        function logout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('user_id');
            localStorage.removeItem('email');
            window.location.href = 'login.html';
        }

        async function getUserTier() {
            try {
                const token = localStorage.getItem('access_token');
                if (!token) return { plan_type: 'free', is_pro: false, email_verified: false };
                
                const response = await fetch(`${API_BASE_URL}/auth/me`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    if (response.status === 401) {
                        localStorage.removeItem('access_token');
                        window.location.href = 'login.html';
                        return { plan_type: 'free', is_pro: false, email_verified: false };
                    }
                    throw new Error('Failed to fetch user info');
                }
                
                const data = await response.json();
                return {
                    plan_type: data.user?.plan_type || 'free',
                    is_pro: data.user?.is_pro || false,
                    email_verified: data.user?.email_verified || false
                };
            } catch (error) {
                console.warn('Error fetching user tier:', error);
                return { plan_type: 'free', is_pro: false, email_verified: false };
            }
        }

        function createTierLockOverlay(card) {
            if (card.classList.contains('tier-locked')) return;
            card.classList.add('tier-locked');
            
            const overlay = document.createElement('div');
            overlay.className = 'tier-lock-overlay';
            overlay.setAttribute('aria-hidden', 'true');
            
            const svgNS = 'http://www.w3.org/2000/svg';
            const svg = document.createElementNS(svgNS, 'svg');
            svg.setAttribute('viewBox', '0 0 24 24');
            svg.setAttribute('fill', 'none');
            svg.setAttribute('stroke', 'currentColor');
            svg.setAttribute('stroke-width', '2');
            svg.setAttribute('stroke-linecap', 'round');
            svg.setAttribute('stroke-linejoin', 'round');
            
            const lockPath1 = document.createElementNS(svgNS, 'path');
            lockPath1.setAttribute('d', 'M12 22c5.523 0 10-4.477 10-10V5c0-2.761-2.239-5-5-5H9c-2.761 0-5 2.239-5 5v7c0 5.523 4.477 10 10 10z');
            svg.appendChild(lockPath1);
            
            const lockPath2 = document.createElementNS(svgNS, 'rect');
            lockPath2.setAttribute('x', '12');
            lockPath2.setAttribute('y', '8');
            lockPath2.setAttribute('width', '5');
            lockPath2.setAttribute('height', '4');
            lockPath2.setAttribute('rx', '1');
            svg.appendChild(lockPath2);
            
            const lockPath3 = document.createElementNS(svgNS, 'line');
            lockPath3.setAttribute('x1', '12');
            lockPath3.setAttribute('y1', '12');
            lockPath3.setAttribute('x2', '12');
            lockPath3.setAttribute('y2', '16');
            svg.appendChild(lockPath3);
            
            overlay.appendChild(svg);
            
            const title = document.createElement('h3');
            title.textContent = 'מוגבל לתוקף';
            overlay.appendChild(title);
            
            const desc = document.createElement('p');
            desc.textContent = 'תכונה זו דורשת גישה לרמה PRO או יותר';
            overlay.appendChild(desc);
            
            const benefits = document.createElement('div');
            benefits.className = 'tier-benefits';
            benefits.innerHTML = '<span>✓ בקטה כניסה אוטומטית לאתרי אינטרנט</span><span>✓ איזור מסחרי מותאם</span><span>✓ תמיכה בעסקאות</span>';
            overlay.appendChild(benefits);
            
            const btn = document.createElement('button');
            btn.className = 'btn btn-primary';
            btn.innerHTML = 'עלה לרמה PRO <span>₪49/חודש</span>';
            btn.style.display = 'inline-flex';
            btn.style.alignItems = 'center';
            btn.style.gap = '8px';
            overlay.appendChild(btn);
            
            card.style.position = 'relative';
            card.style.overflow = 'hidden';
            card.appendChild(overlay);
        }

        function applyTierLocks(plan_type) {
            if (plan_type === 'free') {
                const ordersCard = document.querySelector('#ordersTitle')?.closest('.card');
                if (ordersCard) {
                    ordersCard.classList.add('locked');
                    createTierLockOverlay(ordersCard);
                }
                
                const statsGrid = document.getElementById('statsGrid');
                if (statsGrid) {
                    statsGrid.querySelectorAll('.stat-card').forEach(card => {
                        card.classList.add('locked');
                    });
                }
            }
            
            if (plan_type !== 'premium') {
                const whatsappSection = Array.from(document.querySelectorAll('h2, h3')).find(h => 
                    h.textContent.includes('WhatsApp') || h.textContent.includes('וואטסאפ')
                );
                if (whatsappSection) {
                    const card = whatsappSection.closest('.card');
                    if (card) {
                        card.classList.add('locked');
                        createTierLockOverlay(card);
                    }
                }
            }
        }

        function addTierIndicator(plan_type) {
            const badge = document.createElement('div');
            badge.className = `plan-badge tier-${plan_type}`;
            badge.textContent = plan_type.toUpperCase();
            badge.style.cssText = 'position: absolute; top: 12px; left: 12px; z-index: 1000;';
            document.querySelector('.site-header')?.prepend(badge);
        }

        /* Sidebar & dropdown interactive behavior */
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const menuToggle = document.getElementById('menuToggle');
        const userTrigger = document.getElementById('userTrigger');
        const userMenu = document.getElementById('userMenu');

        function openSidebar() {
            sidebar.classList.add('open');
            sidebarOverlay.classList.add('open');
            sidebarOverlay.setAttribute('aria-hidden', 'false');
            menuToggle.setAttribute('aria-expanded', 'true');
            document.body.style.overflow = 'hidden';
        }

        function closeSidebar() {
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('open');
            sidebarOverlay.setAttribute('aria-hidden', 'true');
            menuToggle.setAttribute('aria-expanded', 'false');
            document.body.style.overflow = '';
        }

        menuToggle.addEventListener('click', () => {
            const expanded = menuToggle.getAttribute('aria-expanded') === 'true';
            expanded ? closeSidebar() : openSidebar();
        });

        sidebarOverlay.addEventListener('click', closeSidebar);

        userTrigger.addEventListener('click', () => {
            const isOpen = userMenu.classList.contains('open');
            userMenu.classList.toggle('open', !isOpen);
            userTrigger.setAttribute('aria-expanded', String(!isOpen));
        });

        document.addEventListener('click', (e) => {
            if (!userTrigger.contains(e.target) && !userMenu.contains(e.target)) {
                userMenu.classList.remove('open');
                userTrigger.setAttribute('aria-expanded', 'false');
            }
        });

        /* Collapsible sidebar sections */
        document.querySelectorAll('.sidebar-collapsible').forEach(button => {
            button.addEventListener('click', () => {
                const expanded = button.getAttribute('aria-expanded') === 'true';
                button.setAttribute('aria-expanded', String(!expanded));
                const submenu = button.nextElementSibling;
                if (submenu && submenu.classList.contains('sidebar-submenu')) {
                    submenu.classList.toggle('open', !expanded);
                }
            });
        });

        /* Filter chips */
        document.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', () => {
                const group = chip.parentElement;
                group.querySelectorAll('.chip').forEach(c => {
                    c.setAttribute('aria-pressed', 'false');
                });
                chip.setAttribute('aria-pressed', 'true');
            });
        });

        /* Lazy loading with Intersection Observer */
        if ('IntersectionObserver' in window) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const target = entry.target;
                        if (target.id === 'statsGrid' || target.closest('#statsGrid')) {
                            loadDashboardData();
                            observer.unobserve(target);
                        }
                        if (target.id === 'ordersBody') {
                            observer.unobserve(target);
                        }
                    }
                });
            }, { rootMargin: '200px' });

            observer.observe(document.getElementById('statsGrid'));
            observer.observe(document.getElementById('ordersBody'));
        } else {
            window.addEventListener('load', checkAuth);
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeSidebar();
                userMenu.classList.remove('open');
                userTrigger.setAttribute('aria-expanded', 'false');
            }
        });

        function serializeText(node) {
            return node ? node.textContent.trim() : '';
        }

        function parseAmount(raw) {
            return raw.replace(/[^\d.,-]/g, '').replace(',', '.');
        }

        function exportOrdersCSV() {
            const items = document.querySelectorAll('#ordersBody .transaction-item');
            if (!items.length) {
                console.warn('No orders available to export.');
                return;
            }
            const rows = [['שם', 'תאריך', 'סטטוס', 'סכום']];
            items.forEach(item => {
                const name = serializeText(item.querySelector('.transaction-name'));
                const date = serializeText(item.querySelector('.transaction-date'));
                const status = serializeText(item.querySelector('.transaction-status'));
                const amount = parseAmount(serializeText(item.querySelector('.transaction-amount')));
                rows.push([name, date, status, amount]);
            });
            const csvContent = rows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\r\n');
            const blob = new Blob(['\uFEFF', csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            const today = new Date().toISOString().slice(0, 10);
            link.href = url;
            link.download = `orders-${today}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function exportOrdersJSON() {
            const items = document.querySelectorAll('#ordersBody .transaction-item');
            if (!items.length) {
                console.warn('No orders available to export.');
                return;
            }
            const orders = Array.from(items).map(item => ({
                name: serializeText(item.querySelector('.transaction-name')),
                date: serializeText(item.querySelector('.transaction-date')),
                status: serializeText(item.querySelector('.transaction-status')),
                amount: parseAmount(serializeText(item.querySelector('.transaction-amount')))
            }));
            const json = JSON.stringify(orders, null, 2);
            const blob = new Blob([json], { type: 'application/json;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            const today = new Date().toISOString().slice(0, 10);
            link.href = url;
            link.download = `orders-${today}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
    </script>

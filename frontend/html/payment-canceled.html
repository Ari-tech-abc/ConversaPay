<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ConversaPay | התשלום בוטל</title>
  <link rel="stylesheet" href="/frontend/html/conversapay-ui.css">
  <style>
    .result-shell{min-height:calc(100vh - 92px);display:grid;place-items:center;padding-top:20px}.result-card{width:min(620px,100%);text-align:center;display:grid;gap:22px;justify-items:center}.result-icon{width:86px;height:86px;border-radius:28px;display:grid;place-items:center;background:#fffbeb;border:1px solid #fde68a;color:#d97706;font-size:2.4rem;box-shadow:0 8px 32px rgba(217,119,6,.1)}.result-copy{max-width:46ch}.result-copy h1{font-size:clamp(2rem,5vw,3.1rem);margin-bottom:10px}.result-actions{width:min(440px,100%)}.sandbox-note{padding:11px 14px;border-radius:999px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;font-size:.84rem;font-weight:700}.next-step{width:100%;padding:16px;border-radius:20px;text-align:right;background:var(--cp-panel-strong);border:1px solid var(--cp-line)}.next-step strong{display:block;margin-bottom:4px}
  </style>
</head>
<body class="cp-page">
  <header class="cp-topbar"><a class="cp-brand" href="/"><span class="cp-brand-mark">CP</span><span>ConversaPay</span></a><span class="cp-badge">Sandbox</span></header>
  <main class="cp-shell result-shell">
    <section class="cp-card result-card" aria-live="polite">
      <div class="result-icon" aria-hidden="true">!</div>
      <div class="result-copy"><span class="cp-kicker" style="justify-content:center">לא בוצע חיוב</span><h1>התשלום בוטל</h1><p class="cp-muted">לא בוצע חיוב ולא נוצרה עסקה. אפשר לחזור לדאשבורד ולנסות שוב בכל רגע.</p></div>
      <span class="sandbox-note">מצב בדיקות בלבד</span>
      <div class="next-step"><strong>מה עכשיו?</strong><span class="cp-muted">בדקו את פרטי ההזמנה, את הגדרות Stripe Sandbox ואת ה‑Webhook, ואז נסו שוב.</span></div>
      <div class="cp-actions result-actions"><a class="cp-button" href="/dashboard">חזרה לדאשבורד</a><a class="cp-button-secondary" href="/upgrade">חזרה לבחירת מסלול</a></div>
    </section>
  </main>
</body>
</html>

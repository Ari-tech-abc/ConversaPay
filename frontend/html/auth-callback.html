<!doctype html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ConversaPay - מתחבר...</title><style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1419;color:#f5f7fa}.box{text-align:center}.spinner{width:48px;height:48px;margin:auto;border:4px solid #6366f155;border-top-color:#6366f1;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}p{color:#a0aec0}</style></head><body><main class="box"><div class="spinner" aria-hidden="true"></div><p id="status">מאמת פרטי התחברות...</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
const API='/api/v1';function fail(){localStorage.setItem('auth_error','callback_error');location.href='login.html'};(async()=>{try{const cfg=await (await fetch(`${API}/config/public`)).json();const sb=window.supabase.createClient(cfg.supabase_url,cfg.supabase_anon_key);const hash=new URLSearchParams(location.hash.slice(1));const query=new URLSearchParams(location.search);if(query.get('error')||hash.get('error'))return fail();if(query.get('code')){const x=await sb.auth.exchangeCodeForSession(location.href);if(x.error)throw x.error}const {data}=await sb.auth.getSession();if(!data.session)return fail();const s=data.session;localStorage.setItem('access_token',s.access_token);localStorage.setItem('user_id',s.user.id);localStorage.setItem('email',s.user.email||'');const r=await fetch(`${API}/auth/oauth/session`,{method:'POST',headers:{Authorization:`Bearer ${s.access_token}`}});if(!r.ok)console.warn('OAuth provisioning failed');location.href='dashboard.html'}catch(e){console.error(e);fail()}})();</script></body></html>

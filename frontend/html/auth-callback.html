<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>משלימים התחברות | Talk2Pay</title><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#f7f5fb"><link rel="canonical" href="https://conversapay.org/auth/callback"><link rel="stylesheet" href="/frontend/html/conversapay-ui.css"></head>
<body class="cp-page"><main class="cp-shell cp-center-shell" id="main"><section class="cp-card cp-card-sm cp-text-center" aria-labelledby="page-title" aria-busy="true" id="callback-card"><div class="cp-spinner" aria-hidden="true"></div><h1 id="page-title">מתחברים לחשבון</h1><p id="status" class="cp-muted" role="status" aria-live="polite">מאמתים את פרטי ההתחברות...</p><p id="error" class="cp-notice error" role="alert" hidden></p><a id="retry" class="cp-button-secondary cp-full" href="/login" hidden>חזרה לכניסה</a></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script>
(()=>{'use strict';const API='/api/v1',LOGIN='/login',DEFAULT_NEXT='/dashboard',status=document.getElementById('status'),errorNode=document.getElementById('error'),retry=document.getElementById('retry'),card=document.getElementById('callback-card');const setStatus=message=>status.textContent=message;const safeNext=value=>{try{const url=new URL(value||DEFAULT_NEXT,location.origin);return url.origin===location.origin&&url.pathname.startsWith('/')?url.pathname+url.search+url.hash:DEFAULT_NEXT}catch{return DEFAULT_NEXT}};const fail=reason=>{console.error('[OAuth callback]',reason);sessionStorage.setItem('auth_error','callback_error');card.setAttribute('aria-busy','false');document.querySelector('.cp-spinner')?.remove();setStatus('ההתחברות לא הושלמה.');errorNode.textContent='לא הצלחנו לאמת את ההתחברות. חזרו למסך הכניסה ונסו שוב.';errorNode.hidden=false;retry.hidden=false;history.replaceState(null,'',location.pathname)};(async()=>{try{if(!window.supabase)throw new Error('Supabase SDK unavailable');const query=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.slice(1)),oauthError=query.get('error_description')||hash.get('error_description')||query.get('error')||hash.get('error');if(oauthError)throw new Error(oauthError);setStatus('טוענים הגדרות התחברות...');const configResponse=await fetch(`${API}/config/public`,{headers:{Accept:'application/json'}}),config=await configResponse.json();if(!configResponse.ok||!config.supabase_url||!config.supabase_anon_key)throw new Error('Invalid public auth config');const client=window.supabase.createClient(config.supabase_url,config.supabase_anon_key);if(query.has('code')){setStatus('משלימים התחברות מול Google...');const{error}=await client.auth.exchangeCodeForSession(location.href);if(error)throw error}const{data,error:sessionError}=await client.auth.getSession();if(sessionError||!data.session)throw sessionError||new Error('Missing OAuth session');const session=data.session;setStatus('מכינים את החשבון...');const provisionResponse=await fetch(`${API}/auth/oauth/session`,{method:'POST',headers:{Authorization:`Bearer ${session.access_token}`,Accept:'application/json'}}),provision=await provisionResponse.json().catch(()=>({}));if(!provisionResponse.ok)throw new Error(provision.detail||'Provisioning failed');localStorage.removeItem('conversapay_auth_token');localStorage.removeItem('conversapay_user');localStorage.setItem('access_token',session.access_token);localStorage.setItem('user_id',session.user.id);localStorage.removeItem('email');sessionStorage.removeItem('auth_error');const next=safeNext(sessionStorage.getItem('oauth_next'));sessionStorage.removeItem('oauth_next');history.replaceState(null,'',location.pathname);setStatus('התחברת בהצלחה. מעבירים אותך...');location.replace(next)}catch(error){fail(error?.message||'Unknown callback error')}})()})();
</script></body></html>

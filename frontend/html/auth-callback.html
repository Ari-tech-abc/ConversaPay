<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>משלימים התחברות | Talk2Pay</title><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#f7f8fc"><link rel="stylesheet" href="/frontend/html/conversapay-ui.css"><link rel="stylesheet" href="/frontend/css/language-switcher.css"><style>
body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 6%,rgba(109,93,252,.16),transparent 29%),radial-gradient(circle at 88% 8%,rgba(34,199,220,.12),transparent 28%),linear-gradient(180deg,#fbfbff,#f4f6fb 60%,#fafafe)!important;font-family:"Segoe UI",Arial,sans-serif!important}.oauth-shell{min-height:100vh;display:grid;place-items:center;padding:28px 16px}.oauth-card{width:min(560px,100%);position:relative;overflow:hidden;padding:38px 34px!important;border:1px solid rgba(91,79,232,.13)!important;border-radius:30px!important;background:rgba(255,255,255,.91)!important;backdrop-filter:blur(22px);box-shadow:0 32px 95px rgba(31,24,67,.13)!important;text-align:center}.oauth-card::before{content:"";position:absolute;width:240px;height:240px;top:-145px;inset-inline-end:-95px;border-radius:50%;background:radial-gradient(circle,rgba(109,93,252,.18),transparent 69%);pointer-events:none}.oauth-brand{display:inline-flex;align-items:center;gap:9px;margin-bottom:24px;text-decoration:none;color:#1c1e31;font-weight:750}.oauth-brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;color:#fff;background:linear-gradient(135deg,#6d5dfc,#4c7cf5 58%,#22c7dc);box-shadow:0 10px 24px rgba(91,79,232,.22)}.oauth-kicker{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid rgba(109,93,252,.13);border-radius:999px;background:linear-gradient(135deg,rgba(109,93,252,.08),rgba(34,199,220,.07));color:#6256d9;font-weight:700;font-size:.78rem}.oauth-kicker::before{content:"✦"}.oauth-card h1{margin:14px 0 10px;font-size:clamp(2rem,6vw,2.8rem);font-weight:750;letter-spacing:-.04em;color:#1a1c30}.oauth-card p{color:#73788d;line-height:1.7}.oauth-status{margin-top:22px;padding:15px 16px;border:1px solid rgba(91,79,232,.11);border-radius:16px;background:linear-gradient(135deg,rgba(248,247,255,.95),rgba(245,251,255,.94))}.oauth-loader{width:52px;height:52px;margin:20px auto 5px;position:relative}.oauth-loader::before,.oauth-loader::after{content:"";position:absolute;inset:0;border-radius:50%}.oauth-loader::before{border:4px solid #e8e7f3}.oauth-loader::after{border:4px solid transparent;border-top-color:#6d5dfc;border-right-color:#22b8d5;animation:spin .8s linear infinite}.oauth-check{display:none;width:52px;height:52px;margin:20px auto 5px;border-radius:50%;place-items:center;color:white;font-size:24px;font-weight:800;background:linear-gradient(135deg,#6d5dfc,#22b8d5);box-shadow:0 10px 25px rgba(91,79,232,.22)}.oauth-card.success .oauth-loader{display:none}.oauth-card.success .oauth-check{display:grid}.oauth-card.error .oauth-loader{display:none}.oauth-card.error .oauth-check{display:grid;background:linear-gradient(135deg,#ef5350,#e43f5a)}.oauth-card.error .oauth-check::before{content:"×"}.oauth-card.success .oauth-check::before{content:"✓"}.oauth-card:not(.success):not(.error) .oauth-check{display:none}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:560px){.oauth-card{padding:30px 22px!important;border-radius:24px!important}}
</style></head>
<body class="cp-page"><div class="cp-toast-wrap" id="toastWrap"></div><main class="oauth-shell"><section class="cp-card oauth-card" aria-labelledby="page-title" aria-busy="true" id="callback-card"><a class="oauth-brand" href="/"><span class="oauth-brand-mark">T2P</span><span>Talk2Pay</span></a><div><span class="oauth-kicker">Google OAuth</span><h1 id="page-title">מתחברים לחשבון</h1><p>אנחנו מאמתים את ההתחברות ומכינים עבורך את סביבת העבודה.</p></div><div class="oauth-loader" aria-hidden="true"></div><div class="oauth-check" aria-hidden="true"></div><div class="oauth-status"><p id="status" role="status">מאמתים את פרטי ההתחברות...</p></div><a id="retry" class="cp-button-secondary cp-full cp-mt-md" href="/login" hidden>חזרה לכניסה</a></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" crossorigin="anonymous"></script>
<script>
(()=>{'use strict';const API='/api/v1',$=id=>document.getElementById(id),statusNode=$('status'),retry=$('retry'),card=$('callback-card');const timeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(Error('timeout')),ms))]);function fail(){sessionStorage.setItem('auth_error','callback_error');card.setAttribute('aria-busy','false');card.classList.remove('success');card.classList.add('error');statusNode.textContent='ההתחברות לא הושלמה.';retry.hidden=false;const wrap=$('toastWrap'),t=document.createElement('div');t.className='cp-toast error';t.innerHTML='<span class="cp-toast-icon">✕</span><span>לא הצלחנו לאמת את ההתחברות עם Google. נסה שוב.</span><button class="cp-toast-close">×</button>';t.children[2].onclick=()=>t.remove();wrap.appendChild(t);history.replaceState(null,'',location.pathname)}
(async()=>{try{if(!window.supabase)throw Error('sdk');const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.slice(1));if(q.get('error')||h.get('error'))throw Error('oauth');const cr=await timeout(fetch(API+'/config/public',{headers:{Accept:'application/json'}}),10000),config=await cr.json();if(!cr.ok)throw Error('config');const client=window.supabase.createClient(config.supabase_url,config.supabase_anon_key);if(q.has('code')){statusNode.textContent='משלימים התחברות מול Google...';const {error}=await timeout(client.auth.exchangeCodeForSession(location.href),15000);if(error)throw error}else if(h.get('access_token')){const {error}=await timeout(client.auth.setSession({access_token:h.get('access_token'),refresh_token:h.get('refresh_token')||''}),10000);if(error)throw error}const {data,error}=await timeout(client.auth.getSession(),10000);if(error||!data.session)throw error||Error('session');const session=data.session;statusNode.textContent='מכינים את החשבון...';const pr=await timeout(fetch(API+'/auth/oauth/session',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,Accept:'application/json'}}),15000),provision=await pr.json().catch(()=>({}));if(!pr.ok)throw Error(provision.detail||'provision');for(const target of [localStorage,sessionStorage])['access_token','conversapay_auth_token','conversapay_user','user_id','email'].forEach(k=>target.removeItem(k));localStorage.setItem('access_token',session.access_token);localStorage.setItem('user_id',session.user.id);sessionStorage.removeItem('auth_error');sessionStorage.removeItem('oauth_next');history.replaceState(null,'',location.pathname);card.classList.add('success');card.setAttribute('aria-busy','false');statusNode.textContent='התחברת בהצלחה. מעבירים אותך...';setTimeout(()=>location.replace(provision.requires_business_onboarding?'/onboarding':'/dashboard'),420)}catch(_){fail()}})()})();
</script><script src="/frontend/js/language-switcher.js"></script></body></html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConversaPay - מתחבר...</title>
    <style>
        * { font-family: 'Rubik', sans-serif; box-sizing: border-box; margin: 0; padding: 0; }
        body { background: linear-gradient(135deg, #0F1419 0%, #1a1f2e 50%, #0f1419 100%); color: #F5F7FA; min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px; }
        .spinner { width: 48px; height: 48px; border: 4px solid rgba(99, 102, 241, 0.3); border-top-color: #6366F1; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { color: #A0AEC0; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="spinner" aria-hidden="true"></div>
    <p id="statusText">מאמת פרטי התחברות...</p>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script>
        // OAuth completes in the browser. The Supabase JS SDK stored the PKCE
        // code_verifier in localStorage before redirecting to the provider, so
        // it can now exchange the returned code for a real session. Our backend
        // is only called afterwards, with that session's token, to provision a
        // profile + starter business (see backend/routers/auth.py).
        const API_BASE_URL = '/api/v1';

        function failToLogin(reason) {
            localStorage.setItem('auth_error', reason);
            window.location.href = '/login.html';
        }

        (async function () {
            const params = new URLSearchParams(window.location.search);
            if (params.get('error')) {
                failToLogin(params.get('error'));
                return;
            }

            try {
                const cfgRes = await fetch(`${API_BASE_URL}/config/public`);
                if (!cfgRes.ok) throw new Error('config');
                const cfg = await cfgRes.json();
                const sb = window.supabase.createClient(cfg.supabase_url, cfg.supabase_anon_key);

                // Exchange the ?code for a session using the stored PKCE verifier.
                const code = params.get('code');
                if (code) {
                    const { error } = await sb.auth.exchangeCodeForSession(window.location.href);
                    if (error) throw error;
                }

                const { data: { session } } = await sb.auth.getSession();
                if (!session) {
                    failToLogin('no_session');
                    return;
                }

                localStorage.setItem('access_token', session.access_token);
                localStorage.setItem('user_id', session.user.id);
                localStorage.setItem('email', session.user.email || '');

                // Provision profile + business on first OAuth login. Non-fatal.
                try {
                    await fetch(`${API_BASE_URL}/auth/oauth/session`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${session.access_token}`,
                            'Content-Type': 'application/json'
                        }
                    });
                } catch (provisionError) {
                    console.warn('OAuth provisioning skipped:', provisionError);
                }

                window.location.href = '/dashboard.html';
            } catch (e) {
                console.error('Auth callback error:', e);
                failToLogin('callback_error');
            }
        })();
    </script>
</body>
</html>

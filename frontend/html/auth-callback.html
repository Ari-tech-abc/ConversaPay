<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>משלימים התחברות | Talk2Pay</title>
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f7f5fb">
  <link rel="stylesheet" href="/frontend/html/conversapay-ui.css">
</head>
<body class="cp-page">
  <main class="cp-shell cp-center-shell">
    <section class="cp-card cp-card-sm cp-text-center" aria-labelledby="page-title" aria-busy="true" id="callback-card">
      <div class="cp-spinner" aria-hidden="true"></div>
      <h1 id="page-title">מתחברים לחשבון</h1>
      <p id="status" class="cp-muted" role="status" aria-live="polite">מאמתים את פרטי ההתחברות...</p>
      <p id="error" class="cp-notice error" role="alert" hidden></p>
      <a id="retry" class="cp-button-secondary cp-full cp-mt-md" href="/login" hidden>חזרה לכניסה</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" crossorigin="anonymous"></script>
  <script>
(()=>{'use strict';
const API='/api/v1',DEFAULT_NEXT='/dashboard';
const status=document.getElementById('status'),errorNode=document.getElementById('error'),retry=document.getElementById('retry'),card=document.getElementById('callback-card');
const setStatus=msg=>status.textContent=msg;
const safeNext=value=>{try{const url=new URL(value||DEFAULT_NEXT,location.origin);return url.origin===location.origin&&url.pathname.startsWith('/')?url.pathname+url.search+url.hash:DEFAULT_NEXT}catch{return DEFAULT_NEXT}};
const timeout=(promise,ms)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')),ms))]);
const fail=reason=>{console.error('[OAuth callback]',reason);sessionStorage.setItem('auth_error','callback_error');card.setAttribute('aria-busy','false');document.querySelector('.cp-spinner')?.remove();setStatus('\u05d4\u05d4\u05ea\u05d7\u05d1\u05e8\u05d5\u05ea \u05dc\u05d0 \u05d4\u05d5\u05e9\u05dc\u05de\u05d4.');errorNode.textContent='\u05dc\u05d0 \u05d4\u05e6\u05dc\u05d7\u05e0\u05d5 \u05dc\u05d0\u05de\u05ea \u05d0\u05ea \u05d4\u05d4\u05ea\u05d7\u05d1\u05e8\u05d5\u05ea. \u05d7\u05d6\u05e8\u05d5 \u05dc\u05de\u05e1\u05da \u05d4\u05db\u05e0\u05d9\u05e1\u05d4 \u05d5\u05e0\u05e1\u05d5 \u05e9\u05d5\u05d1.';errorNode.hidden=false;retry.hidden=false;history.replaceState(null,'',location.pathname)};
(async()=>{try{
  if(!window.supabase)throw new Error('Supabase SDK unavailable');
  const query=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.slice(1));
  const oauthError=query.get('error_description')||hash.get('error_description')||query.get('error')||hash.get('error');
  if(oauthError)throw new Error(oauthError);
  setStatus('\u05d8\u05d5\u05e2\u05e0\u05d9\u05dd \u05d4\u05d2\u05d3\u05e8\u05d5\u05ea \u05d4\u05ea\u05d7\u05d1\u05e8\u05d5\u05ea...');
  const configResponse=await timeout(fetch(`${API}/config/public`,{headers:{Accept:'application/json'},credentials:'same-origin'}),10000),config=await configResponse.json();
  if(!configResponse.ok||!config.supabase_url||!config.supabase_anon_key)throw new Error('Invalid public auth config');
  const client=window.supabase.createClient(config.supabase_url,config.supabase_anon_key);
  if(query.has('code')){
    setStatus('\u05de\u05e9\u05dc\u05d9\u05de\u05d9\u05dd \u05d4\u05ea\u05d7\u05d1\u05e8\u05d5\u05ea \u05de\u05d5\u05dc Google...');
    const{error}=await timeout(client.auth.exchangeCodeForSession(location.href),15000);
    if(error)throw error;
  } else if(hash.get('access_token')){
    setStatus('\u05de\u05e9\u05dc\u05d9\u05de\u05d9\u05dd \u05d4\u05ea\u05d7\u05d1\u05e8\u05d5\u05ea...');
    const{error}=await timeout(client.auth.setSession({access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token')||''}),10000);
    if(error)throw error;
  }
  const{data,error:sessionError}=await timeout(client.auth.getSession(),10000);
  if(sessionError||!data.session)throw sessionError||new Error('Missing OAuth session');
  const session=data.session;
  setStatus('\u05de\u05db\u05d9\u05e0\u05d9\u05dd \u05d0\u05ea \u05d4\u05d7\u05e9\u05d1\u05d5\u05df...');
  const provisionResponse=await timeout(fetch(`${API}/auth/oauth/session`,{method:'POST',headers:{Authorization:`Bearer ${session.access_token}`,Accept:'application/json'},credentials:'same-origin'}),15000),provision=await provisionResponse.json().catch(()=>({}));
  if(!provisionResponse.ok)throw new Error(provision.detail||'Provisioning failed');
  for(const target of [localStorage,sessionStorage]){target.removeItem('access_token');target.removeItem('conversapay_auth_token');target.removeItem('conversapay_user');target.removeItem('user_id');target.removeItem('email')}
  localStorage.setItem('access_token',session.access_token);
  localStorage.setItem('user_id',session.user.id);
  sessionStorage.removeItem('auth_error');
  const next=safeNext(sessionStorage.getItem('oauth_next'));
  sessionStorage.removeItem('oauth_next');
  history.replaceState(null,'',location.pathname);
  setStatus('\u05d4\u05ea\u05d7\u05d1\u05e8\u05ea \u05d1\u05d4\u05e6\u05dc\u05d7\u05d4. \u05de\u05e2\u05d1\u05d9\u05e8\u05d9\u05dd \u05d0\u05d5\u05ea\u05da...');
  location.replace(next);
}catch(error){fail(error?.message||'Unknown callback error')}})();
})();
</script></body></html>

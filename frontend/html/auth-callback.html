<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>משלימים התחברות | Talk2Pay</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f7f5fb"><link rel="icon" type="image/png" href="/images/favicon-32x32.png"><link rel="stylesheet" href="/frontend/html/conversapay-ui.css"></head>
<body class="cp-page"><main class="cp-shell cp-center-shell"><section class="cp-card cp-card-sm cp-text-center" aria-labelledby="title" aria-busy="true" id="callback-card"><div class="cp-spinner" aria-hidden="true"></div><h1 id="title" class="cp-mb-sm">משלימים את ההתחברות</h1><p id="status" class="cp-muted" role="status" aria-live="polite">מאמתים את פרטי החשבון...</p><a id="retry" class="cp-button-secondary cp-full cp-mt-md" href="/login" hidden>חזרה לכניסה</a></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" crossorigin="anonymous"></script>
<script>
(()=>{'use strict';const API='/api/v1',card=document.getElementById('callback-card'),status=document.getElementById('status'),retry=document.getElementById('retry'),setStatus=text=>{status.textContent=text},fail=reason=>{console.error('[OAuth callback]',reason);sessionStorage.setItem('auth_error','callback_error');card.setAttribute('aria-busy','false');setStatus('ההתחברות לא הושלמה. אפשר לחזור ולנסות שוב.');retry.hidden=false};const timeout=(promise,ms)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(Error('timeout')),ms))]);(async()=>{try{const query=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.slice(1)),providerError=query.get('error_description')||hash.get('error_description')||query.get('error')||hash.get('error');if(providerError)throw Error(providerError);setStatus('טוענים הגדרות התחברות...');const configResponse=await timeout(fetch(`${API}/config/public`,{headers:{Accept:'application/json'},credentials:'same-origin'}),10000);if(!configResponse.ok)throw Error('config_failed');const config=await configResponse.json();if(!window.supabase||!config.supabase_url||!config.supabase_anon_key)throw Error('invalid_config');const client=window.supabase.createClient(config.supabase_url,config.supabase_anon_key);if(query.has('code')){setStatus('משלימים התחברות מול Google...');const {error}=await timeout(client.auth.exchangeCodeForSession(location.href),15000);if(error)throw error}const {data,error}=await timeout(client.auth.getSession(),10000);if(error||!data.session)throw error||Error('missing_session');const session=data.session;setStatus('מכינים את סביבת העבודה...');const provision=await timeout(fetch(`${API}/auth/oauth/session`,{method:'POST',headers:{Authorization:`Bearer ${session.access_token}`,Accept:'application/json'},credentials:'same-origin'}),15000),result=await provision.json().catch(()=>({}));if(!provision.ok)throw Error(result.detail||'provision_failed');localStorage.setItem('access_token',session.access_token);localStorage.setItem('user_id',session.user.id);localStorage.setItem('email',session.user.email||'');localStorage.removeItem('auth_error');sessionStorage.removeItem('auth_error');history.replaceState(null,'','/auth/callback');card.setAttribute('aria-busy','false');setStatus('התחברת בהצלחה. מעבירים ללוח הבקרה...');location.replace('/dashboard')}catch(error){fail(error?.message||'callback_failed')}})()})();
</script></body></html>

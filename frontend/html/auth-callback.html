<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConversaPay - מתחבר...</title>
    <style>
        * {
            font-family: 'Rubik', sans-serif;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0F1419 0%, #1a1f2e 50%, #0f1419 100%);
            color: #F5F7FA;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(99, 102, 241, 0.3);
            border-top-color: #6366F1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        p {
            color: #A0AEC0;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="spinner" aria-hidden="true"></div>
    <p>מאמת פרטי התחברות...</p>

    <script>
        (async function() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const error = params.get('error');

            if (error) {
                localStorage.setItem('auth_error', error);
                window.location.href = '/login.html';
                return;
            }

            if (!code) {
                window.location.href = '/login.html';
                return;
            }

            try {
                const res = await fetch(`/api/v1/auth/google/callback?code=${encodeURIComponent(code)}`);
                const data = await res.json();

                if (data.access_token) {
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('user_id', data.user_id);
                    localStorage.setItem('email', data.email);
                    window.location.href = '/dashboard.html';
                } else {
                    localStorage.setItem('auth_error', 'callback_failed');
                    window.location.href = '/login.html';
                }
            } catch (e) {
                console.error('Auth callback error:', e);
                localStorage.setItem('auth_error', 'callback_error');
                window.location.href = '/login.html';
            }
        })();
    </script>
</body>
</html>

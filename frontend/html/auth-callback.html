<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>משלימים התחברות | Talk2Pay</title><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#f7f5fb"><link rel="stylesheet" href="/frontend/html/conversapay-ui.css"><link rel="stylesheet" href="/frontend/css/language-switcher.css"></head>
<body class="cp-page"><div class="cp-toast-wrap" id="toastWrap"></div><main class="cp-shell cp-center-shell"><section class="cp-card cp-card-sm cp-text-center" aria-labelledby="page-title" aria-busy="true" id="callback-card"><div class="cp-spinner" aria-hidden="true"></div><h1 id="page-title">מתחברים לחשבון</h1><p id="status" class="cp-muted" role="status">מאמתים את פרטי ההתחברות...</p><a id="retry" class="cp-button-secondary cp-full cp-mt-md" href="/login" hidden>חזרה לכניסה</a></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" crossorigin="anonymous"></script>
<script>
(()=>{'use strict';const API='/api/v1',$=id=>document.getElementById(id),statusNode=$('status'),retry=$('retry'),card=$('callback-card');const timeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(Error('timeout')),ms))]);function fail(){sessionStorage.setItem('auth_error','callback_error');card.setAttribute('aria-busy','false');document.querySelector('.cp-spinner')?.remove();statusNode.textContent='ההתחברות לא הושלמה.';retry.hidden=false;const wrap=$('toastWrap'),t=document.createElement('div');t.className='cp-toast error';t.innerHTML='<span class="cp-toast-icon">✕</span><span>לא הצלחנו לאמת את ההתחברות עם Google. נסה שוב.</span><button class="cp-toast-close">×</button>';t.children[2].onclick=()=>t.remove();wrap.appendChild(t);history.replaceState(null,'',location.pathname)}
(async()=>{try{if(!window.supabase)throw Error('sdk');const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.slice(1));if(q.get('error')||h.get('error'))throw Error('oauth');const cr=await timeout(fetch(API+'/config/public',{headers:{Accept:'application/json'}}),10000),config=await cr.json();if(!cr.ok)throw Error('config');const client=window.supabase.createClient(config.supabase_url,config.supabase_anon_key);if(q.has('code')){statusNode.textContent='משלימים התחברות מול Google...';const {error}=await timeout(client.auth.exchangeCodeForSession(location.href),15000);if(error)throw error}else if(h.get('access_token')){const {error}=await timeout(client.auth.setSession({access_token:h.get('access_token'),refresh_token:h.get('refresh_token')||''}),10000);if(error)throw error}const {data,error}=await timeout(client.auth.getSession(),10000);if(error||!data.session)throw error||Error('session');const session=data.session;statusNode.textContent='מכינים את החשבון...';const pr=await timeout(fetch(API+'/auth/oauth/session',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,Accept:'application/json'}}),15000),provision=await pr.json().catch(()=>({}));if(!pr.ok)throw Error(provision.detail||'provision');for(const target of [localStorage,sessionStorage])['access_token','conversapay_auth_token','conversapay_user','user_id','email'].forEach(k=>target.removeItem(k));localStorage.setItem('access_token',session.access_token);localStorage.setItem('user_id',session.user.id);sessionStorage.removeItem('auth_error');sessionStorage.removeItem('oauth_next');history.replaceState(null,'',location.pathname);statusNode.textContent='התחברת בהצלחה. מעבירים אותך...';location.replace(provision.requires_business_onboarding?'/onboarding':'/dashboard')}catch(_){fail()}})()})();
</script><script src="/frontend/js/language-switcher.js"></script></body></html>

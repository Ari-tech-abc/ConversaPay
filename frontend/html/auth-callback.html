<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConversaPay - מתחבר...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Rubik, system-ui, sans-serif; background: #0F1419; color: #F5F7FA; min-height: 100vh; display: grid; place-items: center; }
        .card { width: min(92vw, 420px); padding: 36px; text-align: center; background: rgba(26,31,46,.78); border: 1px solid rgba(255,255,255,.1); border-radius: 24px; box-shadow: 0 20px 48px rgba(0,0,0,.45); }
        .spinner { width: 48px; height: 48px; margin: 0 auto 20px; border: 4px solid rgba(99,102,241,.3); border-top-color: #6366F1; border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { color: #A0AEC0; }
        .error { color: #FCA5A5; }
    </style>
</head>
<body>
    <main class="card" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p id="statusText">מאמת פרטי התחברות...</p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script>
        const API_BASE_URL = '/api/v1';
        const statusText = document.getElementById('statusText');
        function failToLogin(reason) {
            statusText.textContent = 'ההתחברות נכשלה. מעביר אותך לכניסה...';
            statusText.classList.add('error');
            localStorage.setItem('auth_error', reason);
            setTimeout(() => { window.location.href = '/login.html'; }, 900);
        }
        (async function () {
            try {
                const params = new URLSearchParams(window.location.search);
                const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
                if (params.get('error') || hash.get('error')) {
                    failToLogin(params.get('error_description') || hash.get('error_description') || 'oauth_error');
                    return;
                }
                const cfgRes = await fetch(`${API_BASE_URL}/config/public`, { headers: { Accept: 'application/json' } });
                if (!cfgRes.ok) throw new Error('config');
                const cfg = await cfgRes.json();
                const sb = window.supabase.createClient(cfg.supabase_url, cfg.supabase_anon_key);
                const code = params.get('code');
                if (code) {
                    const { error } = await sb.auth.exchangeCodeForSession(window.location.href);
                    if (error) throw error;
                }
                const { data: { session } } = await sb.auth.getSession();
                if (!session) { failToLogin('no_session'); return; }
                localStorage.setItem('access_token', session.access_token);
                localStorage.setItem('user_id', session.user.id);
                localStorage.setItem('email', session.user.email || '');
                const provision = await fetch(`${API_BASE_URL}/auth/oauth/session`, {
                    method: 'POST',
                    headers: { Authorization: `Bearer ${session.access_token}`, 'Content-Type': 'application/json' }
                });
                if (!provision.ok) console.warn('OAuth provisioning returned', provision.status);
                window.location.replace('/dashboard.html');
            } catch (error) {
                console.error('Auth callback error:', error);
                failToLogin('callback_error');
            }
        }());
    </script>
</body>
</html>

<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ConversaPay - מתחבר...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/html/conversapay-ui.css">
</head>
<body class="cp-page">
  <main class="cp-shell" style="display:grid;place-items:center;min-height:calc(100vh - 80px);">
    <section class="cp-card" style="width:min(480px,100%);text-align:center;">
      <div class="cp-spinner" aria-hidden="true"></div>
      <h1 style="margin-bottom:10px;">מתחבר לחשבון</h1>
      <p id="status" class="cp-muted">מאמת פרטי התחברות...</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const API = '/api/v1';
    const DASHBOARD_ROUTE = '/dashboard';
    const LOGIN_ROUTE = '/login';

    function fail() {
      localStorage.setItem('auth_error', 'callback_error');
      location.href = LOGIN_ROUTE;
    }

    (async () => {
      try {
        const cfg = await (await fetch(`${API}/config/public`)).json();
        const sb = window.supabase.createClient(cfg.supabase_url, cfg.supabase_anon_key);
        const hash = new URLSearchParams(location.hash.slice(1));
        const query = new URLSearchParams(location.search);

        if (query.get('error') || hash.get('error')) return fail();

        if (query.get('code')) {
          const x = await sb.auth.exchangeCodeForSession(location.href);
          if (x.error) throw x.error;
        }

        const { data } = await sb.auth.getSession();
        if (!data.session) return fail();

        const s = data.session;
        localStorage.setItem('access_token', s.access_token);
        localStorage.setItem('user_id', s.user.id);
        localStorage.setItem('email', s.user.email || '');

        const r = await fetch(`${API}/auth/oauth/session`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${s.access_token}` }
        });
        if (!r.ok) console.warn('OAuth provisioning failed');

        location.href = DASHBOARD_ROUTE;
      } catch (e) {
        console.error(e);
        fail();
      }
    })();
  </script>
</body>
</html>

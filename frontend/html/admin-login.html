<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ConversaPay - כניסת מנהל</title>
  <style>
    :root {
      --bg: #0F1419;
      --card: rgba(26,31,46,.78);
      --text: #F5F7FA;
      --muted: #A0AEC0;
      --a: #6366F1;
      --b: #8B5CF6;
    }
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--bg), #1a1f2e, var(--bg));
      color: var(--text);
    }
    main {
      width: min(420px, calc(100% - 32px));
      padding: 34px;
      background: var(--card);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 22px;
      box-shadow: 0 20px 48px #0008;
    }
    h1 {
      text-align: center;
      background: linear-gradient(135deg, var(--a), var(--b));
      -webkit-background-clip: text;
      color: transparent;
    }
    .group { margin: 16px 0; }
    label { display: block; margin-bottom: 7px; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px;
      background: #ffffff0d;
      color: var(--text);
      font-size: 1rem;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--a), var(--b));
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .error { color: #FCA5A5; margin: 12px 0; min-height: 1.2em; }
  </style>
</head>
<body>
  <main>
    <h1>כניסת מנהל</h1>
    <p style="color:var(--muted);text-align:center">התחבר לחשבון המנהל</p>
    <div id="error" class="error" role="alert"></div>
    <form id="form">
      <div class="group">
        <label for="identifier">שם משתמש</label>
        <input id="identifier" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="group">
        <label for="password">סיסמה</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn" id="submit" type="submit">כניסה</button>
    </form>
  </main>

  <script>
    document.getElementById('form').onsubmit = async (event) => {
      event.preventDefault();
      const button = document.getElementById('submit');
      const message = document.getElementById('error');
      const originalText = button.textContent;

      button.disabled = true;
      button.textContent = 'מתחבר...';
      message.textContent = '';

      try {
        const response = await fetch('/api/v1/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            identifier: document.getElementById('identifier').value.trim(),
            password: document.getElementById('password').value
          })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.detail || 'הכניסה נכשלה');
        }

        localStorage.removeItem('admin_token');
        localStorage.removeItem('admin_email');
        sessionStorage.setItem('admin_token', data.access_token);
        sessionStorage.setItem('admin_email', data.email || '');
        location.href = '/admin-dashboard.html';
      } catch (error) {
        message.textContent = error.message;
        button.disabled = false;
        button.textContent = originalText;
      }
    };
  </script>
</body>
</html>

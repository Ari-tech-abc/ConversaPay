<!doctype html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>התחברות לממשק ניהול | ConversaPay</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/frontend/html/conversapay-ui.css"></head><body class="cp-page"><header class="cp-topbar"><a class="cp-brand" href="/"><span class="cp-brand-mark">CP</span><span>ConversaPay</span></a><a class="cp-backlink" href="/">חזרה לדף הבית</a></header><main class="cp-shell cp-auth-shell"><section class="cp-card"><div class="cp-stack cp-mb-lg"><span class="cp-kicker">גישה ניהולית</span><h1>כניסה למערכת הניהול</h1><p class="cp-muted">הזינו את פרטי המנהל כדי להיכנס.</p></div><div id="error" class="cp-notice error" role="alert" aria-live="polite" hidden></div><form id="form" class="cp-stack"><div class="cp-field"><label class="cp-label" for="identifier">שם משתמש או אימייל</label><input class="cp-input" id="identifier" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></div><div class="cp-field"><label class="cp-label" for="password">סיסמה</label><input class="cp-input" id="password" type="password" autocomplete="current-password" required></div><button class="cp-button" id="submit" type="submit">כניסה</button></form><div class="cp-links cp-mt-lg"><a class="cp-link" href="/">חזרה לאתר הראשי</a></div></section></main><script>const pathSegments=window.location.pathname.split('/').filter(Boolean),adminRoutePrefix=pathSegments[0];function adminBase(){return adminRoutePrefix&&(adminRoutePrefix==='admin'||adminRoutePrefix.startsWith('admin-'))?`/${adminRoutePrefix}`:'/admin'}const ADMIN_DASHBOARD_ROUTE=adminBase();const adminLoginEndpoint=adminRoutePrefix&&adminRoutePrefix.startsWith('admin-')?`/api/v1/${encodeURIComponent(adminRoutePrefix)}/login`:'/api/v1/admin/login';document.getElementById('form').onsubmit=async event=>{event.preventDefault();const button=document.getElementById('submit'),message=document.getElementById('error'),originalText=button.textContent;button.disabled=true;button.textContent='מתחבר...';message.hidden=true;message.textContent='';try{const response=await fetch(adminLoginEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:document.getElementById('identifier').value.trim(),password:document.getElementById('password').value})}),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||'הכניסה נכשלה');localStorage.removeItem('admin_token');localStorage.removeItem('admin_email');sessionStorage.setItem('admin_token',data.access_token);sessionStorage.setItem('admin_email',data.email||'');window.location.assign(ADMIN_DASHBOARD_ROUTE)}catch(error){message.hidden=false;message.textContent=error.message;button.disabled=false;button.textContent=originalText}};</script></body></html>

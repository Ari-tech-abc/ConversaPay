<!doctype html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ConversaPay - דאשבורד מנהל</title><style>:root{--bg:#0f1419;--card:#1a1f2e;--muted:#a0aec0;--text:#f5f7fa;--a:#6366f1;--danger:#7f1d1d;--line:#ffffff18}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,var(--bg),#1a1f2e,var(--bg));color:var(--text);font:16px system-ui}.app{max-width:1400px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.top h1{margin:0}.top a{color:#c4b5fd}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.toolbar input{flex:1;min-width:220px;padding:11px;border:1px solid var(--line);border-radius:8px;background:#ffffff0d;color:var(--text)}button{border:0;border-radius:8px;padding:10px 14px;background:var(--a);color:#fff;font-weight:700;cursor:pointer}.secondary{background:#334155}.danger{background:var(--danger)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat,.card{background:#ffffff0b;border:1px solid var(--line);border-radius:16px}.stat{padding:18px}.stat b{display:block;font-size:1.8rem;margin-top:7px}.muted{color:var(--muted)}.card{overflow:hidden;margin:18px 0}.card h2{font-size:1.1rem;margin:0;padding:18px;border-bottom:1px solid var(--line)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:13px 14px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-size:.85rem}.actions{display:flex;gap:6px}#msg{min-height:1.3em;color:#86efac}.empty{text-align:center;padding:28px;color:var(--muted)}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.app{padding:14px}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="app"><header class="top"><div><h1>דאשבורד מנהל</h1><p class="muted">ניהול דומיינים, דוחות ופעולות אבטחה</p></div><div><a href="/admin/change-password">שינוי סיסמה</a> · <a href="#" onclick="logout();return false">התנתקות</a></div></header><div class="toolbar"><input id="search" type="search" placeholder="חפש דומיין, עסק או סטטוס" oninput="filterRows()"><button class="secondary" onclick="loadAll()">רענון</button><span id="msg"></span></div><section class="stats"><div class="stat"><span class="muted">עסקים</span><b id="businesses">-</b></div><div class="stat"><span class="muted">דומיינים מסומנים</span><b id="flagged">-</b></div><div class="stat"><span class="muted">דוחות פתוחים</span><b id="reports">-</b></div><div class="stat"><span class="muted">קריאות API היום</span><b id="calls">-</b></div></section><section class="card"><h2>ניהול דומיינים</h2><div class="table-wrap"><table><thead><tr><th>דומיין</th><th>עסק</th><th>סטטוס</th><th>מקסימום</th><th>פעולות</th></tr></thead><tbody id="domains"><tr><td colspan="5" class="empty">טוען...</td></tr></tbody></table></div></section><section class="card"><h2>דוחות ניצול</h2><div class="table-wrap"><table><thead><tr><th>דוח</th><th>עסק</th><th>סוג</th><th>סטטוס</th><th>תאריך</th></tr></thead><tbody id="abuse"><tr><td colspan="5" class="empty">טוען...</td></tr></tbody></table></div></section></main><script>const token=localStorage.getItem('admin_token');if(!token)location.href='/admin-login.html';const headers={Authorization:'Bearer '+token,'Content-Type':'application/json'},$=id=>document.getElementById(id);function logout(){localStorage.removeItem('admin_token');localStorage.removeItem('admin_email');location.href='/admin-login.html'}async function api(path,opt={}){const r=await fetch('/api/v1/admin'+path,{...opt,headers:{...headers,...(opt.headers||{})}});if(r.status===401||r.status===403){logout();throw Error('unauthorized')}return r}function filterRows(){const q=$('search').value.toLowerCase();document.querySelectorAll('tbody tr').forEach(r=>r.style.display=!q||r.textContent.toLowerCase().includes(q)?'':'none')}async function loadAll(){try{const [s,d,a]=await Promise.all([api('/dashboard'),api('/domain-restrictions'),api('/abuse-reports')]);const stats=await s.json(),domains=await d.json(),reports=await a.json();$('businesses').textContent=stats.total_businesses??0;$('flagged').textContent=stats.flagged_domains??0;$('reports').textContent=stats.open_abuse_reports??0;$('calls').textContent=stats.today_api_calls??0;$('domains').innerHTML=domains.length?domains.map(x=>`<tr><td>${x.domain}</td><td>${x.business_id}</td><td>${x.status}</td><td>${x.max_domains_allowed}</td><td class="actions"><button onclick="toggleDomain('${x.id}','${x.status}')">${x.status==='blocked'?'הפעל':'השבת'}</button><button class="danger" onclick="deleteDomain('${x.id}')">מחק</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">אין דומיינים</td></tr>';$('abuse').innerHTML=reports.length?reports.map(x=>`<tr><td>#${x.id.slice(0,8)}</td><td>${x.business_id||'-'}</td><td>${x.report_type}</td><td>${x.status}</td><td>${x.created_at?new Date(x.created_at).toLocaleDateString('he-IL'):'-'}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">אין דוחות</td></tr>';filterRows()}catch(e){$('msg').textContent='טעינת הנתונים נכשלה'}}async function toggleDomain(id,status){const next=status==='blocked'?'active':'blocked';const r=await api('/domain-restrictions/'+id,{method:'PUT',body:JSON.stringify({status:next})});if(r.ok){$('msg').textContent='הדומיין עודכן';loadAll()}}async function deleteDomain(id){if(!confirm('למחוק את הדומיין לצמיתות?'))return;const r=await api('/domain-restrictions/'+id,{method:'DELETE'});if(r.ok){$('msg').textContent='הדומיין נמחק';loadAll()}}loadAll();</script></body></html>

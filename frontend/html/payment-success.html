<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8fafc">
  <meta name="robots" content="noindex,nofollow">
  <title>ConversaPay | התשלום הצליח</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/html/conversapay-ui.css">
  <style>
    .result-shell{min-height:calc(100dvh - 92px);display:grid;place-items:center;padding:1.5rem 0 2.5rem}
    .result-card{width:min(620px,100%);text-align:center;display:grid;gap:1.25rem;justify-items:center;min-width:0}
    .result-icon{width:82px;height:82px;border-radius:1.5rem;display:grid;place-items:center;background:#ecfdf5;border:1px solid #a7f3d0;color:#059669;font-size:2.5rem;box-shadow:0 8px 32px rgba(5,150,105,.12)}
    .result-copy{max-width:46ch;width:100%;min-width:0}
    .result-copy h1{font-size:clamp(1.9rem,5vw,3.1rem);margin:10px 0;line-height:1.1;color:var(--cp-text)}
    .result-copy p{overflow-wrap:anywhere}
    .result-actions{width:min(440px,100%);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .result-actions>*{min-width:0}
    .sandbox-note{max-width:100%;padding:10px 14px;border-radius:999px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;font-size:.84rem;font-weight:700;overflow-wrap:anywhere}
    .result-meta{width:100%;display:grid;gap:10px;text-align:right}
    @media(max-width:560px){.result-shell{min-height:auto;padding:1.1rem 0 1.75rem}.result-card{gap:1rem}.result-icon{width:68px;height:68px;border-radius:1.25rem;font-size:2rem}.result-actions{grid-template-columns:1fr}.result-actions>*{width:100%}}
  </style>
</head>
<body class="cp-page">
  <header class="cp-topbar"><a class="cp-brand" href="/"><span class="cp-brand-mark">CP</span><span>ConversaPay</span></a><span class="cp-badge">Sandbox</span></header>
  <main class="cp-shell result-shell">
    <section class="cp-card result-card" aria-live="polite">
      <div class="result-icon" aria-hidden="true">✓</div>
      <div class="result-copy"><span class="cp-kicker cp-kicker-center">תשלום התקבל</span><h1>התשלום הצליח</h1><p class="cp-muted">תודה! קיבלנו את התשלום בהצלחה. במצב Sandbox זו בדיקת מערכת בלבד, ללא חיוב אמיתי.</p></div>
      <span class="sandbox-note">מצב בדיקות בלבד</span>
      <div class="result-meta cp-list"><div class="cp-list-item"><div class="cp-list-meta"><strong>סטטוס</strong><small>האירוע יושלם לאחר אימות ה‑Webhook</small></div><span class="cp-badge good">התקבל</span></div><div class="cp-list-item" id="reference" hidden><div class="cp-list-meta"><strong>מזהה בדיקה</strong><small id="referenceValue"></small></div></div></div>
      <div class="cp-actions result-actions"><a class="cp-button" href="/dashboard">חזרה לדאשבורד</a><a class="cp-button-secondary" href="/">חזרה לדף הבית</a></div>
    </section>
  </main>
  <script>
    const params=new URLSearchParams(location.search);const ref=params.get('session_id')||params.get('payment_intent');if(ref){document.getElementById('reference').hidden=false;document.getElementById('referenceValue').textContent=ref}
  </script>
</body>
</html>

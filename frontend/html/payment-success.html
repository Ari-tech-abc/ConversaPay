<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>ConversaPay | התשלום הצליח</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/html/conversapay-ui.css">
</head>
<body class="cp-page">
  <header class="cp-topbar"><a class="cp-brand" href="/"><span class="cp-brand-mark">CP</span><span>ConversaPay</span></a><span class="cp-badge">Sandbox</span></header>
  <main class="cp-shell cp-result-shell">
    <section class="cp-card cp-result-card" aria-live="polite">
      <div class="cp-result-icon good" aria-hidden="true">✓</div>
      <div class="cp-result-copy"><span class="cp-kicker cp-center-inline">תשלום התקבל</span><h1>התשלום הצליח</h1><p class="cp-muted">תודה! קיבלנו את התשלום בהצלחה. במצב Sandbox זו בדיקת מערכת בלבד, ללא חיוב אמיתי.</p></div>
      <span class="cp-pill-note">מצב בדיקות בלבד</span>
      <div class="cp-result-meta cp-list">
        <div class="cp-list-item"><div class="cp-list-meta"><strong>סטטוס</strong><small>האירוע יושלם לאחר אימות ה‑Webhook</small></div><span class="cp-badge good">התקבל</span></div>
        <div class="cp-list-item" id="reference" hidden><div class="cp-list-meta"><strong>מזהה בדיקה</strong><small id="referenceValue" class="cp-break-all"></small></div></div>
      </div>
      <div class="cp-actions cp-result-actions"><a class="cp-button" href="/dashboard">חזרה לדאשבורד</a><a class="cp-button-secondary" href="/">חזרה לדף הבית</a></div>
    </section>
  </main>
  <script>
    const params=new URLSearchParams(location.search);const ref=params.get('session_id')||params.get('payment_intent');if(ref){document.getElementById('reference').hidden=false;document.getElementById('referenceValue').textContent=ref}
  </script>
</body>
</html>

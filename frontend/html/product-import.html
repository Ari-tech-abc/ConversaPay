<!doctype html>
<html lang="he" dir="rtl">
<head><script src="/frontend/js/product-import.js"></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TALK2PAY | ייבוא מוצרים</title>
<link rel="stylesheet" href="/frontend/html/conversapay-ui.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>.import-shell{max-width:900px;margin:auto}.drop{border:2px dashed #d8d3f5;border-radius:16px;padding:34px;text-align:center;background:#fbfaff;cursor:pointer}.drop:hover{border-color:#6850e8}.preview{overflow:auto;margin-top:18px}.preview table{width:100%;border-collapse:collapse;font-size:12px}.preview th,.preview td{padding:9px;border-bottom:1px solid #e5e7ee;text-align:right;white-space:nowrap}.muted{color:#70758a;font-size:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}.mapping{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.mapping label{display:grid;gap:5px;font-size:12px;font-weight:700}.mapping select{padding:10px;border:1px solid #e5e7ee;border-radius:8px;background:#fff}@media(max-width:600px){.mapping{grid-template-columns:1fr}}</style>
  <link rel="stylesheet" href="/frontend/css/language-switcher.css">
<link rel="stylesheet" href="/frontend/css/talk2pay-theme.css"><script src="/frontend/js/workspace-ui.js" defer></script></head>
<body data-t2p-page="product-import" class="cp-page"><header class="cp-topbar"><a class="cp-brand" href="/dashboard"><span class="cp-brand-mark">T2P</span><span>TALK2PAY</span></a><a class="cp-backlink" href="/settings">חזרה להגדרות</a></header>
<main class="cp-shell import-shell"><section class="cp-card"><h1>ייבוא מוצרים</h1><p class="muted">מוסיפים מוצרים לקטלוג מקובץ Excel, CSV או טבלה מופרדת בטאבים. לפני הייבוא אפשר לבדוק את הנתונים ולהתאים את העמודות.</p><input id="file" type="file" accept=".xlsx,.xls,.csv,.tsv,.txt" hidden><button type="button" class="drop" id="drop" style="width:100%;font:inherit">בחירת קובץ או גרירה לכאן<br><span class="muted">עמודות מומלצות: name, item_key, price, description, payment_link, is_active</span></button><div id="mapping" class="mapping" hidden></div><div id="preview" class="preview"></div><div class="row"><button class="cp-button" id="import" disabled>ייבוא מוצרים</button><a class="cp-button-secondary" href="/settings">ביטול</a></div><p id="notice" class="muted" aria-live="polite"></p></section></main>
<script>
const API='/api/v1';const token=localStorage.getItem('access_token')||localStorage.getItem('conversapay_auth_token')||sessionStorage.getItem('access_token')||sessionStorage.getItem('conversapay_auth_token');const auth={Authorization:'Bearer '+token};const $=id=>document.getElementById(id);let rows=[],headers=[],business=null;
if(!token)location.href='/login';
async function get(path){const r=await fetch(API+path,{headers:auth});if(!r.ok)throw Error('לא ניתן לטעון את הנתונים');return r.json()}
async function init(){try{const bs=await get('/businesses');business=Array.isArray(bs)?bs[0]:null;if(!business)throw Error('לא נמצא עסק');$('import').disabled=!rows.length;}catch(e){$('notice').textContent=e.message}}
function normalize(v){return String(v??'').trim()}
function makeMapping(){
  const names=['name','item_key','price','description','payment_link','is_active'];
  const aliases={name:['name','product_name','שם','שם המוצר'],item_key:['item_key','sku','code','מזהה מוצר','מק״ט','מק"ט','מקט'],price:['price','amount','מחיר'],description:['description','תיאור'],payment_link:['payment_link','payment','קישור תשלום'],is_active:['is_active','active','פעיל']};
  const root=$('mapping');root.hidden=false;root.replaceChildren();
  names.forEach(n=>{
    const label=document.createElement('label');const labels={name:['שם מוצר','Product name'],item_key:['מק״ט / מזהה מוצר','SKU / product ID'],price:['מחיר','Price'],description:['תיאור','Description'],payment_link:['קישור תשלום','Payment link'],is_active:['פעיל','Active']};label.textContent=window.Talk2PayUX?.t(...labels[n])||labels[n][0];
    const select=document.createElement('select');select.dataset.field=n;
    const empty=document.createElement('option');empty.value='';empty.textContent='ללא שיוך';select.appendChild(empty);
    headers.forEach(h=>{const option=document.createElement('option');option.value=h;option.textContent=h;select.appendChild(option)});
    const hit=headers.find(h=>aliases[n].includes(normalize(h).toLowerCase()));if(hit)select.value=hit;
    label.appendChild(select);root.appendChild(label);
  });
}
function render(){
  const root=$('preview');root.replaceChildren();if(!rows.length)return;
  const table=document.createElement('table'),head=document.createElement('thead'),headRow=document.createElement('tr'),body=document.createElement('tbody');
  headers.forEach(h=>{const th=document.createElement('th');th.textContent=h;headRow.appendChild(th)});head.appendChild(headRow);table.appendChild(head);
  rows.slice(0,8).forEach(row=>{const tr=document.createElement('tr');headers.forEach(h=>{const td=document.createElement('td');td.textContent=normalize(row[h]);tr.appendChild(td)});body.appendChild(tr)});table.appendChild(body);
  const summary=document.createElement('p');summary.className='muted';summary.textContent=window.Talk2PayUX?.t('מוצגות עד 8 שורות. סך הכול: '+rows.length+' מוצרים.','Previewing up to 8 rows. Total: '+rows.length+' products.')||'סך הכול: '+rows.length;
  root.append(table,summary);$('import').disabled=!business;makeMapping();
}
$('drop').onclick=()=>$('file').click();$('file').onchange=e=>readFile(e.target.files[0]);$('drop').ondragover=e=>{e.preventDefault()};$('drop').ondrop=e=>{e.preventDefault();readFile(e.dataTransfer.files[0])};
function readFile(file){if(!file)return;const reader=new FileReader();reader.onload=e=>{try{let wb;if(/\.xlsx?$/.test(file.name.toLowerCase())){wb=XLSX.read(e.target.result,{type:'array'});}else{let text=new TextDecoder('utf-8').decode(e.target.result);if(text.includes('\uFFFD'))text=new TextDecoder('windows-1255').decode(e.target.result);const delimiter=(text.split(/\r?\n/)[0].match(/[;,\t]/)||[','])[0];wb=XLSX.read(text,{type:'string',FS:delimiter});}const sheet=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(sheet,{defval:''});headers=[...new Set(rows.flatMap(r=>Object.keys(r)))];render();$('notice').textContent='הקובץ נטען. אפשר לבדוק את העמודות לפני הייבוא.';}catch(err){$('notice').textContent='לא ניתן לקרוא את הקובץ: '+err.message}};reader.readAsArrayBuffer(file)}
$('import').onclick=async()=>{if(!business)return;const b=$('import');b.disabled=true;const map={};document.querySelectorAll('[data-field]').forEach(s=>map[s.dataset.field]=s.value);try{const parsed=window.Talk2PayImport.parse(rows,business.id,map);if(parsed.errors.length&&!confirm(window.Talk2PayUX?.t('יש '+parsed.errors.length+' שורות לא תקינות. לייבא את השורות התקינות בלבד?',parsed.errors.length+' invalid rows. Import valid rows only?')||'לייבא את השורות התקינות בלבד?')){window.Talk2PayImport.report($('notice'),{created:0,errors:parsed.errors});return}await window.Talk2PayImport.run(parsed,async(path,opt)=>{const r=await fetch(API+path,{...opt,headers:{...auth,...opt.headers}});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:'לא ניתן לייבא כרגע. נסה שוב.');return data},$('notice'));}catch(e){$('notice').textContent=e.message}finally{b.disabled=!business||!rows.length}};init();
</script>  <script src="/frontend/js/language-switcher.js"></script>
</body></html>

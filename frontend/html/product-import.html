<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TALK2PAY | ייבוא מוצרים</title>
<link rel="stylesheet" href="/frontend/html/conversapay-ui.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>.import-shell{max-width:900px;margin:auto}.drop{border:2px dashed #d8d3f5;border-radius:16px;padding:34px;text-align:center;background:#fbfaff;cursor:pointer}.drop:hover{border-color:#6850e8}.preview{overflow:auto;margin-top:18px}.preview table{width:100%;border-collapse:collapse;font-size:12px}.preview th,.preview td{padding:9px;border-bottom:1px solid #e5e7ee;text-align:right;white-space:nowrap}.muted{color:#70758a;font-size:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}.mapping{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.mapping label{display:grid;gap:5px;font-size:12px;font-weight:700}.mapping select{padding:10px;border:1px solid #e5e7ee;border-radius:8px;background:#fff}@media(max-width:600px){.mapping{grid-template-columns:1fr}}</style>
</head>
<body class="cp-page"><header class="cp-topbar"><a class="cp-brand" href="/dashboard"><span class="cp-brand-mark">T2P</span><span>TALK2PAY</span></a><a class="cp-backlink" href="/settings">חזרה להגדרות</a></header>
<main class="cp-shell import-shell"><section class="cp-card"><h1>ייבוא מוצרים</h1><p class="muted">העלה קובץ Excel, CSV או טבלה מופרדת בטאבים. ניתן לייבא מוצרים רבים בפעולה אחת.</p><input id="file" type="file" accept=".xlsx,.xls,.csv,.tsv,.txt" hidden><div class="drop" id="drop">לחץ לבחירת קובץ או גרור אותו לכאן<br><span class="muted">עמודות מומלצות: name, item_key, price, description, payment_link, is_active</span></div><div id="mapping" class="mapping" hidden></div><div id="preview" class="preview"></div><div class="row"><button class="cp-button" id="import" disabled>ייבוא מוצרים</button><a class="cp-button-secondary" href="/settings">ביטול</a></div><p id="notice" class="muted" aria-live="polite"></p></section></main>
<script>
const API='/api/v1';const token=localStorage.getItem('access_token')||localStorage.getItem('conversapay_auth_token')||sessionStorage.getItem('access_token')||sessionStorage.getItem('conversapay_auth_token');const auth={Authorization:'Bearer '+token};const $=id=>document.getElementById(id);let rows=[],headers=[],business=null;
if(!token)location.href='/login';
async function get(path){const r=await fetch(API+path,{headers:auth});if(!r.ok)throw Error('לא ניתן לטעון את הנתונים');return r.json()}
async function init(){try{const bs=await get('/businesses');business=Array.isArray(bs)?bs[0]:null;if(!business)throw Error('לא נמצא עסק');}catch(e){$('notice').textContent=e.message}}
function normalize(v){return String(v??'').trim()}
function makeMapping(){const names=['name','item_key','price','description','payment_link','is_active'];$('mapping').hidden=false;$('mapping').innerHTML=names.map(n=>`<label>${n}<select data-field="${n}"><option value="">— לא למפות —</option>${headers.map(h=>`<option value="${h}">${h}</option>`).join('')}</select></label>`).join('');const aliases={name:['name','product_name','שם','שם המוצר'],item_key:['item_key','sku','code','מזהה מוצר'],price:['price','amount','מחיר'],description:['description','תיאור'],payment_link:['payment_link','payment','קישור תשלום'],is_active:['is_active','active','פעיל']};names.forEach(n=>{const hit=headers.find(h=>aliases[n].includes(normalize(h).toLowerCase()));if(hit)$(`mapping`).querySelector(`[data-field="${n}"]`).value=hit})}
function render(){if(!rows.length)return;$('preview').innerHTML='<table><thead><tr>'+headers.map(h=>`<th>${h}</th>`).join('')+'</tr></thead><tbody>'+rows.slice(0,8).map(r=>'<tr>'+headers.map(h=>`<td>${normalize(r[h])}</td>`).join('')+'</tr>').join('')+'</tbody></table><p class="muted">מוצגים עד 8 שורות לתצוגה מקדימה. סך הכול: '+rows.length+' מוצרים.</p>';$('import').disabled=false;makeMapping()}
$('drop').onclick=()=>$('file').click();$('file').onchange=e=>readFile(e.target.files[0]);$('drop').ondragover=e=>{e.preventDefault()};$('drop').ondrop=e=>{e.preventDefault();readFile(e.dataTransfer.files[0])};
function readFile(file){if(!file)return;const reader=new FileReader();reader.onload=e=>{try{let wb;if(/\.xlsx?$/.test(file.name.toLowerCase())){wb=XLSX.read(e.target.result,{type:'array'});}else{const text=new TextDecoder('utf-8').decode(e.target.result);wb=XLSX.read(text,{type:'string',FS:text.includes('\t')?'\t':','});}const sheet=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(sheet,{defval:''});headers=[...new Set(rows.flatMap(r=>Object.keys(r)))];render();$('notice').textContent='הקובץ נטען בהצלחה';}catch(err){$('notice').textContent='לא ניתן לקרוא את הקובץ: '+err.message}};reader.readAsArrayBuffer(file)}
$('import').onclick=async()=>{const b=$('import');b.disabled=true;let ok=0,fail=0;const map={};document.querySelectorAll('[data-field]').forEach(s=>map[s.dataset.field]=s.value);try{for(const row of rows){const name=normalize(row[map.name]),item_key=normalize(row[map.item_key]),price=Number(row[map.price]);if(!name||!item_key||!Number.isFinite(price)){fail++;continue}const payload={business_id:business.id,name,item_key,price,currency:'ILS',description:normalize(row[map.description])||null,payment_link:normalize(row[map.payment_link])||null,is_active:!['false','0','no','לא'].includes(normalize(row[map.is_active]).toLowerCase())};const r=await fetch(API+'/products',{method:'POST',headers:{...auth,'Content-Type':'application/json'},body:JSON.stringify(payload)});if(r.ok)ok++;else fail++;$('notice').textContent=`יובאו ${ok} מוצרים, ${fail} נכשלו...`}$('notice').textContent=`הייבוא הסתיים: ${ok} מוצרים נוספו, ${fail} שורות דולגו או נכשלו.`;}catch(e){$('notice').textContent=e.message}finally{b.disabled=false}};init();
</script></body></html>

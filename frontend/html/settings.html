<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ConversaPay - הגדרות</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/html/conversapay-ui.css">
</head>
<body class="cp-page">
  <header class="cp-topbar">
    <a class="cp-brand" href="dashboard.html"><span class="cp-brand-mark">CP</span><span>ConversaPay</span></a>
    <a class="cp-backlink" href="dashboard.html">חזרה לדאשבורד</a>
  </header>

  <main class="cp-shell">
    <section class="cp-panel" style="max-width:760px;margin:auto;">
      <div class="cp-stack" style="margin-bottom:16px;">
        <h1>הגדרות</h1>
        <p class="cp-muted">הגדרות זמינות של החשבון והמערכת.</p>
      </div>
      <div id="rows" class="cp-list">טוען...</div>
      <div id="notice" class="cp-notice" hidden></div>
    </section>
  </main>

  <script>
    function getToken() {
      return (
        localStorage.getItem('access_token') ||
        localStorage.getItem('conversapay_auth_token') ||
        sessionStorage.getItem('access_token') ||
        sessionStorage.getItem('conversapay_auth_token')
      );
    }

    function clearUserSession() {
      localStorage.removeItem('access_token');
      localStorage.removeItem('conversapay_auth_token');
      localStorage.removeItem('conversapay_user');
      localStorage.removeItem('user_id');
      localStorage.removeItem('email');
      sessionStorage.removeItem('access_token');
      sessionStorage.removeItem('conversapay_auth_token');
      sessionStorage.removeItem('conversapay_user');
      sessionStorage.removeItem('user_id');
      sessionStorage.removeItem('email');
    }

    function appendRow(label, value, href) {
      const row = document.createElement('div');
      row.className = 'cp-list-item';

      const meta = document.createElement('div');
      meta.className = 'cp-list-meta';
      const strong = document.createElement('strong');
      strong.textContent = label;
      meta.appendChild(strong);
      row.appendChild(meta);

      if (href) {
        const link = document.createElement('a');
        link.className = 'cp-link';
        link.href = href;
        link.textContent = value;
        row.appendChild(link);
      } else {
        const badge = document.createElement('span');
        badge.className = 'cp-badge';
        badge.textContent = value;
        row.appendChild(badge);
      }

      document.getElementById('rows').appendChild(row);
    }

    (async () => {
      const token = getToken();
      if (!token) {
        location.href = 'login.html';
        return;
      }

      try {
        const response = await fetch('/api/v1/dashboard/settings', {
          headers: { Authorization: `Bearer ${token}` }
        });

        if (response.status === 401) {
          clearUserSession();
          location.href = 'login.html';
          return;
        }

        if (!response.ok) throw new Error();

        const data = await response.json();
        const rows = document.getElementById('rows');
        rows.textContent = '';

        appendRow('PayMe', data.payme_id ? 'מחובר' : 'לא מוגדר');
        appendRow('WhatsApp', data.whatsapp_phone ? 'מחובר' : 'לא מוגדר');
        appendRow('מגבלת דומיינים', String(Number(data.domain_limit || 0)));
        appendRow('מגבלת API keys', String(Number(data.api_key_limit || 0)));
        appendRow('פרופיל', 'ניהול פרופיל', 'profile.html');
      } catch (_) {
        document.getElementById('rows').textContent = 'שגיאה בטעינת ההגדרות';
      }
    })();
  </script>
</body>
</html>

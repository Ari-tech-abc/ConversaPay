<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ConversaPay - הגדרות</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a1f2ecc;
      --text: #f5f7fa;
      --muted: #a0aec0;
      --line: #ffffff16;
    }
    * { box-sizing: border-box; font-family: Rubik, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--bg), #1a1f2e);
      color: var(--text);
    }
    main { max-width: 760px; margin: auto; padding: 36px 18px; }
    .back { color: var(--muted); text-decoration: none; }
    .card {
      margin-top: 24px;
      padding: 26px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
    }
    .row:last-child { border-bottom: 0; }
    .muted { color: var(--muted); }
    .notice {
      padding: 12px;
      border-radius: 10px;
      background: #10b98122;
      color: #86efac;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="dashboard.html">← חזרה לדאשבורד</a>
    <section class="card">
      <h1>הגדרות</h1>
      <p class="muted">הגדרות זמינות של החשבון והמערכת</p>
      <div id="rows">טוען...</div>
      <div id="notice" class="notice" hidden></div>
    </section>
  </main>

  <script>
    function getToken() {
      return (
        localStorage.getItem('access_token') ||
        localStorage.getItem('conversapay_auth_token') ||
        sessionStorage.getItem('access_token') ||
        sessionStorage.getItem('conversapay_auth_token')
      );
    }

    function clearUserSession() {
      localStorage.removeItem('access_token');
      localStorage.removeItem('conversapay_auth_token');
      localStorage.removeItem('conversapay_user');
      localStorage.removeItem('user_id');
      localStorage.removeItem('email');
      sessionStorage.removeItem('access_token');
      sessionStorage.removeItem('conversapay_auth_token');
      sessionStorage.removeItem('conversapay_user');
      sessionStorage.removeItem('user_id');
      sessionStorage.removeItem('email');
    }

    function appendRow(label, value, href) {
      const row = document.createElement('div');
      row.className = 'row';

      const labelEl = document.createElement('span');
      labelEl.textContent = label;
      row.appendChild(labelEl);

      if (href) {
        const link = document.createElement('a');
        link.className = 'back';
        link.href = href;
        link.textContent = value;
        row.appendChild(link);
      } else {
        const strong = document.createElement('strong');
        strong.textContent = value;
        row.appendChild(strong);
      }

      document.getElementById('rows').appendChild(row);
    }

    (async () => {
      const token = getToken();
      if (!token) {
        location.href = 'login.html';
        return;
      }

      try {
        const response = await fetch('/api/v1/dashboard/settings', {
          headers: { Authorization: `Bearer ${token}` }
        });

        if (response.status === 401) {
          clearUserSession();
          location.href = 'login.html';
          return;
        }

        if (!response.ok) throw new Error();

        const data = await response.json();
        const rows = document.getElementById('rows');
        rows.textContent = '';

        appendRow('PayMe', data.payme_id ? 'מחובר' : 'לא מוגדר');
        appendRow('WhatsApp', data.whatsapp_phone ? 'מחובר' : 'לא מוגדר');
        appendRow('מגבלת דומיינים', String(Number(data.domain_limit || 0)));
        appendRow('מגבלת API keys', String(Number(data.api_key_limit || 0)));
        appendRow('פרופיל', 'ניהול פרופיל', 'profile.html');
      } catch (_) {
        document.getElementById('rows').textContent = 'שגיאה בטעינת ההגדרות';
      }
    })();
  </script>
</body>
</html>

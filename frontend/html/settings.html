<!doctype html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ConversaPay - הגדרות</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#0f1419;--card:#1a1f2ecc;--text:#f5f7fa;--muted:#a0aec0;--a:#6366f1;--b:#8b5cf6;--line:#ffffff16}*{box-sizing:border-box;font-family:Rubik,sans-serif}body{margin:0;min-height:100vh;background:linear-gradient(135deg,var(--bg),#1a1f2e);color:var(--text)}main{max-width:760px;margin:auto;padding:36px 18px}.back{color:var(--muted);text-decoration:none}.card{margin-top:24px;padding:26px;background:var(--card);border:1px solid var(--line);border-radius:20px}.row{display:flex;justify-content:space-between;gap:20px;padding:16px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.muted{color:var(--muted)}.notice{padding:12px;border-radius:10px;background:#10b98122;color:#86efac;margin-top:20px}</style></head><body><main><a class="back" href="dashboard.html">← חזרה לדאשבורד</a><section class="card"><h1>הגדרות</h1><p class="muted">הגדרות זמינות של החשבון והמערכת</p><div id="rows">טוען...</div><div id="notice" class="notice" hidden></div></section></main><script>
const token=localStorage.getItem('access_token');if(!token)location.href='login.html';(async()=>{try{const r=await fetch('/api/v1/dashboard/settings',{headers:{Authorization:`Bearer ${token}`}});if(!r.ok)throw new Error();const d=await r.json();document.getElementById('rows').innerHTML=`<div class="row"><span>PayMe</span><strong>${d.payme_id?'מחובר':'לא מוגדר'}</strong></div><div class="row"><span>WhatsApp</span><strong>${d.whatsapp_phone?'מחובר':'לא מוגדר'}</strong></div><div class="row"><span>מגבלת דומיינים</span><strong>${Number(d.domain_limit||1)}</strong></div><div class="row"><span>פרופיל</span><a class="back" href="profile.html">ניהול פרופיל</a></div>`}catch(_){document.getElementById('rows').textContent='שגיאה בטעינת ההגדרות'}})();
</script></body></html>

<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ConversaPay - הגדרות</title><style>:root{--bg:#0F1419;--card:rgba(26,31,46,.75);--text:#F5F7FA;--muted:#A0AEC0;--a:#6366F1;--b:#8B5CF6;--border:rgba(255,255,255,.1)}*{box-sizing:border-box;font-family:system-ui,sans-serif}body{margin:0;background:linear-gradient(135deg,var(--bg),#1a1f2e,var(--bg));color:var(--text);min-height:100vh}.container{width:min(800px,calc(100% - 32px));margin:auto;padding:32px 0}.back{color:var(--muted);text-decoration:none}.header{text-align:center;margin:28px 0}.header h1{background:linear-gradient(135deg,var(--a),var(--b));-webkit-background-clip:text;color:transparent}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:26px;margin:16px 0}.row{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:16px 0;border-bottom:1px solid var(--border)}.row:last-child{border-bottom:0}.muted{color:var(--muted)}select{background:#1A1F2E;color:var(--text);border:1px solid var(--border);padding:10px;border-radius:8px}.btn{border:0;border-radius:10px;padding:12px 20px;font-weight:700;cursor:pointer}.primary{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}.danger{background:rgba(239,68,68,.15);color:#FCA5A5;border:1px solid rgba(239,68,68,.3)}.notice{padding:12px;border-radius:10px;margin-bottom:16px}.error{background:rgba(239,68,68,.15);color:#FCA5A5}.success{background:rgba(16,185,129,.15);color:#6EE7B7}@media(max-width:600px){.row{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="container"><a class="back" href="dashboard.html">← חזרה לדאשבורד</a><header class="header"><h1>הגדרות</h1><p class="muted">הגדרות זמינות של החשבון</p></header><div id="notice" hidden></div><section class="card"><h2>שפה ואזור</h2><div class="row"><div><strong>שפה</strong><p class="muted">העדפה מקומית בממשק</p></div><select id="language"><option value="he">עברית</option><option value="en">English</option></select></div></section><section class="card"><h2>חשבון</h2><div class="row"><div><strong>מחיקת חשבון</strong><p class="muted">מחיקת חשבון אינה זמינה דרך הממשק הזה עדיין.</p></div><button class="btn danger" type="button" disabled>לא זמין</button></div></section><section class="card"><button class="btn primary" id="save" type="button">שמור העדפה</button></section></main><script>
const token=()=>localStorage.getItem('access_token')||sessionStorage.getItem('access_token');if(!token())location.href='login.html';const note=document.getElementById('notice');function show(text,kind){note.hidden=false;note.className=`notice ${kind}`;note.textContent=text;}async function load(){const r=await fetch('/api/v1/dashboard/settings',{headers:{Authorization:`Bearer ${token()}`}});if(r.status===401){location.href='login.html';return;}if(r.ok){const d=await r.json();document.getElementById('language').value=d.language||'he';}}async function save(){try{localStorage.setItem('conversapay_language',document.getElementById('language').value);show('העדפת השפה נשמרה בדפדפן','success');}catch(e){show('לא ניתן לשמור את ההעדפה','error');}}document.getElementById('save').onclick=save;load();
</script></body></html>

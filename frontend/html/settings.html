<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title id="pageTitle">TALK2PAY | הגדרות העסק</title>
<link rel="stylesheet" href="/frontend/html/conversapay-ui.css">
</head>
<body class="cp-page">
<header class="cp-topbar">
<a class="cp-brand" href="/dashboard"><span class="cp-brand-mark">T2P</span><span>TALK2PAY</span></a>
<a class="cp-backlink" href="/dashboard" data-i18n="back">חזרה לדאשבורד</a>
</header>
<main class="cp-shell cp-stack" style="max-width:860px;margin-inline:auto;">
<section class="cp-card cp-stack">
<h1 data-i18n="settings">הגדרות</h1>
<p class="cp-muted" data-i18n="desc">ניהול העסק, שפת הממשק והמסלול שלך.</p>
</section>
<section class="cp-card cp-stack">
<div><h2 data-i18n="language">שפת הממשק</h2><p class="cp-muted" data-i18n="languageDesc">בחר את השפה שבה יוצג הממשק.</p></div>
<div class="cp-field" style="max-width:360px"><label class="cp-label" for="language" data-i18n="languageLabel">שפה</label><select class="cp-input" id="language"><option value="he">עברית</option><option value="en">English</option></select></div>
<div id="languageNotice" class="cp-notice" hidden></div>
</section>
<section class="cp-card cp-stack">
<div><h2 data-i18n="business">פרטי העסק</h2><p class="cp-muted" data-i18n="businessDesc">השם יוצג ללקוחות בדיוק כפי שהזנת אותו.</p></div>
<form id="businessForm" class="cp-stack"><div class="cp-field"><label class="cp-label" for="businessName" data-i18n="businessName">שם העסק</label><input class="cp-input" id="businessName" maxlength="255" required></div>
<div class="cp-actions"><button class="cp-button" type="submit" id="saveBusiness" data-i18n="saveBusiness">שמירת פרטי העסק</button></div></form>
</section>
<section class="cp-card cp-stack">
<div><h2 data-i18n="plan">המסלול שלך</h2><p class="cp-muted" data-i18n="planDesc">היכולות הזמינות במערכת תלויות במסלול הפעיל.</p></div>
<div class="cp-grid-2"><article class="cp-panel"><small class="cp-muted" data-i18n="planLabel">מסלול</small><strong id="planStatus">—</strong></article><article class="cp-panel"><small class="cp-muted" data-i18n="status">סטטוס</small><strong id="subscriptionStatus">—</strong></article></div>
<div class="cp-actions"><a class="cp-button" href="/upgrade" data-i18n="manage">ניהול מסלול</a></div>
</section>
<section class="cp-card cp-stack">
<h2 data-i18n="links">קישורים</h2>
<div class="cp-actions"><a class="cp-button-secondary" href="/dashboard" data-i18n="dashboard">חזרה לדאשבורד</a><a class="cp-button-secondary" href="/setup-guide" data-i18n="guide">מדריך הטמעה</a></div>
</section>
</main>
<script>
const I18N={
he:{title:'TALK2PAY | הגדרות העסק',back:'חזרה לדאשבורד',settings:'הגדרות',desc:'ניהול העסק, שפת הממשק והמסלול שלך.',language:'שפת הממשק',languageDesc:'בחר את השפה שבה יוצג הממשק.',languageLabel:'שפה',business:'פרטי העסק',businessDesc:'השם יוצג ללקוחות בדיוק כפי שהזנת אותו.',businessName:'שם העסק',saveBusiness:'שמירת פרטי העסק',plan:'המסלול שלך',planDesc:'היכולות הזמינות במערכת תלויות במסלול הפעיל.',planLabel:'מסלול',status:'סטטוס',manage:'ניהול מסלול',links:'קישורים',dashboard:'חזרה לדאשבורד',guide:'מדריך הטמעה',saved:'פרטי העסק נשמרו בהצלחה',saveError:'שמירת פרטי העסק נכשלה',saving:'שומר...'},
en:{title:'TALK2PAY | Business settings',back:'Back to dashboard',settings:'Settings',desc:'Manage your business, interface language and plan.',language:'Interface language',languageDesc:'Choose the language used across the interface.',languageLabel:'Language',business:'Business details',businessDesc:'Your business name will be shown to customers exactly as entered.',businessName:'Business name',saveBusiness:'Save business details',plan:'Your plan',planDesc:'Available capabilities depend on your active plan.',planLabel:'Plan',status:'Status',manage:'Manage plan',links:'Links',dashboard:'Back to dashboard',guide:'Setup guide',saved:'Business details saved successfully',saveError:'Could not save business details',saving:'Saving...'}
};
const L=localStorage.getItem('talk2pay_language')||'he';
const T=I18N[L]||I18N.he;
document.documentElement.lang=L;document.documentElement.dir=L==='en'?'ltr':'rtl';document.title=T.title;
document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=T[e.dataset.i18n]);
const API='/api/v1';
const token=localStorage.getItem('access_token')||localStorage.getItem('conversapay_auth_token')||sessionStorage.getItem('access_token')||sessionStorage.getItem('conversapay_auth_token');
const auth=token?{Authorization:'Bearer '+token}:null;
const $=id=>document.getElementById(id);
if(!token)location.href='/login';
function clearSessionAndRedirect(){['access_token','conversapay_auth_token','conversapay_user','user_id','email'].forEach(k=>{localStorage.removeItem(k);sessionStorage.removeItem(k)});location.href='/login'}
function notice(message,error=false){const n=$('notice');if(!n)return;n.textContent=message;n.className=error?'cp-notice error':'cp-notice';n.hidden=false}
async function get(path){const r=await fetch(API+path,{headers:auth});if(r.status===401){clearSessionAndRedirect();return null}if(!r.ok)throw Error(L==='en'?'Could not load settings.':'לא ניתן לטעון את ההגדרות.');return r.json()}
async function load(){
try{
const [settings,me,businesses]=await Promise.all([get('/dashboard/settings'),get('/auth/me'),get('/businesses')]);
if(!settings)return;
const profile=me?.profile||{},business=Array.isArray(businesses)?businesses[0]:null;
$('businessName').value=business?.business_name||'';
const plan=String(settings.plan_type||profile.plan_type||'free').toUpperCase();
$('planStatus').textContent=plan;
$('subscriptionStatus').textContent=settings.subscription_active===false?(L==='en'?'Inactive':'לא פעיל'):(L==='en'?'Active':'פעיל');
}catch(e){notice(e.message,true)}
}
$('language').value=L;
$('language').onchange=()=>{localStorage.setItem('talk2pay_language',$('language').value);location.reload()};
$('businessForm').onsubmit=async e=>{
e.preventDefault();
const businesses=await get('/businesses');const b=Array.isArray(businesses)?businesses[0]:null;if(!b)return;
const btn=$('saveBusiness');btn.disabled=true;btn.textContent=T.saving;
try{
const r=await fetch(API+'/businesses/'+encodeURIComponent(b.id),{method:'PATCH',headers:{...auth,'Content-Type':'application/json'},body:JSON.stringify({business_name:$('businessName').value.trim()})});
const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||(L==='en'?'Could not save business details.':'שמירת פרטי העסק נכשלה'));
notice(T.saved);
}catch(e){notice(e.message,true)}
finally{btn.disabled=false;btn.textContent=T.saveBusiness}
};
load();
</script>
</body>
</html>

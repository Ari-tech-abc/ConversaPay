<!doctype html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ConversaPay - תשלום</title><style>:root{--bg:#0f1419;--card:#1a1f2ecc;--text:#f5f7fa;--muted:#a0aec0;--a:#818cf8;--b:#a78bfa;--line:#ffffff16}*{box-sizing:border-box;font-family:system-ui}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#2a2152,transparent 35%),linear-gradient(135deg,var(--bg),#1a1f2e);color:var(--text)}main{width:min(560px,calc(100% - 32px));padding:30px;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 48px #0007}h1{margin-top:0;color:#c4b5fd}.muted{color:var(--muted)}.summary{margin:22px 0;padding:18px;border:1px solid var(--line);border-radius:14px;background:#ffffff08}.item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0;font-weight:800;font-size:1.2rem}button,a.btn{display:block;width:100%;margin-top:18px;padding:14px;border:0;border-radius:11px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;text-align:center;text-decoration:none;font-weight:700;cursor:pointer}.notice{padding:13px;border-radius:10px;background:#10b98122;color:#86efac}.error{background:#ef444422;color:#fca5a5}</style></head><body><main><h1>💳 תשלום מאובטח</h1><p class="muted" id="meta">טוען פרטי הזמנה...</p><section class="summary" id="summary"></section><div id="notice" class="notice" hidden></div><button id="pay" hidden>המשך לתשלום</button><a class="btn" href="home.html">חזרה לעמוד הבית</a></main><script>
const API='/api/v1',params=new URLSearchParams(location.search),orderId=params.get('order_id')||params.get('order')||params.get('id'),plan=params.get('plan'),$=id=>document.getElementById(id),note=(t,e=false)=>{$('notice').textContent=t;$('notice').className=e?'notice error':'notice';$('notice').hidden=false};
async function init(){if(plan){$('meta').textContent=`שדרוג תכנית ${plan.toUpperCase()}`;$('summary').innerHTML=`<div class="item"><span>${plan.toUpperCase()}</span><strong>${plan==='premium'?'₪350':'₪200'}/חודש</strong></div>`;const token=localStorage.getItem('access_token');if(!token)return location.href=`login.html?next=${encodeURIComponent(location.pathname+'?plan='+plan)}`;$('pay').hidden=false;$('pay').onclick=async()=>{const m=await fetch(`${API}/auth/me`,{headers:{Authorization:`Bearer ${token}`}}),u=await m.json();const r=await fetch(`${API}/payments/create-checkout-session`,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({user_id:u.user_id,email:u.email,plan_type:plan})});const d=await r.json();if(!r.ok||!d.url)return note(d.detail||'שגיאה ביצירת תשלום',true);location.href=d.url};return}if(!orderId)return note('מספר הזמנה לא נמצא בכתובת',true);try{const r=await fetch(`${API}/orders/${encodeURIComponent(orderId)}/public`);const d=await r.json();if(!r.ok)throw new Error(d.detail);$('meta').textContent=`הזמנה ${d.order_number||orderId}`;$('summary').innerHTML=(d.items||[]).map(i=>`<div class="item"><span>${String(i.name||'מוצר').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]))} × ${Number(i.quantity||1)}</span><strong>₪${Number(i.price||0).toFixed(2)}</strong></div>`).join('')+`<div class="item"><span>סה״כ</span><strong>₪${Number(d.total||0).toFixed(2)}</strong></div>`;if(d.payment_link){$('pay').hidden=false;$('pay').textContent='עבור לתשלום';$('pay').onclick=()=>location.href=d.payment_link}else note('ההזמנה נטענה, אך עדיין לא הוגדר קישור תשלום למוצר.',true)}catch(e){note(e.message||'שגיאה בטעינת ההזמנה',true)}}init();
</script></body></html>

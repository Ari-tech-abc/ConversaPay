<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ConversaPay - תשלום</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a1f2ecc;
      --text: #f5f7fa;
      --muted: #a0aec0;
      --a: #818cf8;
      --b: #a78bfa;
      --line: #ffffff16;
    }
    * { box-sizing: border-box; font-family: system-ui; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 10%, #2a2152, transparent 35%), linear-gradient(135deg, var(--bg), #1a1f2e);
      color: var(--text);
    }
    main {
      width: min(560px, calc(100% - 32px));
      padding: 30px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 20px 48px #0007;
    }
    h1 { margin-top: 0; color: #c4b5fd; }
    .muted { color: var(--muted); }
    .summary {
      margin: 22px 0;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #ffffff08;
    }
    .item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      gap: 14px;
    }
    .item:last-child {
      border: 0;
      font-weight: 800;
      font-size: 1.2rem;
    }
    button, a.btn {
      display: block;
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--a), var(--b));
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .notice { padding: 13px; border-radius: 10px; background: #10b98122; color: #86efac; }
    .error { background: #ef444422; color: #fca5a5; }
  </style>
</head>
<body>
  <main>
    <h1>💳 תשלום מאובטח</h1>
    <p class="muted" id="meta">טוען פרטי הזמנה...</p>
    <section class="summary" id="summary"></section>
    <div id="notice" class="notice" hidden></div>
    <button id="pay" hidden type="button">המשך לתשלום</button>
    <a class="btn" href="home.html">חזרה לעמוד הבית</a>
  </main>

  <script>
    const API = '/api/v1';
    const params = new URLSearchParams(location.search);
    const orderId = params.get('order_id') || params.get('order') || params.get('id');
    const rawPlan = (params.get('plan') || '').toLowerCase();
    const allowedPlans = {
      pro: { label: 'PRO', price: '₪200/חודש' },
      premium: { label: 'PREMIUM', price: '₪350/חודש' }
    };
    const $ = (id) => document.getElementById(id);

    function note(message, isError = false) {
      $('notice').textContent = message;
      $('notice').className = isError ? 'notice error' : 'notice';
      $('notice').hidden = false;
    }

    function getToken() {
      return (
        localStorage.getItem('access_token') ||
        localStorage.getItem('conversapay_auth_token') ||
        sessionStorage.getItem('access_token') ||
        sessionStorage.getItem('conversapay_auth_token')
      );
    }

    function clearSummary() {
      $('summary').textContent = '';
    }

    function appendSummaryRow(label, value, isTotal = false) {
      const row = document.createElement('div');
      row.className = 'item';
      if (isTotal) row.style.fontWeight = '800';

      const labelEl = document.createElement('span');
      labelEl.textContent = label;
      const valueEl = document.createElement('strong');
      valueEl.textContent = value;

      row.appendChild(labelEl);
      row.appendChild(valueEl);
      $('summary').appendChild(row);
    }

    function isSafeRedirectUrl(value) {
      try {
        const url = new URL(value, location.origin);
        return url.origin === location.origin || url.protocol === 'https:';
      } catch (_) {
        return false;
      }
    }

    async function startPlanCheckout(plan) {
      const token = getToken();
      if (!token) {
        location.href = `login.html?next=${encodeURIComponent(location.pathname + location.search)}`;
        return;
      }

      const payBtn = $('pay');
      payBtn.disabled = true;
      const originalText = payBtn.textContent;
      payBtn.textContent = 'מעבד...';

      try {
        const meResponse = await fetch(`${API}/auth/me`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const user = await meResponse.json().catch(() => ({}));
        if (!meResponse.ok) throw new Error('לא ניתן לאמת את המשתמש');

        const response = await fetch(`${API}/payments/create-checkout-session`, {
          method: 'POST',
          headers: {
            Authorization: `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            user_id: user.user_id,
            email: user.email,
            plan_type: plan
          })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.url) {
          throw new Error(data.detail || 'שגיאה ביצירת תשלום');
        }
        if (!isSafeRedirectUrl(data.url)) {
          throw new Error('התקבל קישור תשלום לא תקין');
        }

        location.href = data.url;
      } catch (error) {
        note(error.message || 'שגיאה ביצירת תשלום', true);
        payBtn.disabled = false;
        payBtn.textContent = originalText;
      }
    }

    function renderPlan(plan) {
      const planConfig = allowedPlans[plan];
      if (!planConfig) {
        note('התוכנית שביקשת אינה נתמכת.', true);
        $('meta').textContent = 'לא ניתן להציג את פרטי התוכנית';
        return;
      }

      $('meta').textContent = `שדרוג תכנית ${planConfig.label}`;
      clearSummary();
      appendSummaryRow(planConfig.label, planConfig.price, true);

      const payBtn = $('pay');
      payBtn.hidden = false;
      payBtn.textContent = 'המשך לתשלום';
      payBtn.onclick = () => startPlanCheckout(plan);
    }

    async function renderOrder(orderIdValue) {
      if (!orderIdValue) {
        note('מספר הזמנה לא נמצא בכתובת', true);
        return;
      }

      try {
        const response = await fetch(`${API}/orders/${encodeURIComponent(orderIdValue)}/public`);
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.detail || 'שגיאה בטעינת ההזמנה');

        $('meta').textContent = `הזמנה ${data.order_number || orderIdValue}`;
        clearSummary();

        const items = Array.isArray(data.items) ? data.items : [];
        items.forEach((item) => {
          const quantity = Number(item.quantity || 1);
          const price = Number(item.price || 0).toFixed(2);
          appendSummaryRow(`${String(item.name || 'מוצר')} × ${quantity}`, `₪${price}`);
        });
        appendSummaryRow('סה״כ', `₪${Number(data.total || 0).toFixed(2)}`, true);

        if (data.payment_link) {
          if (!isSafeRedirectUrl(data.payment_link)) {
            note('קישור התשלום שהתקבל אינו תקין.', true);
            return;
          }
          const payBtn = $('pay');
          payBtn.hidden = false;
          payBtn.textContent = 'עבור לתשלום';
          payBtn.onclick = () => { location.href = data.payment_link; };
        } else {
          note('ההזמנה נטענה, אך עדיין לא הוגדר קישור תשלום למוצר.', true);
        }
      } catch (error) {
        note(error.message || 'שגיאה בטעינת ההזמנה', true);
      }
    }

    async function init() {
      if (rawPlan) {
        renderPlan(rawPlan);
        return;
      }
      await renderOrder(orderId);
    }

    init();
  </script>
</body>
</html>

<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8fafc">
  <title>ConversaPay - תשלום</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/html/conversapay-ui.css">
</head>
<body class="cp-page">
  <header class="cp-topbar">
    <a class="cp-brand" href="/"><span class="cp-brand-mark">CP</span><span>ConversaPay</span></a>
    <a class="cp-backlink" href="/">חזרה לדף הבית</a>
  </header>

  <main class="cp-shell cp-center-shell">
    <section class="cp-card cp-card-lg">
      <div class="cp-stack cp-mb-lg">
        <h1>תשלום מאובטח</h1>
        <p class="cp-muted" id="meta">טוען פרטי הזמנה...</p>
      </div>
      <section class="cp-list" id="summary"></section>
      <div id="notice" class="cp-notice" hidden></div>
      <div class="cp-actions cp-mt-lg">
        <button class="cp-button" id="pay" hidden type="button">המשך לתשלום</button>
        <a class="cp-button-secondary" href="/">חזרה לעמוד הבית</a>
      </div>
    </section>
  </main>

  <script>
    const API = '/api/v1';
    const LOGIN_ROUTE = '/login';
    const params = new URLSearchParams(location.search);
    const orderId = params.get('order_id') || params.get('order') || params.get('id');
    const rawPlan = (params.get('plan') || '').toLowerCase();
    const allowedPlans = {
      pro: { label: 'PRO', price: '₪200/חודש' },
      premium: { label: 'PREMIUM', price: '₪350/חודש' }
    };
    const $ = (id) => document.getElementById(id);

    function note(message, isError = false) {
      $('notice').textContent = message;
      $('notice').className = isError ? 'cp-notice error' : 'cp-notice';
      $('notice').hidden = false;
    }

    function getToken() {
      return (
        localStorage.getItem('access_token') ||
        localStorage.getItem('conversapay_auth_token') ||
        sessionStorage.getItem('access_token') ||
        sessionStorage.getItem('conversapay_auth_token')
      );
    }

    function clearSummary() { $('summary').textContent = ''; }

    function appendSummaryRow(label, value, badgeClass = 'cp-badge') {
      const row = document.createElement('div');
      row.className = 'cp-list-item';
      row.innerHTML = `<div class="cp-list-meta"><strong>${label}</strong></div><span class="${badgeClass}">${value}</span>`;
      $('summary').appendChild(row);
    }

    function isSafeRedirectUrl(value) {
      try {
        const url = new URL(value, location.origin);
        return url.origin === location.origin || url.protocol === 'https:';
      } catch (_) {
        return false;
      }
    }

    async function startPlanCheckout(plan) {
      const token = getToken();
      if (!token) {
        location.href = `${LOGIN_ROUTE}?next=${encodeURIComponent(location.pathname + location.search)}`;
        return;
      }

      const payBtn = $('pay');
      payBtn.disabled = true;
      const originalText = payBtn.textContent;
      payBtn.textContent = 'מעבד...';

      try {
        const meResponse = await fetch(`${API}/auth/me`, { headers: { Authorization: `Bearer ${token}` } });
        const user = await meResponse.json().catch(() => ({}));
        if (!meResponse.ok) throw new Error('לא ניתן לאמת את המשתמש');

        const response = await fetch(`${API}/payments/create-checkout-session`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: user.user_id, email: user.email, plan_type: plan })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.url) throw new Error(data.detail || 'שגיאה ביצירת תשלום');
        if (!isSafeRedirectUrl(data.url)) throw new Error('התקבל קישור תשלום לא תקין');
        location.href = data.url;
      } catch (error) {
        note(error.message || 'שגיאה ביצירת תשלום', true);
        payBtn.disabled = false;
        payBtn.textContent = originalText;
      }
    }

    function renderPlan(plan) {
      const planConfig = allowedPlans[plan];
      if (!planConfig) {
        note('התוכנית שביקשת אינה נתמכת.', true);
        $('meta').textContent = 'לא ניתן להציג את פרטי התוכנית';
        return;
      }

      $('meta').textContent = `שדרוג מסלול ${planConfig.label}`;
      clearSummary();
      appendSummaryRow('מסלול', planConfig.label, 'cp-badge');
      appendSummaryRow('מחיר', planConfig.price, 'cp-badge good');

      const payBtn = $('pay');
      payBtn.hidden = false;
      payBtn.textContent = 'המשך לתשלום';
      payBtn.onclick = () => startPlanCheckout(plan);
    }

    async function renderOrder(orderIdValue) {
      if (!orderIdValue) {
        note('מספר הזמנה לא נמצא בכתובת', true);
        return;
      }

      try {
        const response = await fetch(`${API}/orders/${encodeURIComponent(orderIdValue)}/public`);
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.detail || 'שגיאה בטעינת ההזמנה');

        $('meta').textContent = `הזמנה ${data.order_number || orderIdValue}`;
        clearSummary();

        const items = Array.isArray(data.items) ? data.items : [];
        items.forEach((item) => {
          const quantity = Number(item.quantity || 1);
          const price = Number(item.price || 0).toFixed(2);
          appendSummaryRow(`${String(item.name || 'מוצר')} × ${quantity}`, `₪${price}`);
        });
        appendSummaryRow('סה״כ', `₪${Number(data.total || 0).toFixed(2)}`, 'cp-badge good');

        if (data.payment_link) {
          if (!isSafeRedirectUrl(data.payment_link)) {
            note('קישור התשלום שהתקבל אינו תקין.', true);
            return;
          }
          const payBtn = $('pay');
          payBtn.hidden = false;
          payBtn.textContent = 'עבור לתשלום';
          payBtn.onclick = () => { location.href = data.payment_link; };
        } else {
          note('ההזמנה נטענה, אך עדיין לא הוגדר קישור תשלום למוצר.', true);
        }
      } catch (error) {
        note(error.message || 'שגיאה בטעינת ההזמנה', true);
      }
    }

    async function init() {
      if (rawPlan) { renderPlan(rawPlan); return; }
      await renderOrder(orderId);
    }

    init();
  </script>
</body>
</html>

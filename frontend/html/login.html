<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>כניסה לחשבון | Talk2Pay</title>
  <meta name="description" content="כניסה מאובטחת לחשבון Talk2Pay."><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="theme-color" content="#f7f5fb">
  <link rel="canonical" href="https://conversapay.org/login"><link rel="stylesheet" href="/frontend/html/conversapay-ui.css">
</head>
<body class="cp-page"><div class="cp-toast-wrap" id="toastWrap"></div><header class="cp-topbar"><a class="cp-brand" href="/" aria-label="Talk2Pay, דף הבית"><span class="cp-brand-mark" aria-hidden="true">T2P</span><span>Talk2Pay</span></a><a class="cp-backlink" href="/">חזרה לדף הבית</a></header>
<main class="cp-shell cp-auth-shell" id="main"><section class="cp-card" aria-labelledby="page-title"><div class="cp-stack cp-mb-md"><span class="cp-kicker">גישה לחשבון</span><h1 id="page-title">כניסה ל-Talk2Pay</h1><p class="cp-muted">ניהול העסק, ההזמנות והתשלומים.</p></div><form id="login-form" class="cp-stack"><div class="cp-field"><label class="cp-label" for="email">אימייל</label><input class="cp-input" id="email" name="email" type="email" inputmode="email" required autocomplete="username" autocapitalize="none" spellcheck="false"></div><div class="cp-field"><label class="cp-label" for="password">סיסמה</label><input class="cp-input" id="password" name="password" type="password" required autocomplete="current-password"></div><label class="cp-field" style="grid-template-columns:auto 1fr;align-items:center"><input id="remember" type="checkbox"><span>להשאיר אותי מחובר במכשיר הזה</span></label><button class="cp-button" id="submit" type="submit">כניסה</button></form><button class="cp-button-secondary cp-full cp-mt-sm" id="google" type="button"><span id="google-content" style="display:flex;align-items:center;justify-content:center;gap:10px"><svg width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>המשך עם Google</span></button><div class="cp-links cp-mt-md"><a class="cp-link" href="/forgot-password">שכחתי סיסמה</a><a class="cp-link" href="/register">הרשמה</a></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" crossorigin="anonymous"></script>
<script>
(()=>{'use strict';const API='/api/v1',DEFAULT_NEXT='/dashboard',$=id=>document.getElementById(id),form=$('login-form'),submit=$('submit'),google=$('google');let controller;
function showToast(text,type='error',duration=7000){const wrap=$('toastWrap');const t=document.createElement('div');t.className=`cp-toast ${type}`;t.setAttribute('role',type==='error'?'alert':'status');t.setAttribute('aria-live','polite');const icon=document.createElement('span');icon.className='cp-toast-icon';icon.textContent=type==='error'?'✕':'✓';const msg=document.createElement('span');msg.textContent=text;const close=document.createElement('button');close.className='cp-toast-close';close.setAttribute('aria-label','סגור');close.textContent='×';close.onclick=()=>dismiss(t);t.append(icon,msg,close);wrap.appendChild(t);setTimeout(()=>dismiss(t),duration)}function dismiss(t){if(!t.parentNode)return;t.classList.add('hide');setTimeout(()=>t.remove(),280)}
const safeNext=value=>{if(!value)return DEFAULT_NEXT;try{const url=new URL(value,location.origin);return url.origin===location.origin&&url.pathname.startsWith('/')?url.pathname+url.search+url.hash:DEFAULT_NEXT}catch{return DEFAULT_NEXT}};const next=safeNext(new URLSearchParams(location.search).get('next'));const storeSession=data=>{const storage=$('remember').checked?localStorage:sessionStorage;for(const target of [localStorage,sessionStorage]){target.removeItem('access_token');target.removeItem('conversapay_auth_token');target.removeItem('conversapay_user');target.removeItem('user_id');target.removeItem('email')}storage.setItem('access_token',data.access_token);storage.setItem('user_id',data.user_id||'')};
form.addEventListener('submit',async event=>{event.preventDefault();if(!form.reportValidity())return;controller?.abort();controller=new AbortController();submit.disabled=true;submit.textContent='מתחבר...';try{const response=await fetch(`${API}/auth/login`,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},credentials:'same-origin',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value}),signal:controller.signal}),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail==='email_not_verified'?'יש לאמת את האימייל לפני הכניסה':response.status===429?'בוצעו יותר מדי ניסיונות. נסו שוב בעוד כמה דקות.':data.detail||'אימייל או סיסמה שגויים');storeSession(data);sessionStorage.removeItem('auth_error');location.assign(next)}catch(error){if(error.name!=='AbortError')showToast(error.message||'לא ניתן להתחבר כרגע. נסו שוב.')}finally{submit.disabled=false;submit.textContent='כניסה'}});
google.addEventListener('click',async()=>{google.disabled=true;const content=document.getElementById('google-content');if(content){content.innerHTML='<span style="display:inline-block;width:18px;height:18px;border:2.5px solid #a78bfa;border-top-color:#7c3aed;border-radius:50%;animation:g-spin .7s linear infinite"></span><span>מתחבר...</span>';if(!document.getElementById('g-spin-style')){const s=document.createElement('style');s.id='g-spin-style';s.textContent='@keyframes g-spin{to{transform:rotate(360deg)}}';document.head.appendChild(s);}}try{if(!window.supabase)throw new Error('שירות ההתחברות לא נטען');sessionStorage.setItem('oauth_next',next);const response=await fetch(`${API}/config/public`,{headers:{Accept:'application/json'},credentials:'same-origin'}),config=await response.json();if(!response.ok||!config.supabase_url||!config.supabase_anon_key)throw new Error('הגדרות ההתחברות אינן זמינות');const client=window.supabase.createClient(config.supabase_url,config.supabase_anon_key),{error}=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:`${location.origin}/auth/callback`,skipBrowserRedirect:false}});if(error)throw error}catch(e){showToast('לא ניתן להתחבר עם Google כרגע. אפשר לנסות שוב או להשתמש באימייל וסיסמה.');google.disabled=false;const c=document.getElementById('google-content');if(c)c.innerHTML='<svg width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>המשך עם Google';}});
const oauthError=sessionStorage.getItem('auth_error');if(oauthError){sessionStorage.removeItem('auth_error');showToast('ההתחברות עם Google לא הושלמה. נסו שוב.')}})();
</script></body></html>

<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>כניסה לחשבון | Talk2Pay</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f7f5fb">
  <link rel="icon" type="image/png" href="/images/favicon-32x32.png"><link rel="stylesheet" href="/frontend/html/conversapay-ui.css">
</head>
<body class="cp-page"><header class="cp-topbar"><a class="cp-brand" href="/" aria-label="Talk2Pay, דף הבית"><span class="cp-brand-mark" aria-hidden="true">T2P</span><span>Talk2Pay</span></a><a class="cp-backlink" href="/">חזרה לדף הבית</a></header>
<main class="cp-shell cp-auth-shell" id="main"><section class="cp-card" aria-labelledby="title"><div class="cp-stack cp-mb-lg"><span class="cp-kicker">גישה לחשבון</span><h1 id="title">כניסה ל-Talk2Pay</h1><p class="cp-muted">ניהול העסק, השיחות והתשלומים שלך.</p></div><div id="notice" class="cp-notice error" role="alert" aria-live="polite" hidden></div><form id="login-form" class="cp-stack"><div class="cp-field"><label class="cp-label" for="email">אימייל</label><input class="cp-input" id="email" name="email" type="email" required autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false"></div><div class="cp-field"><label class="cp-label" for="password">סיסמה</label><input class="cp-input" id="password" name="password" type="password" required autocomplete="current-password"></div><label class="cp-field" style="grid-template-columns:auto 1fr;align-items:center"><input id="remember" type="checkbox"><span>להשאיר אותי מחובר במכשיר הזה</span></label><button class="cp-button" id="submit" type="submit">כניסה</button></form><button class="cp-button-secondary cp-full cp-mt-sm" id="google" type="button">המשך עם Google</button><div class="cp-links cp-mt-md"><a class="cp-link" href="/forgot-password">שכחתי סיסמה</a><a class="cp-link" href="/register">פתיחת חשבון</a></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" crossorigin="anonymous"></script>
<script>
(()=>{'use strict';const API='/api/v1',form=document.getElementById('login-form'),submit=document.getElementById('submit'),google=document.getElementById('google'),notice=document.getElementById('notice');let controller;const message=text=>{notice.textContent=text;notice.hidden=false};const destination=()=>{const raw=new URLSearchParams(location.search).get('next');if(!raw)return'/dashboard';try{const url=new URL(raw,location.origin);return url.origin===location.origin?url.pathname+url.search+url.hash:'/dashboard'}catch{return'/dashboard'}};const clearAuthError=()=>{localStorage.removeItem('auth_error');sessionStorage.removeItem('auth_error')};const storeSession=data=>{const storage=document.getElementById('remember').checked?localStorage:sessionStorage;localStorage.removeItem('access_token');sessionStorage.removeItem('access_token');storage.setItem('access_token',data.access_token);storage.setItem('user_id',data.user_id);storage.setItem('email',data.email||'')};form.addEventListener('submit',async event=>{event.preventDefault();controller?.abort();controller=new AbortController();submit.disabled=true;submit.textContent='מתחבר...';notice.hidden=true;try{const response=await fetch(`${API}/auth/login`,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({email:form.email.value.trim(),password:form.password.value}),signal:controller.signal,credentials:'same-origin'}),data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.detail==='email_not_verified'?'יש לאמת את האימייל לפני הכניסה':data.detail||'אימייל או סיסמה שגויים');clearAuthError();storeSession(data);location.assign(destination())}catch(error){if(error.name!=='AbortError')message(error.message||'לא הצלחנו להתחבר. נסו שוב.')}finally{submit.disabled=false;submit.textContent='כניסה'}});google.addEventListener('click',async()=>{google.disabled=true;google.textContent='מעביר ל-Google...';notice.hidden=true;try{const response=await fetch(`${API}/config/public`,{headers:{Accept:'application/json'},credentials:'same-origin'});if(!response.ok)throw Error();const config=await response.json();if(!window.supabase||!config.supabase_url||!config.supabase_anon_key)throw Error();const client=window.supabase.createClient(config.supabase_url,config.supabase_anon_key);const {error}=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:`${location.origin}/auth/callback`}});if(error)throw error}catch{message('לא הצלחנו להתחבר עם Google. אפשר לנסות שוב או להיכנס עם אימייל.');google.disabled=false;google.textContent='המשך עם Google'}});if(localStorage.getItem('auth_error')||sessionStorage.getItem('auth_error')){clearAuthError();message('ההתחברות עם Google לא הושלמה. אפשר לנסות שוב.')}})();
</script></body></html>

<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>כניסה לחשבון | Talk2Pay</title>
  <meta name="description" content="כניסה מאובטחת לחשבון Talk2Pay."><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="theme-color" content="#f7f5fb">
  <link rel="canonical" href="https://conversapay.org/login"><link rel="stylesheet" href="/frontend/html/conversapay-ui.css">
</head>
<body class="cp-page"><a class="skip-link" href="#main">דלגו לטופס הכניסה</a><header class="cp-topbar"><a class="cp-brand" href="/" aria-label="Talk2Pay, דף הבית"><span class="cp-brand-mark" aria-hidden="true">T2P</span><span>Talk2Pay</span></a><a class="cp-backlink" href="/">חזרה לדף הבית</a></header>
<main class="cp-shell cp-auth-shell" id="main"><section class="cp-card" aria-labelledby="page-title"><div class="cp-stack cp-mb-md"><span class="cp-kicker">גישה לחשבון</span><h1 id="page-title">כניסה ל-Talk2Pay</h1><p class="cp-muted">ניהול העסק, ההזמנות והתשלומים.</p></div><form id="login-form" class="cp-stack" novalidate><div class="cp-field"><label class="cp-label" for="email">אימייל</label><input class="cp-input" id="email" name="email" type="email" inputmode="email" required autocomplete="email" autocapitalize="none" spellcheck="false"></div><div class="cp-field"><label class="cp-label" for="password">סיסמה</label><input class="cp-input" id="password" name="password" type="password" required autocomplete="current-password"></div><button class="cp-button" id="submit" type="submit">כניסה</button></form><button class="cp-button-secondary cp-full cp-mt-sm" id="google" type="button">המשך עם Google</button><p id="notice" class="cp-notice error" role="alert" aria-live="assertive" hidden></p><div class="cp-links cp-mt-md"><a class="cp-link" href="/forgot-password">שכחתי סיסמה</a><a class="cp-link" href="/register">הרשמה</a></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script>
(()=>{'use strict';const API='/api/v1',DEFAULT_NEXT='/dashboard',$=id=>document.getElementById(id),form=$('login-form'),submit=$('submit'),google=$('google'),notice=$('notice');let controller;const safeNext=value=>{if(!value)return DEFAULT_NEXT;try{const url=new URL(value,location.origin);return url.origin===location.origin&&url.pathname.startsWith('/')?url.pathname+url.search+url.hash:DEFAULT_NEXT}catch{return DEFAULT_NEXT}};const next=safeNext(new URLSearchParams(location.search).get('next'));const show=message=>{notice.textContent=message;notice.hidden=false};const clear=()=>{notice.textContent='';notice.hidden=true};const storeSession=data=>{localStorage.removeItem('conversapay_auth_token');localStorage.removeItem('conversapay_user');localStorage.setItem('access_token',data.access_token);localStorage.setItem('user_id',data.user_id||'');localStorage.removeItem('email')};form.addEventListener('submit',async event=>{event.preventDefault();clear();if(!form.reportValidity())return;controller?.abort();controller=new AbortController();submit.disabled=true;submit.textContent='מתחבר...';try{const response=await fetch(`${API}/auth/login`,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value}),signal:controller.signal}),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail==='email_not_verified'?'יש לאמת את האימייל לפני הכניסה':response.status===429?'בוצעו יותר מדי ניסיונות. נסו שוב בעוד כמה דקות.':data.detail||'אימייל או סיסמה שגויים');storeSession(data);sessionStorage.removeItem('auth_error');location.assign(next)}catch(error){if(error.name!=='AbortError')show(error.message||'לא ניתן להתחבר כרגע. נסו שוב.')}finally{submit.disabled=false;submit.textContent='כניסה'}});google.addEventListener('click',async()=>{clear();google.disabled=true;google.textContent='מעביר ל-Google...';try{if(!window.supabase)throw new Error('שירות ההתחברות לא נטען');sessionStorage.setItem('oauth_next',next);const response=await fetch(`${API}/config/public`,{headers:{Accept:'application/json'}}),config=await response.json();if(!response.ok||!config.supabase_url||!config.supabase_anon_key)throw new Error('הגדרות ההתחברות אינן זמינות');const client=window.supabase.createClient(config.supabase_url,config.supabase_anon_key),{error}=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:`${location.origin}/auth/callback`,skipBrowserRedirect:false}});if(error)throw error}catch{show('לא ניתן להתחבר עם Google כרגע. אפשר לנסות שוב או להשתמש באימייל וסיסמה.');google.disabled=false;google.textContent='המשך עם Google'}});const oauthError=sessionStorage.getItem('auth_error');if(oauthError){sessionStorage.removeItem('auth_error');show('ההתחברות עם Google לא הושלמה. נסו שוב.')}})();
</script></body></html>

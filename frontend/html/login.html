<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>כניסה לחשבון | Talk2Pay</title><meta name="description" content="כניסה מאובטחת לחשבון Talk2Pay."><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f7f8fc"><link rel="stylesheet" href="/frontend/html/conversapay-ui.css"><link rel="stylesheet" href="/frontend/css/language-switcher.css"><style>
body{background:radial-gradient(circle at 12% 4%,rgba(109,93,252,.14),transparent 28%),radial-gradient(circle at 88% 8%,rgba(34,199,220,.1),transparent 27%),linear-gradient(180deg,#fbfbff,#f5f6fb 58%,#fafafe)!important}.auth-check{position:fixed;inset:0;z-index:12000;background:#f7f8fc;display:grid;place-items:center;color:#74788c;font-family:"Segoe UI",Arial,sans-serif}.login-shell{min-height:calc(100vh - 88px);display:grid;place-items:center;padding:30px 16px 70px}.login-card{width:min(470px,100%);position:relative;overflow:hidden;padding:34px!important;border-radius:28px!important;background:rgba(255,255,255,.9)!important;backdrop-filter:blur(20px);box-shadow:0 30px 85px rgba(35,27,88,.1)!important}.login-card::before{content:"";position:absolute;width:210px;height:210px;inset-inline-end:-100px;top:-115px;border-radius:50%;background:radial-gradient(circle,rgba(109,93,252,.17),transparent 68%);pointer-events:none}.login-kicker{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid rgba(109,93,252,.13);border-radius:999px;background:linear-gradient(135deg,rgba(109,93,252,.08),rgba(34,199,220,.06));color:#6255d8;font:700 .78rem/1.2 "Segoe UI",Arial,sans-serif;letter-spacing:.01em}.login-kicker::before{content:"✦";font-size:.72rem}.login-card h1{margin-top:14px;font-family:"Segoe UI",Arial,sans-serif;font-size:clamp(2rem,6vw,2.8rem);font-weight:750;letter-spacing:-.04em;color:#1b1c2f}.login-card .cp-muted{font-family:"Segoe UI",Arial,sans-serif;color:#74788d}.login-card .cp-label{font-family:"Segoe UI",Arial,sans-serif;font-weight:650}.login-card .cp-input{border-radius:14px!important;min-height:48px!important;background:rgba(255,255,255,.92)!important}.google-button{display:flex!important;align-items:center;justify-content:center;gap:10px!important;min-height:48px!important;border-radius:14px!important;background:#fff!important;border:1px solid #dddfe7!important;font-family:"Segoe UI",Arial,sans-serif!important;font-weight:650!important;color:#25273a!important;box-shadow:0 8px 22px rgba(27,25,58,.055)!important}.google-button:hover{border-color:#c9c6ef!important;background:#fafaff!important;transform:translateY(-1px)}.google-logo{width:19px;height:19px;flex:0 0 auto}.verify-layer{position:fixed;inset:0;z-index:9997;display:none;place-items:center;padding:24px;background:rgba(20,18,38,.5);backdrop-filter:blur(12px)}.verify-layer.show{display:grid}.verify-card{width:min(540px,100%);padding:28px;background:#fff;border:1px solid #ded9fb;border-radius:24px;box-shadow:0 30px 90px rgba(31,24,67,.28);position:relative}.verify-close{position:absolute;top:15px;inset-inline-end:15px;width:38px;height:38px;border:0;border-radius:12px;background:#f1f1f7;font-size:24px}.verify-code{direction:ltr;text-align:center;letter-spacing:10px;font-size:28px;font-weight:800}.verify-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.verify-actions>*{flex:1}@media(max-width:560px){.login-card{padding:25px!important}.login-shell{padding-top:18px}}
</style></head>
<body class="cp-page"><div id="authCheck" class="auth-check">בודק התחברות...</div><div class="cp-toast-wrap" id="toastWrap"></div><header class="cp-topbar"><a class="cp-brand" href="/"><span class="cp-brand-mark">T2P</span><span>Talk2Pay</span></a><a class="cp-backlink" href="/">חזרה לדף הבית</a></header><main class="login-shell"><section class="cp-card login-card"><div class="cp-stack cp-mb-md"><span class="login-kicker">גישה לחשבון</span><h1>כניסה ל‑Talk2Pay</h1><p class="cp-muted">ניהול העסק, ההזמנות והתשלומים — במקום אחד.</p></div><form id="login-form" class="cp-stack" novalidate><div class="cp-field"><label class="cp-label" for="email">אימייל</label><input class="cp-input" id="email" type="email" required autocomplete="username"></div><div class="cp-field"><label class="cp-label" for="password">סיסמה</label><input class="cp-input" id="password" type="password" required autocomplete="current-password"></div><label class="cp-field" style="grid-template-columns:auto 1fr;align-items:center"><input id="remember" type="checkbox"><span>להשאיר אותי מחובר במכשיר הזה</span></label><button class="cp-button" id="submit" type="submit">כניסה</button></form><button class="cp-button-secondary cp-full cp-mt-sm google-button" id="google" type="button"><svg class="google-logo" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.205c0-.638-.057-1.252-.164-1.841H9v3.482h4.844a4.14 4.14 0 0 1-1.797 2.715v2.258h2.909c1.702-1.567 2.684-3.874 2.684-6.614Z"/><path fill="#34A853" d="M9 18c2.43 0 4.468-.806 5.956-2.181l-2.91-2.258c-.805.54-1.834.859-3.046.859-2.344 0-4.328-1.585-5.037-3.714H.956v2.332A9 9 0 0 0 9 18Z"/><path fill="#FBBC05" d="M3.963 10.706A5.41 5.41 0 0 1 3.682 9c0-.592.102-1.168.281-1.706V4.962H.956A9 9 0 0 0 0 9c0 1.452.347 2.827.956 4.038l3.007-2.332Z"/><path fill="#EA4335" d="M9 3.58c1.322 0 2.508.455 3.441 1.346l2.582-2.582C13.464.892 11.427 0 9 0A9 9 0 0 0 .956 4.962l3.007 2.332C4.672 5.165 6.656 3.58 9 3.58Z"/></svg><span>המשך עם Google</span></button><div class="cp-links cp-mt-md"><a class="cp-link" href="/forgot-password">שכחתי סיסמה</a><a class="cp-link" href="/register">הרשמה</a></div></section></main>
<div class="verify-layer" id="verifyLayer"><section class="verify-card" role="dialog" aria-modal="true"><button class="verify-close" id="verifyClose">×</button><span class="cp-kicker">אימות אימייל</span><h2 style="margin-top:8px">החשבון עדיין לא אומת</h2><p class="cp-muted" style="margin:10px 0 18px">שלחנו קוד בן 6 ספרות ל־<strong id="verifyEmail"></strong>.</p><input class="cp-input verify-code" id="verifyCode" maxlength="6" inputmode="numeric" autocomplete="one-time-code" placeholder="000000"><div class="verify-actions"><button class="cp-button" id="verifyButton" type="button">אימות וכניסה</button><button class="cp-button-secondary" id="resendButton" type="button">שלח קוד חדש</button></div><p class="cp-muted" id="verifyMeta" style="margin-top:10px;font-size:.85rem"></p></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" crossorigin="anonymous"></script>
<script>
(()=>{'use strict';const API='/api/v1',$=id=>document.getElementById(id),form=$('login-form'),submit=$('submit'),google=$('google');let pendingLogin=null;
function currentToken(){return localStorage.getItem('access_token')||localStorage.getItem('conversapay_auth_token')||sessionStorage.getItem('access_token')||sessionStorage.getItem('conversapay_auth_token')}
async function routeForToken(t){const r=await fetch(API+'/auth/me',{headers:{Authorization:'Bearer '+t}});if(!r.ok)throw 0;const d=await r.json();return d.requires_business_onboarding?'/onboarding':'/dashboard'}
(async()=>{const t=currentToken();if(!t){$('authCheck').remove();return}try{location.replace(await routeForToken(t))}catch(_){$('authCheck').remove()}})();
function showToast(text,type='error'){const wrap=$('toastWrap'),t=document.createElement('div');t.className='cp-toast '+type;t.innerHTML='<span class="cp-toast-icon">'+(type==='error'?'✕':'✓')+'</span><span></span><button class="cp-toast-close">×</button>';t.children[1].textContent=text;t.children[2].onclick=()=>t.remove();wrap.appendChild(t)}
function validEmail(value){return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value)}
function storeSession(data){const storage=$('remember').checked?localStorage:sessionStorage;for(const target of [localStorage,sessionStorage])['access_token','conversapay_auth_token','conversapay_user','user_id','email'].forEach(k=>target.removeItem(k));storage.setItem('access_token',data.access_token);storage.setItem('user_id',data.user_id||'')}
async function login(email,password){const r=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})}),d=await r.json().catch(()=>({}));if(!r.ok){const e=Error(typeof d.detail==='string'?d.detail:'login_failed');e.status=r.status;throw e}return d}
form.onsubmit=async e=>{e.preventDefault();const email=$('email').value.trim().toLowerCase(),password=$('password').value;if(!validEmail(email))return showToast('כתובת האימייל אינה תקינה.');if(!password)return showToast('יש להזין סיסמה.');pendingLogin={email,password};submit.disabled=true;submit.textContent='מתחבר...';try{const d=await login(pendingLogin.email,pendingLogin.password);storeSession(d);location.replace(await routeForToken(d.access_token))}catch(err){if(err.message==='email_not_verified'){openVerify(pendingLogin.email)}else showToast(err.status===429?'בוצעו יותר מדי ניסיונות. נסה שוב בעוד כמה דקות.':'אימייל או סיסמה שגויים.')}finally{submit.disabled=false;submit.textContent='כניסה'}};
function openVerify(email){$('verifyEmail').textContent=email;$('verifyMeta').textContent='';$('verifyCode').value='';$('verifyLayer').classList.add('show');setTimeout(()=>$('verifyCode').focus(),50)}$('verifyClose').onclick=()=>$('verifyLayer').classList.remove('show');
$('resendButton').onclick=async()=>{if(!pendingLogin)return;const b=$('resendButton');b.disabled=true;$('verifyMeta').textContent='שולח...';try{const r=await fetch(API+'/auth/resend-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:pendingLogin.email})}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'שליחת הקוד נכשלה');$('verifyMeta').textContent='קוד חדש נשלח. בדוק גם בספאם.'}catch(e){showToast(e.message||'שליחת הקוד נכשלה')}finally{b.disabled=false}};
$('verifyButton').onclick=async()=>{if(!pendingLogin)return;const code=$('verifyCode').value.trim();if(!/^\d{6}$/.test(code))return showToast('יש להזין קוד בן 6 ספרות.');const b=$('verifyButton');b.disabled=true;b.textContent='מאמת...';try{let r=await fetch(API+'/auth/verify-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:pendingLogin.email,code})}),d=await r.json().catch(()=>({}));if(!r.ok){const m={verification_code_invalid:'הקוד אינו נכון.',verification_code_expired:'הקוד פג תוקף. שלח קוד חדש.',verification_failed:'אימות האימייל נכשל. נסה שוב.'};throw Error(m[d.detail]||d.detail||'האימות נכשל')}d=await login(pendingLogin.email,pendingLogin.password);storeSession(d);location.replace(await routeForToken(d.access_token))}catch(e){showToast(e.message||'האימות נכשל')}finally{b.disabled=false;b.textContent='אימות וכניסה'}};
google.onclick=async()=>{google.disabled=true;const label=google.querySelector('span');if(label)label.textContent='מתחבר...';try{if(!window.supabase)throw Error();const response=await fetch(API+'/config/public'),config=await response.json();const client=window.supabase.createClient(config.supabase_url,config.supabase_anon_key);sessionStorage.setItem('oauth_next','/dashboard');const {error}=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/auth/callback'}});if(error)throw error}catch(_){showToast('לא ניתן להתחבר עם Google כרגע.');google.disabled=false;if(label)label.textContent='המשך עם Google'}}})();
</script><script src="/frontend/js/language-switcher.js"></script></body></html>

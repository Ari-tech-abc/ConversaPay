<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ConversaPay | פניות נכנסות</title>
  <link rel="stylesheet" href="/frontend/html/conversapay-ui.css">
  <style>
    .leads-shell{display:grid;gap:18px}.leads-head{display:flex;align-items:end;justify-content:space-between;gap:18px;flex-wrap:wrap}.leads-head h1{margin:0}.leads-actions{display:flex;gap:10px;flex-wrap:wrap}.leads-toolbar{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:12px}.lead-list{display:grid;gap:10px}.lead-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start;padding:18px;border:1px solid var(--cp-line);border-radius:16px;background:var(--cp-panel-strong)}.lead-main{display:grid;gap:6px;min-width:0}.lead-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.lead-message{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--cp-muted-strong)}.lead-side{display:grid;gap:10px;justify-items:end}.lead-side select{min-height:40px}.empty-state{padding:34px;text-align:center;color:var(--cp-muted);border:1px dashed var(--cp-line);border-radius:16px}.count{font-variant-numeric:tabular-nums;color:var(--cp-accent-ink);font-weight:800}@media(max-width:640px){.leads-toolbar{grid-template-columns:1fr}.lead-row{grid-template-columns:1fr}.lead-side{justify-items:stretch}.lead-side>*{width:100%}}
  </style>
</head>
<body class="cp-page">
  <header class="cp-topbar"><a class="cp-brand" href="/dashboard"><span class="cp-brand-mark">CP</span><span>ConversaPay</span></a><a class="cp-backlink" href="/dashboard">חזרה ללוח הבקרה</a></header>
  <main class="cp-shell leads-shell">
    <section class="cp-panel leads-head"><div><span class="cp-kicker">פניות נכנסות</span><h1>פניות מהאתרים שלך</h1><p class="cp-muted">כל פנייה שנשלחה מטופס Site Builder, עם סטטוס וטיפול מסודר.</p></div><div class="leads-actions"><button class="cp-button-secondary" id="refresh" type="button">רענון</button><a class="cp-button" href="/setup-guide">מדריך הטמעה</a></div></section>
    <section class="cp-panel cp-stack"><div class="leads-toolbar"><input class="cp-input" id="search" type="search" placeholder="חיפוש לפי שם, אימייל או הודעה" aria-label="חיפוש פניות"><select class="cp-input" id="status" aria-label="סינון לפי סטטוס"><option value="">כל הסטטוסים</option><option value="new">חדשה</option><option value="contacted">נוצר קשר</option><option value="qualified">מתאימה</option><option value="converted">הומרה</option><option value="archived">בארכיון</option></select></div><p id="summary" class="cp-muted">טוען פניות...</p><div id="notice" class="cp-notice error" role="alert" hidden></div><div id="list" class="lead-list" aria-live="polite"></div></section>
  </main>
  <script>
    (()=>{'use strict';const API='/api/v1/site-builder/leads',token=localStorage.getItem('access_token')||sessionStorage.getItem('access_token')||localStorage.getItem('conversapay_auth_token')||sessionStorage.getItem('conversapay_auth_token'),$=id=>document.getElementById(id),state={items:[]};const statusLabels={new:'חדשה',contacted:'נוצר קשר',qualified:'מתאימה',converted:'הומרה',archived:'בארכיון'};function showError(message){$('notice').textContent=message;$('notice').hidden=false}function moneyDate(value){try{return new Date(value).toLocaleString('he-IL',{dateStyle:'medium',timeStyle:'short'})}catch{return 'לא ידוע'}}function render(){const query=$('search').value.trim().toLowerCase(),filter=$('status').value,items=state.items.filter(item=>{const hay=[item.name,item.email,item.message,item.company].join(' ').toLowerCase();return(!query||hay.includes(query))&&(!filter||item.status===filter)});$('summary').innerHTML=`מציג <span class="count">${items.length}</span> מתוך ${state.items.length} פניות`;const root=$('list');root.textContent='';if(!items.length){root.innerHTML='<div class="empty-state">אין פניות שתואמות לסינון הנוכחי.</div>';return}items.forEach(item=>{const row=document.createElement('article');row.className='lead-row';const main=document.createElement('div');main.className='lead-main';const meta=document.createElement('div');meta.className='lead-meta';const name=document.createElement('strong');name.textContent=item.name;const email=document.createElement('a');email.className='cp-link';email.href=`mailto:${encodeURIComponent(item.email)}`;email.textContent=item.email;meta.append(name,email);const company=document.createElement('small');company.className='cp-muted';company.textContent=item.company||'';const message=document.createElement('div');message.className='lead-message';message.textContent=item.message;main.append(meta,company,message);const side=document.createElement('div');side.className='lead-side';const date=document.createElement('small');date.className='cp-muted';date.textContent=moneyDate(item.created_at);const select=document.createElement('select');select.className='cp-input';Object.entries(statusLabels).forEach(([value,label])=>{const option=document.createElement('option');option.value=value;option.textContent=label;option.selected=value===item.status;select.append(option)});select.addEventListener('change',()=>updateStatus(item.id,select.value,select));side.append(date,select);row.append(main,side);root.append(row)})}async function load(){if(!token){location.href='/login';return}try{const response=await fetch(API,{headers:{Authorization:`Bearer ${token}`,Accept:'application/json'}});if(response.status===401){location.href='/login';return}const data=await response.json();if(!response.ok)throw Error(data.detail||'לא ניתן לטעון את הפניות');state.items=Array.isArray(data.items)?data.items:[];$('notice').hidden=true;render()}catch(error){showError(error.message||'לא ניתן לטעון את הפניות')}}async function updateStatus(id,status,select){select.disabled=true;try{const response=await fetch(`${API}/${encodeURIComponent(id)}`,{method:'PATCH',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({status})});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.detail||'עדכון הסטטוס נכשל');const item=state.items.find(x=>x.id===id);if(item)item.status=data.status||status;render()}catch(error){showError(error.message||'עדכון הסטטוס נכשל');render()}}$('refresh').onclick=load;$('search').oninput=render;$('status').onchange=render;load()})();
  </script>
</body>
</html>

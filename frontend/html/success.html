<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>ConversaPay | השדרוג הושלם</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/html/conversapay-ui.css">
</head>
<body class="cp-page">
  <header class="cp-topbar"><a class="cp-brand" href="/"><span class="cp-brand-mark">CP</span><span>ConversaPay</span></a><span class="cp-badge">Stripe</span></header>
  <main class="cp-shell cp-result-shell">
    <section class="cp-card cp-result-card" aria-live="polite">
      <div class="cp-result-icon good" aria-hidden="true">✓</div>
      <div class="cp-result-copy">
        <span class="cp-kicker cp-center-inline">אימות תשלום ושדרוג</span>
        <h1 id="title">אנחנו משלימים את השדרוג שלך</h1>
        <p class="cp-muted" id="description">אם התשלום ב-Stripe הושלם, המערכת תעדכן אוטומטית את המסלול ואת הפרופיל שלך.</p>
      </div>
      <span class="cp-pill-note">מצב בדיקות / Sandbox</span>
      <div class="cp-surface cp-text-start">
        <div id="statusBadge" class="cp-status-pill warn">ממתין לאימות</div>
        <p class="cp-muted cp-mt-md" id="statusText">בודק את מצב ה-session מול Stripe ומסנכרן את החשבון שלך.</p>
      </div>
      <div class="cp-surface cp-text-start" id="details" hidden>
        <strong>פרטי בדיקה</strong>
        <div class="cp-muted cp-break-all cp-mt-sm" id="detailsText"></div>
      </div>
      <div class="cp-actions cp-result-actions"><a class="cp-button" href="/dashboard">חזרה לדאשבורד</a><a class="cp-button-secondary" href="/upgrade">חזרה למסלולים</a></div>
    </section>
  </main>
  <script>
    const API='/api/v1',params=new URLSearchParams(location.search),sessionId=params.get('session_id'),token=localStorage.getItem('access_token')||localStorage.getItem('conversapay_auth_token')||sessionStorage.getItem('access_token')||sessionStorage.getItem('conversapay_auth_token');
    const title=document.getElementById('title'),description=document.getElementById('description'),statusBadge=document.getElementById('statusBadge'),statusText=document.getElementById('statusText'),details=document.getElementById('details'),detailsText=document.getElementById('detailsText');
    function setStatus(kind,label,text){statusBadge.className=`cp-status-pill ${kind}`;statusBadge.textContent=label;statusText.textContent=text}function setDetails(text){details.hidden=false;detailsText.textContent=text}
    async function confirmSession(){if(!sessionId){title.textContent='התשלום הושלם';description.textContent='לא התקבל session_id בכתובת, לכן לא ניתן לאמת אוטומטית את השדרוג. אפשר לחזור לדאשבורד ולרענן בעוד רגע.';setStatus('warn','נדרש אימות ידני','לא נמצא מזהה session בכתובת.');return}setDetails(`Session ID: ${sessionId}`);if(!token){title.textContent='התשלום התקבל';description.textContent='התשלום הועבר ל-Stripe, אבל צריך להתחבר כדי לסנכרן מיידית את הפרופיל והמסלול.';setStatus('warn','נדרשת התחברות','התחבר לחשבון ואז חזור לדאשבורד כדי לראות את העדכון.');return}try{const res=await fetch(`${API}/payments/confirm-session?session_id=${encodeURIComponent(sessionId)}`,{headers:{Authorization:`Bearer ${token}`}}),data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.detail||'אימות השדרוג נכשל');if(data.confirmed&&data.plan_type){const plan=String(data.plan_type||'pro').toUpperCase();title.textContent='השדרוג שלך הופעל בהצלחה';description.textContent=`החשבון והפרופיל עודכנו למסלול ${plan}. אפשר לחזור עכשיו לדאשבורד.`;setStatus('good',`מסלול ${plan} פעיל`,'הפרופיל סונכרן בהצלחה מול Stripe.');const extra=[];if(data.subscription_status)extra.push(`מצב מנוי: ${data.subscription_status}`);if(data.subscription_expires_at)extra.push(`תוקף נוכחי: ${data.subscription_expires_at}`);if(extra.length)setDetails(`Session ID: ${sessionId} | ${extra.join(' | ')}`);return}title.textContent='התשלום נקלט, הסנכרון עדיין ממתין';description.textContent='Stripe כבר החזיר אותנו בהצלחה, אבל המנוי עדיין לא סומן כסופי. בדרך כלל זה מסתדר דרך ה-webhook תוך זמן קצר.';setStatus('warn','ממתין ל-webhook','אם הדאשבורד עדיין מראה FREE, רענן בעוד כמה שניות.')}catch(err){title.textContent='התשלום נקלט, אבל הסנכרון לא הושלם';description.textContent='קיבלנו חזרה מ-Stripe, אך הייתה בעיה באימות האוטומטי של השדרוג. אפשר לחזור לדאשבורד ולנסות שוב.';setStatus('bad','שגיאת סנכרון',err.message||'לא ניתן היה לאמת את ה-session.')}}confirmSession();
  </script>
</body>
</html>

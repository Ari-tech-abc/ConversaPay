<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>שינוי סיסמת מנהל</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/frontend/html/conversapay-ui.css"></head>
<body class="cp-page"><main class="cp-shell" style="display:grid;place-items:center;min-height:100vh;padding-top:0;"><section class="cp-card" style="width:min(440px,100%);"><div class="cp-stack" style="margin-bottom:18px;"><h1>שינוי סיסמת מנהל</h1><p class="cp-muted">הסיסמה נשמרת כ‑hash בשרת ולא נחשפת בדפדפן.</p></div><form id="form" class="cp-stack"><div class="cp-field"><label class="cp-label" for="current">סיסמה נוכחית</label><input class="cp-input" id="current" type="password" autocomplete="current-password" required></div><div class="cp-field"><label class="cp-label" for="next">סיסמה חדשה, לפחות 12 תווים</label><input class="cp-input" id="next" type="password" autocomplete="new-password" minlength="12" required></div><div class="cp-field"><label class="cp-label" for="confirm">אימות סיסמה חדשה</label><input class="cp-input" id="confirm" type="password" autocomplete="new-password" minlength="12" required></div><button class="cp-button" type="submit">שמור סיסמה</button></form><div id="msg" class="cp-notice" role="alert" hidden></div><div class="cp-links" style="margin-top:18px;"><a class="cp-link" id="dashboardLink" href="/admin">חזרה לדאשבורד</a></div></section></main>
<script>
const dashboardLink=document.getElementById('dashboardLink'),hiddenAdminMatch=window.location.pathname.match(/^(\/admin-[^/]+)\/change-password$/);if(hiddenAdminMatch)dashboardLink.href=`${hiddenAdminMatch[1]}/dashboard`;
function getAdminToken(){return sessionStorage.getItem('admin_token')||localStorage.getItem('admin_token')}function clearAdminSession(){['admin_token','admin_email'].forEach(key=>{sessionStorage.removeItem(key);localStorage.removeItem(key)})}const token=getAdminToken();if(!token)location.href=hiddenAdminMatch?`${hiddenAdminMatch[1]}/login`:'/admin/login';
document.getElementById('form').onsubmit=async event=>{event.preventDefault();const message=document.getElementById('msg'),nextPassword=document.getElementById('next').value,confirmPassword=document.getElementById('confirm').value,submitButton=event.target.querySelector('button[type="submit"]'),originalText=submitButton.textContent;if(nextPassword!==confirmPassword){message.className='cp-notice error';message.hidden=false;message.textContent='הסיסמאות החדשות לא תואמות';return}submitButton.disabled=true;submitButton.textContent='שומר...';message.hidden=true;try{const response=await fetch('/api/v1/admin/change-password',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({current_password:document.getElementById('current').value,new_password:nextPassword})});if(response.status===401||response.status===403){clearAdminSession();location.href=hiddenAdminMatch?`${hiddenAdminMatch[1]}/login`:'/admin/login';return}if(!response.ok){const data=await response.json().catch(()=>({}));throw Error(data.detail||'השינוי נכשל')}message.className='cp-notice';message.hidden=false;message.textContent='הסיסמה שונתה בהצלחה';event.target.reset()}catch(error){message.className='cp-notice error';message.hidden=false;message.textContent=error.message||'שגיאה בתקשורת עם השרת'}finally{submitButton.disabled=false;submitButton.textContent=originalText}};
</script></body></html>

<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8fafc">
  <meta name="robots" content="noindex,nofollow">
  <title>שינוי סיסמת מנהל</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/html/conversapay-ui.css">
</head>
<body class="cp-page">
  <main class="cp-shell cp-center-shell">
    <section class="cp-card cp-card-sm">
      <div class="cp-stack cp-mb-md">
        <h1>שינוי סיסמת מנהל</h1>
        <p class="cp-muted">הסיסמה נשמרת כ‑hash בשרת ולא נחשפת בדפדפן.</p>
      </div>

      <form id="form" class="cp-stack">
        <div class="cp-field">
          <label class="cp-label" for="current">סיסמה נוכחית</label>
          <input class="cp-input" id="current" type="password" autocomplete="current-password" required>
        </div>
        <div class="cp-field">
          <label class="cp-label" for="next">סיסמה חדשה, לפחות 12 תווים</label>
          <input class="cp-input" id="next" type="password" autocomplete="new-password" minlength="12" required>
        </div>
        <div class="cp-field">
          <label class="cp-label" for="confirm">אימות סיסמה חדשה</label>
          <input class="cp-input" id="confirm" type="password" autocomplete="new-password" minlength="12" required>
        </div>
        <button class="cp-button" type="submit">שמור סיסמה</button>
      </form>

      <div id="msg" class="cp-notice" role="alert" hidden></div>
      <div class="cp-links cp-mt-md"><a class="cp-link" id="backToDashboard" href="/admin">חזרה לדאשבורד</a></div>
    </section>
  </main>

  <script>
    /*
     * Admin pages are served from a secret path when ADMIN_SECRET_PATH is set:
     *   /admin-<secret>/login | /admin-<secret>/dashboard | /admin-<secret>/change-password
     * When it is not set they fall back to:
     *   /admin/login | /admin | /admin/change-password
     * Hard-coded "/admin-login.html" style links are always 404 in production,
     * so every admin redirect is derived from the current path instead.
     */
    function adminBase() {
      const firstSegment = window.location.pathname.split('/').filter(Boolean)[0] || '';
      return firstSegment.startsWith('admin-') ? `/${firstSegment}` : '/admin';
    }

    function adminRoute(page) {
      const base = adminBase();
      if (page === 'dashboard') return base === '/admin' ? '/admin' : `${base}/dashboard`;
      return `${base}/${page}`;
    }

    function getAdminToken() {
      return sessionStorage.getItem('admin_token') || localStorage.getItem('admin_token');
    }

    function clearAdminSession() {
      sessionStorage.removeItem('admin_token');
      sessionStorage.removeItem('admin_email');
      localStorage.removeItem('admin_token');
      localStorage.removeItem('admin_email');
    }

    document.getElementById('backToDashboard').href = adminRoute('dashboard');

    const token = getAdminToken();
    if (!token) location.href = adminRoute('login');

    document.getElementById('form').onsubmit = async (event) => {
      event.preventDefault();
      const message = document.getElementById('msg');
      const nextPassword = document.getElementById('next').value;
      const confirmPassword = document.getElementById('confirm').value;
      const submitButton = event.target.querySelector('button[type="submit"]');
      const originalText = submitButton.textContent;

      if (nextPassword !== confirmPassword) {
        message.className = 'cp-notice error';
        message.hidden = false;
        message.textContent = 'הסיסמאות החדשות לא תואמות';
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'שומר...';
      message.hidden = true;
      message.textContent = '';

      try {
        const response = await fetch('/api/v1/admin/change-password', {
          method: 'POST',
          headers: {
            Authorization: 'Bearer ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            current_password: document.getElementById('current').value,
            new_password: nextPassword
          })
        });

        if (response.status === 401 || response.status === 403) {
          clearAdminSession();
          location.href = adminRoute('login');
          return;
        }

        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          message.className = 'cp-notice error';
          message.hidden = false;
          message.textContent = data.detail || 'השינוי נכשל';
          submitButton.disabled = false;
          submitButton.textContent = originalText;
          return;
        }

        message.className = 'cp-notice';
        message.hidden = false;
        message.textContent = 'הסיסמה שונתה בהצלחה';
        document.getElementById('form').reset();
        submitButton.disabled = false;
        submitButton.textContent = originalText;
      } catch (_) {
        message.className = 'cp-notice error';
        message.hidden = false;
        message.textContent = 'שגיאה בתקשורת עם השרת';
        submitButton.disabled = false;
        submitButton.textContent = originalText;
      }
    };
  </script>
</body>
</html>

<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>שינוי סיסמת מנהל</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1419;color:#f5f7fa;font:16px system-ui}main{width:min(420px,calc(100% - 32px));padding:32px;background:#1a1f2e;border:1px solid #ffffff18;border-radius:18px;box-shadow:0 20px 48px #0008}h1{margin-top:0}label{display:block;margin:16px 0 7px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ffffff22;border-radius:9px;background:#ffffff0d;color:inherit;font-size:1rem}.btn{width:100%;margin-top:20px;padding:13px;border:0;border-radius:9px;background:#6366f1;color:#fff;font-weight:700;cursor:pointer}.msg{min-height:1.3em;margin-top:14px}.error{color:#fca5a5}.ok{color:#6ee7b7}.back{display:inline-block;margin-top:18px;color:#c4b5fd}</style></head><body><main><h1>שינוי סיסמת מנהל</h1><p>הסיסמה נשמרת כ-hash בשרת ולא נחשפת בדפדפן.</p><form id="form"><label for="current">סיסמה נוכחית</label><input id="current" type="password" autocomplete="current-password" required><label for="next">סיסמה חדשה, לפחות 12 תווים</label><input id="next" type="password" autocomplete="new-password" minlength="12" required><label for="confirm">אימות סיסמה חדשה</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" required><button class="btn">שמור סיסמה</button></form><div id="msg" class="msg" role="alert"></div><a class="back" href="/admin-dashboard.html">חזרה לדאשבורד</a></main><script>const token=localStorage.getItem('admin_token');if(!token)location.href='/admin-login.html';document.getElementById('form').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('msg');const next=document.getElementById('next').value;if(next!==document.getElementById('confirm').value){msg.className='msg error';msg.textContent='הסיסמאות החדשות לא תואמות';return}const r=await fetch('/api/v1/admin/change-password',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({current_password:document.getElementById('current').value,new_password:next})});if(r.status===401||r.status===403){localStorage.removeItem('admin_token');location.href='/admin-login.html';return}if(!r.ok){const d=await r.json().catch(()=>({}));msg.className='msg error';msg.textContent=d.detail||'השינוי נכשל';return}msg.className='msg ok';msg.textContent='הסיסמה שונתה בהצלחה';document.getElementById('form').reset()};</script></body></html>

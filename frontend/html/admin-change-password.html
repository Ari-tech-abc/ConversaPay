<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>שינוי סיסמת מנהל</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f1419;
      color: #f5f7fa;
      font: 16px system-ui;
    }
    main {
      width: min(420px, calc(100% - 32px));
      padding: 32px;
      background: #1a1f2e;
      border: 1px solid #ffffff18;
      border-radius: 18px;
      box-shadow: 0 20px 48px #0008;
    }
    h1 { margin-top: 0; }
    label { display: block; margin: 16px 0 7px; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ffffff22;
      border-radius: 9px;
      background: #ffffff0d;
      color: inherit;
      font-size: 1rem;
    }
    .btn {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #6366f1;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .msg { min-height: 1.3em; margin-top: 14px; }
    .error { color: #fca5a5; }
    .ok { color: #6ee7b7; }
    .back { display: inline-block; margin-top: 18px; color: #c4b5fd; }
  </style>
</head>
<body>
  <main>
    <h1>שינוי סיסמת מנהל</h1>
    <p>הסיסמה נשמרת כ-hash בשרת ולא נחשפת בדפדפן.</p>

    <form id="form">
      <label for="current">סיסמה נוכחית</label>
      <input id="current" type="password" autocomplete="current-password" required>

      <label for="next">סיסמה חדשה, לפחות 12 תווים</label>
      <input id="next" type="password" autocomplete="new-password" minlength="12" required>

      <label for="confirm">אימות סיסמה חדשה</label>
      <input id="confirm" type="password" autocomplete="new-password" minlength="12" required>

      <button class="btn" type="submit">שמור סיסמה</button>
    </form>

    <div id="msg" class="msg" role="alert"></div>
    <a class="back" href="/admin-dashboard.html">חזרה לדאשבורד</a>
  </main>

  <script>
    function getAdminToken() {
      return sessionStorage.getItem('admin_token') || localStorage.getItem('admin_token');
    }

    function clearAdminSession() {
      sessionStorage.removeItem('admin_token');
      sessionStorage.removeItem('admin_email');
      localStorage.removeItem('admin_token');
      localStorage.removeItem('admin_email');
    }

    const token = getAdminToken();
    if (!token) location.href = '/admin-login.html';

    document.getElementById('form').onsubmit = async (event) => {
      event.preventDefault();
      const message = document.getElementById('msg');
      const nextPassword = document.getElementById('next').value;
      const confirmPassword = document.getElementById('confirm').value;
      const submitButton = event.target.querySelector('button[type="submit"]');
      const originalText = submitButton.textContent;

      if (nextPassword !== confirmPassword) {
        message.className = 'msg error';
        message.textContent = 'הסיסמאות החדשות לא תואמות';
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'שומר...';
      message.textContent = '';

      try {
        const response = await fetch('/api/v1/admin/change-password', {
          method: 'POST',
          headers: {
            Authorization: 'Bearer ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            current_password: document.getElementById('current').value,
            new_password: nextPassword
          })
        });

        if (response.status === 401 || response.status === 403) {
          clearAdminSession();
          location.href = '/admin-login.html';
          return;
        }

        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          message.className = 'msg error';
          message.textContent = data.detail || 'השינוי נכשל';
          submitButton.disabled = false;
          submitButton.textContent = originalText;
          return;
        }

        message.className = 'msg ok';
        message.textContent = 'הסיסמה שונתה בהצלחה';
        document.getElementById('form').reset();
        submitButton.disabled = false;
        submitButton.textContent = originalText;
      } catch (_) {
        message.className = 'msg error';
        message.textContent = 'שגיאה בתקשורת עם השרת';
        submitButton.disabled = false;
        submitButton.textContent = originalText;
      }
    };
  </script>
</body>
</html>

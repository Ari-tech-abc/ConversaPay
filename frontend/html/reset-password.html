<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ConversaPay - בחירת סיסמה חדשה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/html/conversapay-ui.css">
</head>
<body class="cp-page">
  <header class="cp-topbar">
    <a class="cp-brand" href="/"><span class="cp-brand-mark">CP</span><span>ConversaPay</span></a>
    <a class="cp-backlink" href="/login">חזרה לכניסה</a>
  </header>

  <main class="cp-shell cp-auth-shell">
    <section class="cp-card">
      <div class="cp-stack cp-mb-lg">
        <span class="cp-kicker">אבטחת החשבון</span>
        <h1>בחרו סיסמה חדשה</h1>
        <p class="cp-muted">הקישור תקף לזמן מוגבל. לאחר העדכון נעביר אתכם למסך הכניסה.</p>
      </div>

      <form id="resetForm" class="cp-stack">
        <div class="cp-field">
          <label class="cp-label" for="password">סיסמה חדשה, לפחות 8 תווים</label>
          <input class="cp-input" id="password" type="password" minlength="8" autocomplete="new-password" required>
        </div>
        <div class="cp-field">
          <label class="cp-label" for="confirm">אימות סיסמה</label>
          <input class="cp-input" id="confirm" type="password" minlength="8" autocomplete="new-password" required>
        </div>
        <button class="cp-button" id="submit" type="submit">עדכן סיסמה</button>
      </form>

      <div id="notice" class="cp-notice" hidden></div>

      <div class="cp-links cp-mt-lg">
        <a class="cp-link" href="/forgot-password">שלחו לי קישור חדש</a>
        <a class="cp-link" href="/login">חזרה לכניסה</a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const API = '/api/v1';
    const LOGIN_ROUTE = '/login';
    const FORGOT_ROUTE = '/forgot-password';
    const RESET_ROUTE = '/reset-password';

    const query = new URLSearchParams(location.search);
    const hash = new URLSearchParams(location.hash.slice(1));
    const token = query.get('token') || hash.get('access_token');

    const $ = (id) => document.getElementById(id);
    const note = (message, isError = false) => {
      $('notice').textContent = message;
      $('notice').className = isError ? 'cp-notice error' : 'cp-notice';
      $('notice').hidden = false;
    };

    (async () => {
      if (!token && hash.get('type') !== 'recovery') {
        note('לא נמצא קישור איפוס תקין בכתובת. בקשו קישור חדש.', true);
        $('submit').disabled = true;
        return;
      }
      // Strip the recovery token out of the visible URL.
      history.replaceState({}, document.title, RESET_ROUTE);
      try {
        const cfg = await (await fetch(`${API}/config/public`)).json();
        window.sb = window.supabase.createClient(cfg.supabase_url, cfg.supabase_anon_key);
      } catch (_) {
        // Fall back to the backend confirm endpoint below.
      }
    })();

    $('resetForm').onsubmit = async (event) => {
      event.preventDefault();
      const button = $('submit');
      const password = $('password').value;

      if (password.length < 8 || password !== $('confirm').value) {
        note('הסיסמה חייבת להכיל לפחות 8 תווים ולהיות זהה באימות', true);
        return;
      }

      button.disabled = true;
      const originalText = button.textContent;
      button.textContent = 'מעדכן...';

      try {
        if (window.sb) {
          const { error } = await window.sb.auth.updateUser({ password });
          if (error) throw error;
        } else {
          const response = await fetch(`${API}/auth/password-reset/confirm`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, new_password: password })
          });
          if (!response.ok) throw new Error();
        }
        note('הסיסמה עודכנה. מעביר לכניסה...');
        setTimeout(() => { location.href = LOGIN_ROUTE; }, 1800);
      } catch (_) {
        note('קישור האיפוס פג או אינו תקין. בקשו קישור חדש.', true);
        button.disabled = false;
        button.textContent = originalText;
      }
    };
  </script>
</body>
</html>

name: Check HTML links

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  html-links:
    name: Validate local HTML links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check every HTML page
        run: python scripts/check_html_links.py

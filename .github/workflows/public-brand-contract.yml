name: Public brand contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[brand-normalized]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize public brand
        run: python scripts/normalize_public_brand.py
      - name: Commit public brand changes
        run: |
          if git diff --quiet; then
            echo "Public brand is already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend backend conversapay-site-builder wordpress-plugin docs "MD files" main.py README.md SITE_AUDIT_REPORT.md SYSTEM_AUDIT_REPORT.md .env.example Dockerfile
          git commit -m "chore: normalize Talk2Pay public brand [brand-normalized]"
          git push origin main

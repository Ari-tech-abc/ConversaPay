name: backend-tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      SECRET_KEY: ci-secret
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci-anon
      SUPABASE_SERVICE_ROLE_KEY: ci-service
      GEMINI_API_KEY: ci-gemini
      RESEND_API_KEY: ci-resend
      EMAIL_FROM_ADDRESS: ci@example.com
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - name: Compile backend and delivery router
        run: python -m compileall -q backend main.py
      - name: Run UI and link quality gates
        run: |
          python scripts/ui_quality_gate.py
          python scripts/check_html_links.py
      - name: Run backend and frontend delivery contracts
        run: python -m pytest -q tests/test_frontend_delivery_contract.py tests/test_repo_contracts.py
      - name: Run full test suite
        run: python -m pytest -q

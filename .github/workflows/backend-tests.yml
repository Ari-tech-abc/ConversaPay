name: backend-tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: conversapay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d conversapay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: .
      SECRET_KEY: ci-secret
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci-anon
      SUPABASE_SERVICE_ROLE_KEY: ci-service
      GEMINI_API_KEY: ci-gemini
      RESEND_API_KEY: ci-resend
      EMAIL_FROM_ADDRESS: ci@example.com
      ENVIRONMENT: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/conversapay_test
      PGPASSWORD: postgres
      MIGRATIONS_AUTO_APPLY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Wait for Postgres
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -U postgres -d conversapay_test; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres never became ready" >&2
          exit 1
      - name: Apply CI-only Supabase shim (roles + auth schema)
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d conversapay_test -f ci/postgres_supabase_shim.sql
      - name: Apply canonical schema bootstrap
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d conversapay_test -f database/full_schema_bootstrap.sql
      - name: Verify schema landed
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d conversapay_test \
            -c '\dt public.*' \
            -c "select proname from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'public' order by 1;"
      - name: Compile backend and delivery router
        run: python -m compileall -q backend main.py
      - name: Assert GET /ready returns 200 from live uvicorn
        run: |
          set -euo pipefail
          uvicorn main:app --host 127.0.0.1 --port 8000 --log-level info > /tmp/app.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            code=$(curl -sS -o /tmp/ready.json -w '%{http_code}' http://127.0.0.1:8000/ready || true)
            if [ "$code" = "200" ]; then
              echo "HTTP $code"
              cat /tmp/ready.json
              echo
              grep -q '"status":"ready"' /tmp/ready.json
              echo '--- startup log (migration output) ---'
              cat /tmp/app.log
              exit 0
            fi
            sleep 1
          done
          echo '::error::/ready never returned 200'
          echo '--- last response body ---'
          cat /tmp/ready.json || true
          echo '--- app log ---'
          cat /tmp/app.log
          exit 1
      - name: Run backend and frontend delivery contracts
        run: python -m pytest -q tests/test_frontend_delivery_contract.py tests/test_repo_contracts.py
      - name: Run full test suite
        run: python -m pytest -q
      - name: Run UI and link quality gates
        run: |
          python scripts/ui_quality_gate.py
          python scripts/check_html_links.py

name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Python sources
        run: python -m compileall -q backend main.py scripts
      - name: Check frontend JavaScript syntax
        run: find frontend/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check HTML links
        run: python scripts/check_html_links.py
      - name: Check onboarding product flow contract
        run: python scripts/check_onboarding_contract.py
